# 原先由 research-auto 仓库里 gitignored 的 k8s/secrets.yaml 手工 apply；
# 2026-10-04 按现网原样写入 Bao 后改由 ESO 同名接管。secrets.yaml 仍作 break-glass。
# AWS_* 是 SeaweedFS 的 research-auto 专用身份，与 kv/k8s/seaweedfs-s3 中的同名身份
# 目前是两份副本。其中的 DATABASE_URL 已不再使用：Deployment 以 research-auto-pgprod（database.yaml）
# 覆盖它。旧的 research-auto-bootstrap-secret（CNPG superuser DSN）已于 2026-10-13 删除。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-auto-secret
  namespace: research-auto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: research-auto-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/research-auto
