# 两个 Secret 原先由 research-auto 仓库里 gitignored 的 k8s/secrets.yaml 手工 apply；
# 2026-10-04 按现网原样写入 Bao 后改由 ESO 同名接管。secrets.yaml 仍作 break-glass。
# AWS_* 是 SeaweedFS 的 research-auto 专用身份，与 kv/k8s/seaweedfs-s3 中的同名身份
# 目前是两份副本；DATABASE_URL 指向旧 CNPG shared-db，随应用迁移再改。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-auto-secret
  namespace: research-auto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: research-auto-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/research-auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-auto-bootstrap-secret
  namespace: research-auto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: research-auto-bootstrap-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/research-auto-bootstrap
