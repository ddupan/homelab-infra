# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/research-auto.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：research-auto-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
# api / worker（及其 initContainer）以 research-auto-pgprod 连接（2026-10-13 自 CNPG 迁入）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-auto-database
  namespace: research-auto
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: research-auto
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'research-auto-database'
          serviceAccountRef:
            name: 'research-auto-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable.
# Pods pick up a re-issued credential on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-auto-pgprod
  namespace: research-auto
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: research-auto-pgprod
    creationPolicy: Owner
    template:
      data:
        # psycopg/libpq URL；verify-full，CA 是 trust-manager 分发的 ConfigMap internal-ca（挂到 /etc/internal-ca）。
        # 应用经连接池 6432（PgBouncer，transaction 模式；不用 LISTEN/advisory lock/会话 SET）。
        DATABASE_URL: 'postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .host }}:6432/{{ .database }}?sslmode={{ .sslmode }}&sslrootcert=/etc/internal-ca/ca.pem'
        # initContainer 的 yoyo 迁移直连租户端口（5432），DDL 不经池。
        DATABASE_MIGRATE_URL: 'postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .database }}?sslmode={{ .sslmode }}&sslrootcert=/etc/internal-ca/ca.pem'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/1fde1e74-c2fa-4580-a7f0-93513bbee433
