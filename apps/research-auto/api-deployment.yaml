apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-auto-api
  namespace: research-auto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-auto-api
  template:
    metadata:
      labels:
        app: research-auto-api
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: migrate-db
          image: ghcr.io/panxiao81/research-auto:sha-bd9d594
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync", "research-auto", "setup", "bootstrap-db"]
          envFrom:
            - configMapRef:
                name: research-auto-config
          env:
            # yoyo 迁移（DDL）以租户角色直连 5432，不经连接池；不再需要 superuser。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: research-auto-pgprod
                  key: DATABASE_MIGRATE_URL
          volumeMounts:
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
      containers:
        - name: api
          image: ghcr.io/panxiao81/research-auto:sha-bd9d594
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync", "research-auto", "serve", "api", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: research-auto-config
            - secretRef:
                name: research-auto-secret
          volumeMounts:
            - name: github-copilot-auth
              mountPath: /home/appuser/.config/litellm/github_copilot
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            # pg-prod 连接池 6432；覆盖 envFrom research-auto-secret 里指向旧 CNPG 的同名键。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: research-auto-pgprod
                  key: DATABASE_URL
      volumes:
        - name: github-copilot-auth
          persistentVolumeClaim:
            claimName: research-auto-github-copilot-auth
        - name: internal-ca
          configMap:
            name: internal-ca
