# S3 AK/SK 由 apps/seaweedfs/terraform/artifact-keeper.tf 生成并写入 Bao，是唯一来源。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-keeper-s3
  namespace: artifact-keeper
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: artifact-keeper-s3
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: k8s/artifact-keeper-s3
        property: access_key
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: k8s/artifact-keeper-s3
        property: secret_key
---
# JWT 签名密钥与首次启动的管理员密码只存在于集群里，不进 Bao：丢失只意味着已签发的会话
# 失效（JWT），或在管理员已存在时无影响（INITIAL_ADMIN_PASSWORD 只在创建管理员时读取）。
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: artifact-keeper
  namespace: artifact-keeper
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-keeper-secrets
  namespace: artifact-keeper
spec:
  refreshPolicy: CreatedOnce
  target:
    name: artifact-keeper-secrets
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: artifact-keeper
      rewrite:
        - regexp: {source: '^password$', target: JWT_SECRET}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: artifact-keeper
      rewrite:
        - regexp: {source: '^password$', target: INITIAL_ADMIN_PASSWORD}
