# Client secret of the `artifact-keeper` client at the iam-login issuer (sso.ddupan.top). Terraform registers the
# client and writes the secret to bao (apps/iam-login/terraform/clients.tf); nobody handles it by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-keeper-sso
  namespace: artifact-keeper
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: artifact-keeper-sso
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: k8s/artifact-keeper-sso
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: k8s/artifact-keeper-sso
        property: client_secret
