# 只用作 CI 的 pull-through 缓存（Go/PyPI/Ansible Galaxy remote 仓库），替代 Nexus CE。
# chart 自带的 PG/OpenSearch/Trivy/DependencyTrack 全关：元数据在 pg-prod（Ayatori tenant），
# 制品在 SeaweedFS；OpenSearch 在后端是可选的，不设 OPENSEARCH_URL 即不启用搜索索引。
backend:
  image:
    # Galaxy remote 的修复（#4626）在 1.11.0；chart 默认的 1.10.2 不含。
    tag: "1.11.0@sha256:0e5aa79875aa74909793f863bc06af6843feefd4346c88097a782e7345b29974"
  env:
    RUST_LOG: info
    ENVIRONMENT: production
    STORAGE_BACKEND: s3
    S3_BUCKET: artifact-keeper
    S3_ENDPOINT: https://s3.lab.ddupan.top
    S3_REGION: us-east-1
    # iam-login 登录；启动时按这些变量建立/对齐 OIDC provider，OIDC_ADMIN_GROUP 以环境为准。
    OIDC_NAME: iam-login
    OIDC_ISSUER: https://sso.ddupan.top
    # 后端实际路由是 /api/v1/auth/sso/oidc/callback；官方文档写的 /api/v1/auth/oidc/callback 不存在，
    # 落到需认证的兜底路由，返回 401 + WWW-Authenticate: Basic（浏览器弹 basic auth 框）。
    OIDC_REDIRECT_URI: https://artifacts.lab.ddupan.top/api/v1/auth/sso/oidc/callback
    # 空格分隔（split_whitespace）；官方文档示例写的逗号是错的，会变成一个 scope。
    OIDC_SCOPES: openid profile email groups
    OIDC_ADMIN_GROUP: platform-admins
    # 后端的 SSRF 防护拒绝解析到私有地址的出站目标；sso.ddupan.top 在 LAN 解析到 Envoy Gateway
    # （192.168.10.127），不放行则启动时 OIDC 校验失败、进程退出。只放这一个地址，不用 SSO_ALLOW_PRIVATE_IPS。
    AK_SSRF_ALLOW_PRIVATE_CIDRS: 192.168.10.127/32
    # dockerd 的 registry-mirrors 请求 /v2/<image>/...，不带仓库 key；落到这个 remote（repositories.sh）。
    AK_DEFAULT_DOCKER_MIRROR_REPO: docker-hub
    # sqlx 池默认 max 50 / min 5，直连 pg-prod:5432（max_connections=80，见 database.yaml 为何不走池）
    # 时一家就吃掉六成，挤占其它租户。pull-through 缓存的并发远低于此；空闲连接 600 s 后释放。
    DATABASE_MAX_CONNECTIONS: "10"
    DATABASE_MIN_CONNECTIONS: "1"
  environmentSecrets:
    - name: S3_ACCESS_KEY_ID
      secretKeyRef: {name: artifact-keeper-s3, key: S3_ACCESS_KEY_ID}
    - name: S3_SECRET_ACCESS_KEY
      secretKeyRef: {name: artifact-keeper-s3, key: S3_SECRET_ACCESS_KEY}
    - name: OIDC_CLIENT_ID
      secretKeyRef: {name: artifact-keeper-sso, key: client_id}
    - name: OIDC_CLIENT_SECRET
      secretKeyRef: {name: artifact-keeper-sso, key: client_secret}
    # 只在首次启动创建管理员时读取；日常登录走 iam-login，本地 admin 留作 break-glass。
    - name: INITIAL_ADMIN_PASSWORD
      secretKeyRef: {name: artifact-keeper-secrets, key: INITIAL_ADMIN_PASSWORD}
  # 制品在 S3，/data 下只剩插件与备份目录，不需要 PVC。
  persistence:
    enabled: false
  # Trivy 关闭，不需要扫描工作区 PVC。
  scanWorkspace:
    enabled: false
  # namespace 是 restricted PSS；chart 默认缺 seccompProfile，与默认值合并后补上。
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}

web:
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}
  image:
    tag: "1.11.0@sha256:2ab52779fbd938afa7a1d4a0861ad56025d84984e39a537534ff97ed6bb7aeec"

secrets:
  # JWT_SECRET 来自 external-secret.yaml 的 Password 生成器。
  existingSecret: artifact-keeper-secrets

externalDatabase:
  existingSecret: artifact-keeper-db
  existingSecretKey: DATABASE_URL

postgres: {enabled: false}
opensearch: {enabled: false}
trivy: {enabled: false}
scannerAdapter: {enabled: false}
dependencyTrack: {enabled: false}

ingress: {enabled: false}
httpRoute:
  enabled: true
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - artifacts.lab.ddupan.top

# chart 的 NetworkPolicy 按 ingress-nginx 写死了入口，这里只放行 Envoy（networkpolicy.yaml）。
networkPolicy: {enabled: false}
