apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: nexus
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. The ad name
    # stays until every client has moved — see infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - nexus.ad.ddupan.top
    - nexus.lab.ddupan.top
  rules:
    - backendRefs:
        - name: nexus
          port: 8081
