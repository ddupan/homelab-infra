apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: nexus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Nexus"
    gethomepage.dev/group: "应用"
    gethomepage.dev/icon: "nexus.svg"
    gethomepage.dev/description: "包代理仓库"
    gethomepage.dev/href: "https://nexus.lab.ddupan.top/"
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. The ad name
    # stays until every client has moved — see infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - nexus.ad.ddupan.top
    - nexus.lab.ddupan.top
  rules:
    - backendRefs:
        - name: nexus
          port: 8081
