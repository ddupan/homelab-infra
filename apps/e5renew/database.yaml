# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/e5renew.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：e5renew-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e5renew-database
  namespace: e5renew
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: e5renew
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'e5renew-database'
          serviceAccountRef:
            name: 'e5renew-database'
---
# 应用要的整份 Secret（chart 的 existingSecret；键同 chart 的 templates/secret.yaml）：数据库来自 Ayatori 交付
# （本 namespace 的 SecretStore），Azure 与加密配置来自 kv/k8s/e5renew（共享 ClusterSecretStore，2026-10-13
# 自 helm values 迁入）。Ayatori 路径读最新版本：只有 Ayatori 写它，每个版本都可用；Pod 重启时生效。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e5renew
  namespace: e5renew
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: e5renew
    creationPolicy: Owner
    template:
      data:
        # 应用走连接池 6432（PgBouncer，transaction 模式）；pgx 的命名预编译语句在池上可用。
        # verify-full：CA 是 trust-manager 分发的 ConfigMap internal-ca，由 HelmRelease 挂到 /etc/internal-ca。
        database-dsn: "host={{ .host }} port=6432 dbname={{ .database }} user={{ .username }} password='{{ .password | replace `\\` `\\\\` | replace `'` `\\'` }}' sslmode={{ .sslmode }} sslrootcert=/etc/internal-ca/ca.pem"
        # 迁移 Job（golang-migrate）持有会话级 advisory lock，不能经 transaction 模式的池，直连租户端口。
        database-migrate-dsn: "host={{ .host }} port={{ .port }} dbname={{ .database }} user={{ .username }} password='{{ .password | replace `\\` `\\\\` | replace `'` `\\'` }}' sslmode={{ .sslmode }} sslrootcert=/etc/internal-ca/ca.pem"
        azuread-tenant: '{{ .azuread_tenant }}'
        azuread-client-id: '{{ .azuread_client_id }}'
        azuread-client-secret: '{{ .azuread_client_secret }}'
        usertoken-tenant: '{{ .usertoken_tenant }}'
        usertoken-client-id: '{{ .usertoken_client_id }}'
        usertoken-client-secret: '{{ .usertoken_client_secret }}'
        encryption-key: '{{ .encryption_key }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/f05cbf75-e4d1-47c7-a4af-9fa2e7f7e2f5
    - extract:
        key: k8s/e5renew
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: openbao
