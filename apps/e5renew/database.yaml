# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/e5renew.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：e5renew-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
# 生成的 Secret 在切换前不被任何工作负载引用。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e5renew-database
  namespace: e5renew
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: e5renew
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'e5renew-database'
          serviceAccountRef:
            name: 'e5renew-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable.
# Pods pick up a re-issued credential on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e5renew-pgprod
  namespace: e5renew
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: e5renew-pgprod
    creationPolicy: Owner
    template:
      data:
        host: '{{ .host }}'
        # 连接池入口（PgBouncer，transaction 模式）；租户凭据里的 port 是直连的 5432。
        port: '6432'
        database: '{{ .database }}'
        username: '{{ .username }}'
        password: '{{ .password }}'
        # verify-full：服务端证书由内部 CA 签发，CA 用 trust-manager 分发的 ConfigMap internal-ca（ca.pem）。
        sslmode: '{{ .sslmode }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/f05cbf75-e4d1-47c7-a4af-9fa2e7f7e2f5
