apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# e5renew 本体仍由 helm CLI 从 github.com/panxiao81/e5renew 的 chart 部署；这里只放 pg-prod 凭据。
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pgprod-ca
    namespace: e5renew
    files:
      - ca.crt=internal-ca.pem
resources:
  - database.yaml
