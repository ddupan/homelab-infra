apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: poweradmin
  namespace: poweradmin
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - dns.ad.ddupan.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: poweradmin
          port: 8080
