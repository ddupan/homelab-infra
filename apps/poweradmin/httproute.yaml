apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: poweradmin
  namespace: poweradmin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Poweradmin"
    gethomepage.dev/group: "平台"
    gethomepage.dev/icon: "powerdns.svg"
    gethomepage.dev/description: "DNS 记录"
    gethomepage.dev/href: "https://dns.lab.ddupan.top/"
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. The ad name
    # stays until every client has moved — see infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - dns.ad.ddupan.top
    - dns.lab.ddupan.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: poweradmin
          port: 8080
