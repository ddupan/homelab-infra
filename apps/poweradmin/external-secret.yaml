# Keys in kv/k8s/poweradmin are the container's env var names, so envFrom
# takes the Secret as-is:
#   PA_PDNS_API_KEY       same value as kv/k8s/powerdns api_key
#   PA_LDAP_BIND_PASSWORD same value as the samba-ad vault's vault_poweradmin_bind_password
#   PA_SESSION_KEY, PA_ADMIN_PASSWORD (local break-glass "admin")
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poweradmin
  namespace: poweradmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: poweradmin
  dataFrom:
    - extract:
        key: k8s/poweradmin
