apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: poweradmin-ingress
  namespace: poweradmin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: poweradmin
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 8080
          protocol: TCP
