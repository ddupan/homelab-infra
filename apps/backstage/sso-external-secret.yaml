# Client secret of Backstage's `backstage` client at the iam-login issuer (sso.ddupan.top). Terraform registers the
# client and writes the secret to bao (apps/iam-login/terraform/clients.tf); nobody handles it by hand. Kept apart
# from kv/k8s/backstage so Terraform owns this path whole.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-sso
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: backstage-sso
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: k8s/backstage-sso
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: k8s/backstage-sso
        property: client_secret
