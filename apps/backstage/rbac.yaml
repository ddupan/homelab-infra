apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-read-only
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - limitranges
      - pods
      - pods/log
      - resourcequotas
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources:
      - pods
    verbs: [get, list]
  # Flux objects for the entity Kubernetes tab (kubernetes.customResources in the
  # Backstage config). HelmReleases are left out on purpose: spec.values can
  # inline sensitive settings, and cluster-wide list would expose them to every
  # Backstage user with kubernetes.resources.read.
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources:
      - kustomizations
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources:
      - gitrepositories
      - helmrepositories
      - ocirepositories
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources:
      - imagepolicies
      - imagerepositories
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-read-only
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
