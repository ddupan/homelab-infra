apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: backstage
  dataFrom:
    - extract:
        key: k8s/backstage
  # Read-only TechDocs S3 identity; CI publishes with a separate writer.
  data:
    - secretKey: TECHDOCS_S3_ACCESS_KEY_ID
      remoteRef:
        key: k8s/techdocs-s3-reader
        property: access_key
    - secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: k8s/techdocs-s3-reader
        property: secret_key
