apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-ingress
  namespace: backstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 7007
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 192.168.10.127/32
      ports:
        - port: 7007
          protocol: TCP
