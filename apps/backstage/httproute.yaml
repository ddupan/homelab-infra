apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. See infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - backstage.ad.ddupan.top
    - backstage.lab.ddupan.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backstage
          port: 7007
