apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Backstage"
    gethomepage.dev/group: "应用"
    gethomepage.dev/icon: "backstage.svg"
    gethomepage.dev/description: "服务目录"
    gethomepage.dev/href: "https://backstage.lab.ddupan.top/"
spec:
  parentRefs:
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. See infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - backstage.lab.ddupan.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backstage
          port: 7007
---
# The old name only redirects: BACKSTAGE_BASE_URL and the OAuth callback are on the lab name, and a sign-in
# started on the ad name would lose its state at the callback. Remove with the Samba A record once unused.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage-ad-redirect
  namespace: backstage
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - backstage.ad.ddupan.top
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: backstage.lab.ddupan.top
            statusCode: 301
