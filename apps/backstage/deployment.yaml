apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    backstage.io/kubernetes-id: homelab-backstage
spec:
  replicas: 1
  # Backstage is multi-instance safe (scheduler locks, event bus, and auth keys
  # live in PostgreSQL), so surge one new pod and keep the old one serving
  # until it is ready. Migrations run on the new pod while the old one still
  # serves; revisit if an upgrade ships a backward-incompatible migration.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        backstage.io/kubernetes-id: homelab-backstage
    spec:
      serviceAccountName: backstage
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: zot.ad.ddupan.top/panxiao81/backstage:latest@sha256:ad5e051ade7d1b69ef620f2cd8c066b08f79e5058bcec5f77a1b97b90dd0027f # {"$imagepolicy": "flux-system:backstage"}
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKSTAGE_BASE_URL
              value: https://backstage.lab.ddupan.top
            # The issuer (panxiao81/backstage app-config) and the iam-login client. The client comes from the
            # Terraform-written backstage-sso Secret, not kv/k8s/backstage (envFrom below).
            - name: AUTH_OIDC_METADATA_URL
              value: https://sso.ddupan.top/.well-known/openid-configuration
            - name: AUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-sso
                  key: client_id
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-sso
                  key: client_secret
            # pg-prod（Ayatori 租户，database.yaml）。直连 5432 不走连接池，原因见 database.yaml。
            # POSTGRES_PASSWORD 在这里显式给出，覆盖 envFrom 的 backstage Secret 中的旧 CNPG 密码。
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: password
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: database
            # app-config 没有 ssl 配置：node-postgres 此时读 PGSSLMODE（verify-full → 启用 TLS 并校验证书链与
            # 主机名），内部 CA 经 NODE_EXTRA_CA_CERTS 加入 Node 信任库。不给 CA 时连接以
            # SELF_SIGNED_CERT_IN_CHAIN 失败（2026-10-13 实测），即确实在校验。
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef:
                  name: backstage-pgprod
                  key: sslmode
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/internal-ca/ca.pem
            # 每个插件（pluginDivisionMode: schema）各一个 knex 池；在 CNPG 上空闲时共占约 22 个连接。
            # min 0 让空闲连接被回收，max 限制峰值，pg-prod 的 max_connections 只有 80。
            - name: APP_CONFIG_backend_database_knexConfig_pool_min
              value: "0"
            - name: APP_CONFIG_backend_database_knexConfig_pool_max
              value: "3"
            - name: GITEA_HOST
              value: git.ddupan.top
          envFrom:
            - secretRef:
                name: backstage
          ports:
            - containerPort: 7007
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/internal-ca
              name: internal-ca
              readOnly: true
      volumes:
        - emptyDir: {}
          name: tmp
        # trust-manager 分发（platform/trust-manager/bundle）。
        - name: internal-ca
          configMap:
            name: internal-ca
