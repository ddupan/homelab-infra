apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    backstage.io/kubernetes-id: homelab-backstage
spec:
  replicas: 1
  # Backstage is multi-instance safe (scheduler locks, event bus, and auth keys
  # live in PostgreSQL), so surge one new pod and keep the old one serving
  # until it is ready. Migrations run on the new pod while the old one still
  # serves; revisit if an upgrade ships a backward-incompatible migration.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        backstage.io/kubernetes-id: homelab-backstage
    spec:
      serviceAccountName: backstage
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: zot.ad.ddupan.top/panxiao81/backstage:latest@sha256:476b40ea5cdf7301edb4f5dab5a012686a0009d1b0f1fce21fab34b969543ebb # {"$imagepolicy": "flux-system:backstage"}
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKSTAGE_BASE_URL
              value: https://backstage.ad.ddupan.top
            - name: POSTGRES_HOST
              value: shared-postgresql-rw.shared-db.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_DATABASE
              value: backstage
            - name: GITEA_HOST
              value: git.ddupan.top
          envFrom:
            - secretRef:
                name: backstage
          ports:
            - containerPort: 7007
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
