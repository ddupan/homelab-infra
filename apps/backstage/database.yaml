# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/backstage.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：backstage-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
# deployment.yaml 以 backstage-pgprod 连接（2026-10-13 自 CNPG 迁入）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-database
  namespace: backstage
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: backstage
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'backstage-database'
          serviceAccountRef:
            name: 'backstage-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable.
# Pods pick up a re-issued credential on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-pgprod
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: backstage-pgprod
    creationPolicy: Owner
    template:
      data:
        host: '{{ .host }}'
        # 直连 5432 而不走连接池：events 插件用 LISTEN/NOTIFY，knex 又按插件各自长期持有连接
        # （见 infrastructure/shared-postgresql/README.md「连接池」）。
        port: '5432'
        database: '{{ .database }}'
        username: '{{ .username }}'
        password: '{{ .password }}'
        # verify-full：服务端证书由内部 CA 签发，CA 用 trust-manager 分发的 ConfigMap internal-ca（ca.pem）。
        sslmode: '{{ .sslmode }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/16837b48-acc9-42f0-8fb9-acfff9582943
