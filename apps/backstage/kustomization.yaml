apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pgprod-ca
    namespace: backstage
    files:
      - ca.crt=internal-ca.pem
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - external-secret.yaml
  - sso-external-secret.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - httproute.yaml
  - database.yaml
