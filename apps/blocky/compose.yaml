# Blocky — 已部署的 LAN 主 DNS。见 README.md。
#
# WHY compose on the laptop and NOT a k3s Deployment, given everything else here
# is Kubernetes:
#   * Only the laptop is always-on, so the PVE nodes are not an option.
#   * DNS is the most foundational service on the network. Running it inside k3s
#     means a CrashLoopBackOff or a bad `helm upgrade` takes LAN name resolution
#     with it — and the cluster broke twice on 2026-07-28 alone.
#   * A compose unit starts earlier in boot and has fewer moving parts than
#     kubelet -> CNI -> CoreDNS -> Deployment.
# k3s CoreDNS is unaffected and keeps doing its pod-only job.
services:
  blocky:
    image: spx01/blocky:v0.26
    container_name: blocky
    restart: unless-stopped

    # Bridge networking with an EXPLICIT host IP, not network_mode: host. The
    # laptop already has :53 bound on 192.168.100.1, 192.168.122.1 and the
    # systemd-resolved stub; host networking plus a 0.0.0.0 bind would collide.
    # Binding br0 only also means the libvirt networks keep their own resolvers.
    ports:
      - "192.168.10.127:53:53/udp"
      - "192.168.10.127:53:53/tcp"
      - "192.168.10.127:4000:4000/tcp"   # REST API + /metrics

    # The image runs as uid 100 by default, which cannot write to ./logs (created
    # as the invoking user, uid 1000) — Blocky then logs
    # "fileQueryLogWriter: permission denied" every query and silently keeps no
    # query log at all. Running as the directory owner is more reproducible than a
    # chown, because a fresh clone creates ./logs as uid 1000 anyway.
    user: "1000:1000"

    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logs:/logs

    environment:
      TZ: Asia/Tokyo

    # Blocky answers its own health check. If DNS stops resolving, restart rather
    # than sit there accepting queries it cannot serve.
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PowerDNS Authoritative for lab.ddupan.top. Records are written only through
  # its HTTP API (Terraform for fixed hosts, external-dns for HTTPRoutes), so a
  # record change never needs a redeploy here. See README.md.
  # No depends_on in either direction: a pdns outage costs only lab.ddupan.top,
  # and Blocky must never wait for it.
  pdns:
    image: powerdns/pdns-auth-50:5.0.7
    container_name: pdns
    restart: unless-stopped
    environment:
      # The image's startup script writes pdns.d/_api.conf from this — and opens
      # the API to 0.0.0.0/0. pdns.d/zz-local.conf sorts after it and narrows that.
      PDNS_AUTH_API_KEY: ${PDNS_AUTH_API_KEY:?copy from bao kv/k8s/powerdns into .env, see README}
    ports:
      # API only. DNS (53) is deliberately NOT published: only Blocky queries pdns,
      # over the compose network, so clients cannot bypass ad-blocking or caching.
      #
      # Host side is 8053, NOT 8081: spire-server's LoadBalancer already owns
      # 192.168.10.127:8081, and kube-proxy's DNAT runs before Docker's, so a
      # 8081 mapping here silently sends API clients to SPIRE's gRPC port. That
      # port is invisible to a non-root `ss` — check `sudo iptables -t nat -S`
      # and `kubectl get svc -A` before picking a port on this host.
      - "192.168.10.127:8053:8081/tcp"
    volumes:
      - ./pdns.d/zz-local.conf:/etc/powerdns/pdns.d/zz-local.conf:ro
      # The image ships an initialised pdns.sqlite3, which Docker copies into an
      # empty named volume on first mount — no schema step. The DB is derived
      # state (Terraform + external-dns rebuild it), so losing it costs one apply.
      - pdns-data:/var/lib/powerdns
    networks:
      default:
        # Fixed, because Blocky's conditional mapping takes an IP. A hostname
        # there would need Blocky to resolve it first, through itself.
        ipv4_address: 172.28.0.53
    healthcheck:
      test: ["CMD", "pdns_control", "rping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdns-data:

# 避免与 DN42 的 172.20.0.0/14 重叠。
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
