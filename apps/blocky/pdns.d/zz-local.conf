# Loaded after the image-generated _api.conf (alphabetical), so these win.
#
# The API key alone guards record writes; also refuse anyone who is not the
# laptop itself or a k3s pod (external-dns, CI runners). LAN clients get 403.
#   172.28.0.1      host-originated calls arrive via docker-proxy from the bridge gateway
#   192.168.10.127  host-originated calls when the proxy is bypassed
#   10.42.0.0/16    k3s pods; DNAT keeps their source address
webserver-allow-from=127.0.0.1,172.28.0.1/32,192.168.10.127/32,10.42.0.0/16

