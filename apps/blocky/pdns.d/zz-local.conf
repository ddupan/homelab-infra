# Loaded after the image-generated _api.conf (alphabetical), so these win.
#
# The image opens the API to 0.0.0.0/0; narrow it to the internal networks. The
# API key is what actually guards writes — this only keeps the port off anything
# that is not ours.
#   127.0.0.1, 172.28.0.1  the laptop itself (directly, or via docker-proxy)
#   192.168.10.0/24        LAN; tailnet clients arrive SNATed as .127
#   10.60.0.0/24           labnet — the sandbox cluster's CI runners share the
#                          Terraform runner pool and egress as their node IPs
#   10.61.0.0/24           retronet
#   10.42.0.0/16           k3s pods (external-dns, Poweradmin, homelab CI runners)
webserver-allow-from=127.0.0.1,172.28.0.1/32,192.168.10.0/24,10.60.0.0/24,10.61.0.0/24,10.42.0.0/16
