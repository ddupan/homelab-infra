# Adopted from a helm-CLI release (2026-04-16, chart 1.96.5, revision 1 "failed": the install
# timed out waiting for the Deployment, which then came up fine). Registered suspended first
# (#498); the fresh render and the ESO-rendered values both hashed identical to what Helm had
# stored, so unsuspending only records a new revision of the same manifest.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: tailscale
      version: 1.104.7
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: Secret
      name: tailscale-operator-values
      valuesKey: values.yaml
