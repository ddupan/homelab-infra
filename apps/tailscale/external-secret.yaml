# Operator OAuth client (Tailscale admin console → Trust credentials). The only values the
# release has; rendered as a Helm values file for the HelmRelease's valuesFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-values
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tailscale-operator-values
    creationPolicy: Owner
    template:
      data:
        values.yaml: |
          oauth:
            clientId: "{{ .client_id }}"
            clientSecret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: k8s/tailscale-operator
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: k8s/tailscale-operator
        property: client_secret
