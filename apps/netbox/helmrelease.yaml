apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  # 阶段一只登记：固定线上 chart 与 values，不运行 Helm upgrade。解除暂停用独立 PR，
  # 且那次激活不得同时改 chart 或 values。
  suspend: true
  chart:
    spec:
      chart: netbox
      version: 8.3.38
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: netbox
  releaseName: netbox
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: netbox-values
