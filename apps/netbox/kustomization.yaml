apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret.yaml 不在此列：netbox-secrets 仍为手工 break-glass Secret，迁到 ESO 前
# Flux 只引用、不管理它。
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - securitypolicy.yaml
  - helmrepository.yaml
  - helmrelease.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: netbox-values
    namespace: netbox
    files:
      - values.yaml=values.yaml
