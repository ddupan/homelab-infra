version: "3.9"
services:
  ps3netsrv:
    image: shawly/ps3netsrv:latest
    container_name: ps3netsrv
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      USER_ID: "1000"
      GROUP_ID: "1000"
    ports:
      - "38008:38008"
    volumes:
      - "/mnt/pool/games/ps3:/games:rw"

# 避免与 DN42 的 172.20.0.0/14 重叠。
networks:
  default:
    ipam:
      config:
      - subnet: 172.28.1.0/24
