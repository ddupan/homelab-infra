# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/gitea.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：gitea-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
# gitea-values.yaml 经 additionalConfigFromEnvs 读取 gitea-pgprod（2026-10-13 自 CNPG 迁入）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-database
  namespace: gitea
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: gitea
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'gitea-database'
          serviceAccountRef:
            name: 'gitea-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable.
# Pods pick up a re-issued credential on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-pgprod
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: gitea-pgprod
    creationPolicy: Owner
    template:
      data:
        # Gitea 的 [database] HOST 是 host:port。**直连租户端口（5432），不走连接池**：Gitea 的驱动 lib/pq
        # 执行带参数的查询时先发 Parse(未命名)+Describe+Sync，再另发 Bind+Execute+Sync。transaction 模式的
        # PgBouncer 在两次 Sync 之间可能换服务端连接，Bind 就落到别的客户端的未命名语句上：2026-10-13 经池
        # 运行的 80 秒里出现 "bind message supplies N parameters, but prepared statement \"\" requires M"、参数
        # 被绑到错误语句（bigint ← "ayatori"）；个数恰好对上时会用错参数执行别的语句。当时已整库重灌。
        host: '{{ .host }}:{{ .port }}'
        database: '{{ .database }}'
        username: '{{ .username }}'
        password: '{{ .password }}'
        # verify-full：服务端证书由内部 CA 签发；lib/pq 经 PGSSLROOTCERT 读 ConfigMap internal-ca。
        sslmode: '{{ .sslmode }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/72876404-f261-43e4-aa04-4324df6af93f
