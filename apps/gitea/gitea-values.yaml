# Gitea holds a leveldb queue lock on its RWO /data volume, so two pods can't run
# at once. The chart's default RollingUpdate (maxSurge 100%) deadlocks on upgrade;
# Recreate terminates the old pod before starting the new one.
strategy:
  type: Recreate

# 笔记本 CPU 长期过载（load 40–60 / 12 核）。主容器原本没有 requests（chart 只给 init 容器设了），
# 其 cgroup cpu.weight 取最小值，争用时 Gitea 最先被饿死，Web/git 操作明显变慢。
# requests 只抬高调度权重和预留；不设 limits：CPU limit 会在空闲时也节流，
# 内存 limit 会让 Gitea 在 git gc / 大 push 时被 OOMKill。
resources:
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  hosts:
    - host: git.ddupan.top
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - git.ddupan.top
      secretName: git-ddupan-top-tls

gitea:
  config:
    server:
      ROOT_URL: https://git.ddupan.top/
      APP_NAME: Gitea on ddupan.top
    service:
      ENABLE_SSH: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_PASSWORD_SIGNIN_FORM: false
    auth:
      AUTO_REGISTER: true
    database:
      # pg-prod（Ayatori 租户，database.yaml），直连 5432：lib/pq 与 transaction 模式的连接池不兼容（见
      # database.yaml）。HOST/NAME/USER/PASSWD/SSL_MODE 全部经下面的 additionalConfigFromEnvs 从
      # gitea-pgprod 取，此文件不含连接信息。SCHEMA 置空：设了之后 Gitea 每个新连接都执行会话级
      # set_config('search_path', ...)，而默认 search_path 本来就落到 public；init 容器只对 PVC 上已有的
      # app.ini 做 edit-ini（不删键），所以要显式置空才能去掉旧的 SCHEMA = public。
      DB_TYPE: postgres
      SCHEMA: ""
      # 直连不经池，用 Gitea 自己的上限护住 pg-prod 的 max_connections=80（默认 0 = 不限）。
      MAX_OPEN_CONNS: 10
    queue:
      TYPE: database
      QUEUE_TYPE: database
    actions:
      # CI for services/ (see .gitea/workflows/lint.yml). Enabling this only turns
      # on the Actions API and UI — nothing runs until an act_runner registers
      # against it, so this flag alone is inert.
      ENABLED: true
      # Where `uses:` steps are resolved from. Left at the github default because
      # github.com is reachable from this network (verified 2026-07-28) even when
      # pypi.org/Fastly is not — see the flaky-WAN notes in the lint workflow.
      DEFAULT_ACTIONS_URL: github
    # No [security] ALLOWED_HOST_LIST (Gitea 28 replaced [webhook]'s). In the
    # default EGRESS_MODE=lax every public host is allowed and private targets
    # need an IP/CIDR entry. Gitea 28 applies it only to webhooks, migrations,
    # mirrors, legacy OpenID and OAuth2 avatar downloads; OIDC login and the
    # configure-gitea discovery fetch are not filtered. Allowing the laptop
    # ingress (192.168.10.127) would let webhooks reach every internal vhost,
    # so IdP avatars behind it may fail to sync instead.
    mailer:
      # Outbound mail via the in-cluster Postfix+OAuth relay (see ../smtp-relay/).
      # Plain SMTP on :25 — the relay does STARTTLS + OAuth to M365. From must be the
      # relay's send-as identity (noreply@ddupan.top) or O365 rejects with 5.7.60.
      ENABLED: true
      PROTOCOL: smtp
      SMTP_ADDR: smtp-relay.smtp-relay.svc.cluster.local
      SMTP_PORT: 25
      FROM: Gitea <noreply@ddupan.top>
    oauth2_client:
      # Auto-link an OIDC login to an existing account with the same email.
      ACCOUNT_LINKING: auto
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: preferred_username
      UPDATE_AVATAR: true
  # The DB connection, injected as env vars rather than written into this file.
  # Gitea's env-to-ini step turns GITEA__DATABASE__* into `[database] *`, so the
  # rendered app.ini is identical to hardcoding it — but the credential lives only
  # in the `gitea-pgprod` Secret (Ayatori via OpenBao, database.yaml), and this
  # file stays in git.
  #
  # Next step for rotation: `gitea.extraEnvSourceFile` reads an env file written
  # by an OpenBao agent-injector sidecar, which is the route to credentials from
  # OpenBao's database secrets engine. See docs/cicd.md. Note Gitea reads app.ini
  # once at startup, so rotation needs a restart — static roles suit it better
  # than short-TTL dynamic credentials.
  additionalConfigFromEnvs:
    - name: GITEA__DATABASE__HOST
      valueFrom:
        secretKeyRef:
          name: gitea-pgprod
          key: host
    - name: GITEA__DATABASE__NAME
      valueFrom:
        secretKeyRef:
          name: gitea-pgprod
          key: database
    - name: GITEA__DATABASE__USER
      valueFrom:
        secretKeyRef:
          name: gitea-pgprod
          key: username
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-pgprod
          key: password
    - name: GITEA__DATABASE__SSL_MODE
      valueFrom:
        secretKeyRef:
          name: gitea-pgprod
          key: sslmode
  oauth:
    # iam-login (AD password + passkey). This is login source ID 3, formerly `hydra`:
    # Gitea links accounts by (source ID, sub), and the chart's init container matches
    # sources by NAME, adding a new one (new ID, links lost) when none matches. So the
    # source was renamed in place first (`gitea admin auth update-oauth --id 3 --name sso`)
    # and only then did this entry change. iam-login issues its own subjects (2026-10-09);
    # the existing account was relinked by ACCOUNT_LINKING=auto. Same fetch-at-pod-start
    # fragility as above; sso.ddupan.top is split-horizon to Envoy for that reason.
    - name: sso
      provider: openidConnect
      existingSecret: gitea-sso-oidc
      autoDiscoverUrl: https://sso.ddupan.top/.well-known/openid-configuration
      scopes: openid profile email groups
      groupClaimName: groups
      # The platform's administrator group (infrastructure/samba-ad), not a Gitea-only one.
      adminGroup: platform-admins

persistence:
  size: 20Gi
  claimName: gitea-shared-storage

postgresql-ha:
  enabled: false

postgresql:
  enabled: false

valkey-cluster:
  enabled: false

valkey:
  enabled: false
# lib/pq（Gitea 的驱动）读 libpq 环境变量；SSL_MODE=verify-full 时用它校验 pg-prod 证书。
# deployment.env 进 init 与主容器：configure-gitea（init）也连库，跑 `gitea migrate`。
deployment:
  env:
    - name: PGSSLROOTCERT
      value: /etc/internal-ca/ca.pem
# 内部 CA，trust-manager 分发（platform/trust-manager/bundle）。
extraVolumes:
  - name: internal-ca
    configMap:
      name: internal-ca
extraInitVolumeMounts:
  - name: internal-ca
    mountPath: /etc/internal-ca
    readOnly: true
extraContainerVolumeMounts:
  - name: internal-ca
    mountPath: /etc/internal-ca
    readOnly: true
