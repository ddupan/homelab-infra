# LAN route to Gitea.
#
# Pairs with ../../platform/cert-manager/certificate-git-ddupan.yaml and the `https-git`
# listener in ../../platform/envoy-gateway/gateway.yaml. Split-horizon on the PUBLIC hostname:
# git.ddupan.top resolves to the gateway on the LAN and to Cloudflare from
# outside, so a clone URL works unchanged in both places and nothing that already
# has a remote configured needs touching.
#
# NOTE Gitea's chart also renders an Ingress (ingress.enabled: true in
# gitea-values.yaml) for git.ddupan.top. That Ingress is INERT — it declares no
# class, and the only IngressClasses present are `contour` (retired 2026-07-25)
# and `tailscale`. Nothing serves it. This HTTPRoute is what actually works; the
# Ingress should be turned off in the values rather than left to look meaningful.
#
# NO auth in front of this route on purpose. Gitea does its own authentication
# (local accounts plus iam-login OIDC), and git over HTTPS uses token/basic auth
# that any login proxy would intercept and 302 to a login page — the breakage
# NetBox's API hit back when the Gateway still had Authelia forward-auth.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Gitea"
    gethomepage.dev/group: "应用"
    gethomepage.dev/icon: "gitea.svg"
    gethomepage.dev/description: "代码与 CI"
    gethomepage.dev/href: "https://git.ddupan.top/"
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-git
  hostnames:
    - git.ddupan.top
  rules:
    # Envoy's default 15s request timeout cuts git smart-HTTP: a partial clone of the
    # 32MB gitea-dynamic-runner repo builds its blob packfile for ~16s and got 504
    # (Renovate, 2026-11-01). Same fix as zot's route.
    - timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        # Same Service the Cloudflare tunnel targets, so both paths terminate in
        # exactly one place.
        - name: gitea-http
          port: 3000
