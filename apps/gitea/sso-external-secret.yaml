# Client secret of the `sso` login source: Gitea's `gitea` client at the iam-login issuer (sso.ddupan.top), in the
# key/secret shape the chart's `existingSecret` expects. The client is registered through the
# iam-login client API (/console) with PKCE off: Gitea 1.27 sends neither PKCE nor a nonce.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-sso-oidc
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-sso-oidc
    creationPolicy: Owner
    template:
      data:
        key: gitea
        secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: k8s/gitea-sso
        property: client_secret
