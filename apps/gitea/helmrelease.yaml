apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  chart:
    spec:
      chart: gitea
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
      version: 12.7.0
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: gitea
  targetNamespace: gitea
  timeout: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  # Keep the release explicit: chart 12.7.0 (latest) defaults to 1.27.0 and no
  # chart for Gitea 28 exists yet; it renders the 28.1.0-rootless image unchanged.
  # This override is in the suspended HelmRelease itself so chart, image and
  # suspension are applied atomically; changing the watched values ConfigMap in
  # the same revision could otherwise trigger reconciliation first.
  values:
    image:
      rootless: true
      # renovate: datasource=docker depName=docker.gitea.com/gitea
      tag: "28.3.0"
  valuesFrom:
    - kind: ConfigMap
      name: gitea-values
