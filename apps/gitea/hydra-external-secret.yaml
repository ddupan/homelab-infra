apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-hydra-oidc
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gitea-hydra-oidc
    creationPolicy: Owner
    template:
      data:
        key: gitea
        secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: k8s/hydra
        property: gitea_client_secret
