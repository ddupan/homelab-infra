apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    reconcile.fluxcd.io/watch: Enabled

configMapGenerator:
  - name: gitea-values
    namespace: gitea
    files:
      - values.yaml=gitea-values.yaml

resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - httproute.yaml
  - hydra-external-secret.yaml
