# Gateway keys: one Bao secret per key under kv/k8s/ai-gateway-keys/<id> (field `key`), issued
# and revoked through the key UI (keys-ui.yaml). Only status=active keys (custom_metadata) reach
# the gateway; revoking deletes the Bao secret. The Secret maps
# client ID -> key, the shape SecurityPolicy apiKeyAuth wants. The UI force-syncs this object on
# every change, so refreshInterval is only the fallback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: client-keys
  namespace: ai-gateway
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: client-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
            {{- range $id, $v := . }}
            {{ $id }}: {{ ($v | fromJson).key | quote }}
            {{- end }}
  dataFrom:
    - find:
        path: k8s/ai-gateway-keys
        name:
          regexp: ".*"
        tags:
          status: active
      rewrite:
        - regexp:
            source: "^k8s/ai-gateway-keys/"
            target: ""
