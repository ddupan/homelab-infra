# The Anthropic Console key (credit grant, refreshed monthly). Written to Bao by hand; the
# BackendSecurityPolicy wants it under the key `apiKey`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: anthropic-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: k8s/ai-gateway
        property: anthropic_api_key
---
# Gateway keys, one property per client: property name = client ID, value = its key. Adding or
# revoking a client is a Bao write only; ESO picks it up within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: client-keys
  namespace: ai-gateway
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: client-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/ai-gateway-clients
