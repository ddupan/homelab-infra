# CLIProxyAPI — turns the ChatGPT Plus subscription (Codex OAuth) into an OpenAI-compatible API,
# as the second backend behind Gateway `ai`. Not exposed by itself: only the ai Envoy calls it,
# with a key Agent Router injects (cliproxyapi_api_key in Bao).
#
# The OAuth credential lives on the PVC, not in Bao: CLIProxyAPI refreshes and rewrites it.
# First login (and after the refresh token dies) — see README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxyapi-auth
  namespace: ai-gateway
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: ai-gateway
spec:
  replicas: 1
  # RWO volume + a refresh token that must not be rotated by two processes at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cliproxyapi
  template:
    metadata:
      labels:
        app: cliproxyapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cliproxyapi
          image: docker.io/eceasy/cli-proxy-api:v8.0.73@sha256:5727997d6407a7be54e58275d595ffeac0200eb388520b87bf2d2e1e042d9b5b
          command: [./CLIProxyAPI, -config, /etc/cliproxyapi/config.yaml]
          env:
            - name: HOME
              value: /data
          ports:
            - name: http
              containerPort: 8317
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # Whole directory, not subPath, so an ESO update reaches the running pod.
            - name: config
              mountPath: /etc/cliproxyapi
              readOnly: true
            - name: auth
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: cliproxyapi-config
        - name: auth
          persistentVolumeClaim:
            claimName: cliproxyapi-auth
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
  namespace: ai-gateway
spec:
  selector:
    app: cliproxyapi
  ports:
    - name: http
      port: 8317
      targetPort: http
---
# Rendered by ESO because access.api-keys is a secret. Management API stays off (empty
# secret-key): config is git's, credentials are the PVC's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-config
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cliproxyapi-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            allow-remote: false
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .api_key }}"
          oauth:
            auth-dir: /data/auths
  data:
    - secretKey: api_key
      remoteRef:
        key: k8s/ai-gateway
        property: cliproxyapi_api_key
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: cliproxyapi
  namespace: ai-gateway
spec:
  schema:
    name: OpenAI
  # Must be an EG Backend; AIServiceBackend does not take a Service yet (ai-gateway#902).
  backendRef:
    name: cliproxyapi
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: cliproxyapi
  namespace: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: cliproxyapi.ai-gateway.svc.cluster.local
        port: 8317
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: cliproxyapi
  namespace: ai-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: cliproxyapi
  type: APIKey
  apiKey:
    secretRef:
      name: cliproxyapi-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-api-key
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cliproxyapi-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: k8s/ai-gateway
        property: cliproxyapi_api_key
