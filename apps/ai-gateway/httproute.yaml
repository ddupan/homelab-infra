# Front door: `eg` terminates TLS for ai.lab.ddupan.top, checks the client's gateway key, and
# hands the request to the `ai` Gateway's Envoy (gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - ai.lab.ddupan.top
  rules:
    - backendRefs:
        - name: ai-gateway-envoy
          namespace: envoy-gateway-system
          port: 80
      timeouts:
        request: 600s
---
# MCP, and its OAuth discovery under /.well-known/, without the gateway-key check: the MCPRoute
# (mcp.yaml) authenticates these itself with iam-login tokens. More specific than the `/` rule
# above, so these paths land here; the key SecurityPolicy below targets only `ai-gateway`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-mcp
  namespace: ai-gateway
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - ai.lab.ddupan.top
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp}
        - path: {type: PathPrefix, value: /.well-known/}
      backendRefs:
        - name: ai-gateway-envoy
          namespace: envoy-gateway-system
          port: 80
      # Streamable HTTP keeps a GET stream open; clients reconnect when it is cut.
      timeouts:
        request: 600s
---
# EG creates the `ai` Gateway's Service in its own namespace, not the Gateway's.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ai-gateway-envoy
  namespace: envoy-gateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai-gateway
  to:
    - group: ""
      kind: Service
      name: ai-gateway-envoy
---
# One key per client, from Bao (external-secret.yaml). x-api-key is where Anthropic SDKs and
# Claude Code (ANTHROPIC_API_KEY) put the key; OpenAI SDKs send `Authorization: Bearer <key>`,
# whose "Bearer " Envoy strips. Either works, so clients need only a base URL and a key.
# sanitize drops both headers before forwarding; the client's name goes on as x-ai-client.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-gateway
  apiKeyAuth:
    credentialRefs:
      - name: client-keys
    extractFrom:
      - headers: [x-api-key, authorization]
    sanitize: true
    forwardClientIDHeader: x-ai-client
