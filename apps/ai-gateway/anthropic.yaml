# Routing by model name: OpenAI models (gpt-*, o<n>*, codex-*) go to CLIProxyAPI (ChatGPT Plus,
# cliproxyapi.yaml); everything else to Anthropic. Header-matched rules outrank the bare one.
# Either API reaches GPT; Claude only via /anthropic/v1/messages. Agent Router has no OpenAI →
# Anthropic-native translator (only Bedrock/Vertex), so /v1/chat/completions + claude-* is a 422.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: anthropic
  namespace: ai-gateway
spec:
  parentRefs:
    - name: ai
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-model
              value: "(gpt-|o[0-9]|codex-).*"
      backendRefs:
        - name: cliproxyapi
      timeouts:
        request: 600s
    - backendRefs:
        - name: anthropic
      # Envoy's default route timeout is 15s; a long generation takes minutes.
      timeouts:
        request: 600s
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: anthropic
  namespace: ai-gateway
spec:
  schema:
    name: Anthropic
  backendRef:
    name: anthropic
    kind: Backend
    group: gateway.envoyproxy.io
---
# Short-lived WIF access token (anthropic-wif.yaml), sent as Authorization: Bearer — type APIKey,
# not AnthropicAPIKey, which would put it in x-api-key. The client's gateway key never gets
# here (httproute.yaml strips it).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: anthropic
  namespace: ai-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: anthropic-token
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: anthropic
  namespace: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.anthropic.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: anthropic
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: anthropic
  validation:
    wellKnownCACertificates: System
    hostname: api.anthropic.com
