apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - httproute-s3.yaml
  - httproute-terraform-registry.yaml
  - httproute-admin.yaml
  - securitypolicy-admin.yaml
  - sso-external-secret.yaml
  - networkpolicy-admin.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: seaweedfs-values
    namespace: seaweedfs
    files:
      - values.yaml=values.yaml
