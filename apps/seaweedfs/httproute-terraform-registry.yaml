# Terraform provider registry: https://terraform.lab.ddupan.top serves the terraform-registry bucket
# (static files, anonymous GetObject by bucket policy in terraform/terraform-registry.tf). Provider
# source addresses embed this hostname, so it must not change.
#
# GET only, and every path is pinned under /terraform-registry/: other buckets (tfstate!) are not
# reachable through this name even though the backend is the same S3 service. Envoy normalizes
# dot segments and encoded slashes first (..%2f answers 307 to a path on this same host). The
# actual boundary is the bucket policy: anonymous GetObject on this bucket only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: terraform-registry
  namespace: seaweedfs
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - terraform.lab.ddupan.top
  rules:
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: terraform-registry-prefix
      backendRefs:
        - name: seaweedfs-s3
          port: 8333
---
# Pins every path under the bucket. A regex rewrite rather than the standard ReplacePrefixMatch:
# Envoy Gateway joined "/" + "/terraform-registry/" as "/terraform-registry" + ".well-known/..."
# (trailing slash dropped, so S3 saw bucket "terraform-registry.well-known"), with or without the
# slash in the replacement. Verified 2026-10-05.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: terraform-registry-prefix
  namespace: seaweedfs
spec:
  urlRewrite:
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: '^/(.*)$'
        substitution: '/terraform-registry/\1'
