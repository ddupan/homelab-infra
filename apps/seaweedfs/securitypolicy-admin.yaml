# Login for the admin UI at the gateway: Envoy runs the OIDC code flow against iam-login, then checks the access
# token it stored in a cookie. Signing in alone is not enough; the token's groups claim must name platform-admins.
# The client is registered in apps/iam-login/terraform/clients.tf. Without discovery Envoy Gateway sends the client
# secret as HTTP Basic, so the client is client_secret_basic.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: seaweedfs-admin
  namespace: seaweedfs
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: seaweedfs-admin
  oidc:
    # Endpoints spelled out so Envoy Gateway does not fetch discovery: it fetches once per translation and never
    # retries, and on 2026-10-31 an EOF (sso restarting) dropped the OIDC filter while the JWT check stayed, leaving
    # every request at "Jwt is missing" with no redirect to sign in.
    provider:
      issuer: https://sso.ddupan.top
      authorizationEndpoint: https://sso.ddupan.top/oauth2/authorize
      tokenEndpoint: https://sso.ddupan.top/oauth2/token
    clientID: seaweedfs-admin
    clientSecret:
      name: seaweedfs-admin-sso
    redirectURL: https://seaweedfs-admin.lab.ddupan.top/oauth2/callback
    logoutPath: /oauth2/logout
    # groups is what puts the groups claim into the access token checked below.
    scopes: [openid, profile, groups]
    cookieNames:
      accessToken: seaweedfs-admin-access-token
  jwt:
    providers:
      - name: iam-login
        issuer: https://sso.ddupan.top
        audiences: [seaweedfs-admin]
        remoteJWKS:
          uri: https://sso.ddupan.top/oauth2/jwks
        extractFrom:
          cookies: [seaweedfs-admin-access-token]
  authorization:
    defaultAction: Deny
    rules:
      - name: platform-admins
        action: Allow
        principal:
          jwt:
            provider: iam-login
            claims:
              - name: groups
                valueType: StringArray
                values: [platform-admins]
