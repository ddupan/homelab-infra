# Client secret of the `seaweedfs-admin` client at the iam-login issuer, for securitypolicy-admin.yaml. Terraform
# registers the client and writes the secret to bao (apps/iam-login/terraform/clients.tf); nobody handles it by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-admin-sso
  namespace: seaweedfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: seaweedfs-admin-sso
    creationPolicy: Owner
  data:
    # Envoy Gateway reads the key client-secret.
    - secretKey: client-secret
      remoteRef:
        key: k8s/seaweedfs-admin-sso
        property: client_secret
