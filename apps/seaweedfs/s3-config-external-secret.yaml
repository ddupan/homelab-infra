# S3 identities for SeaweedFS: the base config from Bao kv/k8s/seaweedfs-s3 with zot's
# identity (kv/k8s/zot-s3) spliced in, so zot's key lives in one place only.
# SeaweedFS S3 identities, including the least-privilege `terraform` identity that
# holds Terraform remote state.
#
# ⚠ These credentials were previously INLINE in ../../apps/seaweedfs/values.yaml and went
# into git with the initial commit. Externalising stops the bleeding; the leaked
# anvAdmin key still needs rotating separately, since it is in history.
#
# The chart normally GENERATES seaweedfs-s3-secret from s3.credentials. We point
# filer.s3.existingConfigSecret at this one instead, so the chart stops rendering
# credentials from values entirely.
# zot 的 AK/SK 只保存在 k8s/zot-s3；在此组装服务端配置，不在基础配置中维护副本。
# ESO 2.14 删掉了 sprig 的 fail（防止模板泄露信息）。这里的守卫改为对说明文字调用
# mustFromJson，让渲染以 "invalid JSON" 失败：ExternalSecret 报 SecretSyncedError，
# 原有 Secret 保持不变。错误里看不到说明文字，要回到这里按行号查。
# zot 需要 WriteAcp：distribution 的 S3 驱动在每次写入时都带 x-amz-acl: private，而且
# 不能关闭。SeaweedFS 4.52 起，只要请求带了 ACL，就额外要求 WriteAcp；缺了它，所有推送都会 403。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: seaweedfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        seaweedfs_s3_config: |-
          {{- $config := mustFromJson .baseConfig -}}
          {{- if not (kindIs "slice" $config.identities) -}}
            {{- $_ := mustFromJson "base S3 configuration must contain an identities array" -}}
          {{- end -}}
          {{- if or (eq .zotAccessKey "") (eq .zotSecretKey "") -}}
            {{- $_ := mustFromJson "zot S3 credentials must not be empty" -}}
          {{- end -}}
          {{- $identities := list -}}
          {{- range $config.identities -}}
            {{- if ne .name "zot" -}}
              {{- $identities = append $identities . -}}
            {{- end -}}
          {{- end -}}
          {{- $credential := dict "accessKey" .zotAccessKey "secretKey" .zotSecretKey -}}
          {{- $zot := dict "name" "zot" "credentials" (list $credential) "actions" (list "Read:zot" "Write:zot" "List:zot" "Tagging:zot" "WriteAcp:zot") -}}
          {{- $_ := set $config "identities" (append $identities $zot) -}}
          {{- mustToJson $config -}}
  data:
    - secretKey: baseConfig
      remoteRef:
        key: k8s/seaweedfs-s3
        property: seaweedfs_s3_config
    - secretKey: zotAccessKey
      remoteRef:
        key: k8s/zot-s3
        property: access_key
    - secretKey: zotSecretKey
      remoteRef:
        key: k8s/zot-s3
        property: secret_key
