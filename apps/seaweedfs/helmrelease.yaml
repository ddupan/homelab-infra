apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  chart:
    spec:
      chart: seaweedfs
      # The chart version also picks the image
      # (global.seaweedfs.image.tag in values.yaml is not read by this chart).
      version: 4.53.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
  releaseName: seaweedfs
  interval: 30m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: seaweedfs-values
