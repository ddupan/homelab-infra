global:
  seaweedfs:
    image:
      repository: ""
      name: chrislusf/seaweedfs
      tag: latest

master:
  enabled: true
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 10Gi
    storageClass: localpv-zfs-ceph
  logs:
    type: emptyDir

volume:
  enabled: true
  replicas: 1
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      size: 100Gi
      storageClass: localpv-zfs-ceph
      maxVolumes: 0
  # Index lives next to the .dat on the data PVC. emptyDir (used up to 4.22) wiped it on every
  # restart and forced a full rebuild from the .dat; chart >= 4.4x refuses to render it.
  idx: {}
  logs:
    type: emptyDir

filer:
  enabled: true
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 10Gi
    storageClass: localpv-zfs-ceph
  logs:
    type: emptyDir
  s3:
    enabled: true
    enableAuth: true
    # Identities come from a Secret synced out of OpenBao by External Secrets
    # (../../platform/external-secrets/externalsecrets.yaml -> kv/k8s/seaweedfs-s3), NOT from
    # the chart's own s3.credentials.
    #
    # WHY: those keys used to be INLINE in this file and were committed in the
    # initial commit. They also slipped past a content scan, because the regex
    # looked for `secret[:=]` and the key is written `secretKey` — the word is
    # followed by "Key", not a colon. See CLAUDE.md on scanning by content.
    # The leaked anvAdmin key is in git history and still needs ROTATING.
    existingConfigSecret: seaweedfs-s3-config
  # Embedded IAM API writes (users/keys/policies via the AWS IAM API on :8333), used by
  # ./terraform. Default is read-only. Dynamic identities live in filer /etc/iam/, merged with
  # the static file above; IAM writes against a STATIC identity are silent no-ops, so
  # Terraform-managed user names must never collide with static ones.
  extraArgs: ["-s3.iam.readOnly=false"]

s3:
  enableAuth: true
  # No credentials block on purpose — populating it makes the chart render a
  # Secret from values, which is what put credentials in git in the first place.

admin:
  enabled: true
  replicas: 1
  # `weed admin` has no login of its own; >= 4.46 refuses a non-loopback bind without this. The login
  # is the gateway's (securitypolicy-admin.yaml), and networkpolicy-admin.yaml keeps the UI port from
  # being reached around it.
  allowInsecureBind: true
  data:
    type: emptyDir
  logs:
    type: emptyDir
  # The tailnet ingress had no login in front of it; the UI is now httproute-admin.yaml.
  ingress:
    enabled: false

# 执行 S3 lifecycle 规则：bucket 上的规则本身不会删对象，没有 worker 时数据会一直留着。
# 只跑 s3_lifecycle，不做 vacuum、balance、EC：volume 就在笔记本那块 SSD 上，写高峰时 IO 已经饱和。
worker:
  enabled: true
  replicas: 1
  # chart 默认连 12535.22535，会被 networkpolicy-admin.yaml 拦下；留给 worker 的 gRPC 端口是 33646。
  adminServer: seaweedfs-admin.seaweedfs:23646.33646
  jobType: s3_lifecycle
  maxExecute: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
