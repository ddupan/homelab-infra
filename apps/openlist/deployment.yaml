apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlist
  namespace: openlist
  labels:
    app: openlist
spec:
  replicas: 1
  strategy:
    type: Recreate      # one RWO volume holding SQLite
  selector:
    matchLabels:
      app: openlist
  template:
    metadata:
      labels:
        app: openlist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: openlist
          image: docker.io/openlistteam/openlist:v4.2.9@sha256:897563beb674e7ad04edff14b0037dc8443ca3978570614005519df7eae06434
          env:
            - {name: SITE_URL, value: "https://openlist.lab.ddupan.top"}
            # Set, or the first start prints a random one into the log pipeline.
            - name: OPENLIST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: openlist, key: admin-password}
          ports:
            - {name: http, containerPort: 5244}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /opt/openlist/data}
            - {name: temp, mountPath: /opt/openlist/data/temp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openlist-data
        # Uploads pass through this pod and may stage here. The cap keeps a large backup from
        # filling the laptop's root disk: the pod is evicted instead.
        - name: temp
          emptyDir:
            sizeLimit: 10Gi
