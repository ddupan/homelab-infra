# kv/k8s/openlist is written by hand: nothing else knows this password (README).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openlist
  namespace: openlist
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openlist
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: k8s/openlist
        property: admin_password
