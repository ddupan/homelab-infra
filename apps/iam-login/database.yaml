# The database is requested from Ayatori (../../clusters/ayatori-prod/iam-login.yaml), which
# delivers the credential to OpenBao only. This namespace reads it with its OWN identity:
# the iam-login-database bao role (../../infrastructure/openbao/terraform/auth.tf) can read
# exactly this one credential path, so the shared ClusterSecretStore never needs access to
# every tenant's credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-login-database
  namespace: iam-login
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: iam-login
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'iam-login-database'
          serviceAccountRef:
            name: 'iam-login-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable
# (an endpoint change re-issues the same password with the new host). Pods pick it up on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-login-db
  namespace: iam-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: iam-login-db
    creationPolicy: Owner
    template:
      data:
        # sslmode is verify-full; the server cert is issued by the internal CA (ConfigMap internal-ca from trust-manager,
        # public). pgjdbc has no hostaddr, so the host name resolves through the DC.
        # Port 6432 is the PgBouncer pool (transaction mode), not the tenant's direct {{ .port }}. pgjdbc sends
        # Parse/Bind/Execute in one Sync (unnamed) or uses named statements PgBouncer tracks, so it is pool-safe
        # unlike lib/pq: 2026-10-13, pgjdbc 42.7.13 + HikariCP 7.0.2, 32 clients over 5 server connections, 525k
        # verified queries with 0 errors, while the same harness with lib/pq failed ~50% (08P01). Flyway's
        # PostgreSQL lock is transaction-scoped (pg_advisory_xact_lock), so migrations are pool-safe too.
        SPRING_DATASOURCE_URL: 'jdbc:postgresql://{{ .host }}:6432/{{ .database }}?sslmode={{ .sslmode }}&sslrootcert=/etc/internal-ca/ca.pem'
        SPRING_DATASOURCE_USERNAME: '{{ .username }}'
        SPRING_DATASOURCE_PASSWORD: '{{ .password }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/2665d345-adbe-4f44-9fc7-ef8dd701468e
