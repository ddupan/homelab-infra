apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-login
  namespace: iam-login
spec:
  # One replica: HTTP sessions (login progress, MFA factors) live in memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iam-login
  template:
    metadata:
      labels:
        app: iam-login
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam-login
          # iam-login 232b870 (main), published by its CI after the native browser test.
          image: zot.ad.ddupan.top/iam/iam-login@sha256:853329eba383449df89909a10e4c564f6b18bdce32a30c2d3fecf30c0fbec2a3
          args:
            # The DC's LDAPS cert is signed by the internal CA, not a public one.
            - -Djavax.net.ssl.trustStore=/run/secrets/iam/truststore.p12
            - -Djavax.net.ssl.trustStorePassword=changeit
            - --spring.config.additional-location=file:/config/
          env:
            # The feature set the binary was built with (iam-login application-prod.yaml).
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          # SPRING_DATASOURCE_URL/USERNAME/PASSWORD, rendered from the Ayatori credential.
          envFrom:
            - secretRef: { name: iam-login-db }
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              # Native RSS measured at ~200 MB under the browser E2E.
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/iam, readOnly: true }
            # Tomcat's work directory.
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap: { name: iam-login-config }
        - name: secrets
          secret:
            secretName: iam-login
            items:
              - { key: signing-key.pem, path: signing-key.pem }
              - { key: truststore.p12, path: truststore.p12 }
        - name: tmp
          emptyDir: {}
