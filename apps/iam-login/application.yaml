# Environment VALUES only. Which features exist (iam.*.enabled) is fixed when the native image is
# built (iam-login's application-prod.yaml, activated by SPRING_PROFILES_ACTIVE=prod in
# deployment.yaml); setting them here would be ignored, and iam-login refuses to start on a mismatch.
# The signing key and LDAPS truststore come from kv/k8s/iam-login (external-secret.yaml); the
# datasource comes from Ayatori (database.yaml).
iam:
  ad:
    domain: ad.ddupan.top
  webauthn:
    # Passkeys are bound to this RP ID: changing it orphans every registered passkey.
    rp-id: sso.ddupan.top
    origin: https://sso.ddupan.top
  authorization-server:
    # The issuer is part of every RP's configuration; changing it means migrating every RP.
    issuer: https://sso.ddupan.top
    signing-keys:
      - file:/run/secrets/iam/signing-key.pem
  clients:
    # Humans who manage clients (/console). The platform's administrator group (infrastructure/samba-ad);
    # machines (Terraform) are the SPIFFE IDs below.
    admin-groups:
      - platform-admins
    # Machine callers (Terraform via terraform-provider-homelab) present a JWT-SVID with
    # audience iam-login. Exact SPIFFE IDs only: Terraform CD's plan (PRs) and apply (main) jobs,
    # and the laptop's development identity (uid 1000 on the k3s node; local Terraform runs and
    # break-glass when CD is down). Anything running as that user can manage OIDC clients.
    spiffe:
      issuer: https://spire-oidc.lab.ddupan.top
      jwk-set-uri: https://spire-oidc.lab.ddupan.top/keys
      admin-ids:
        - spiffe://ddupan.top/ci/panxiao81/homelab-infra/terraform-plan
        - spiffe://ddupan.top/ci/panxiao81/homelab-infra/terraform-apply
        - spiffe://ddupan.top/dev/panxiao81
spring:
  # AD over LDAPS through Boot's ContextSource; connection defaults ship in the app's own
  # application.yaml. Overall /actuator/health includes this connection.
  ldap:
    urls: ldaps://dc1.ad.ddupan.top:636
    base: DC=ad,DC=ddupan,DC=top
server:
  port: 8080
  # TLS ends at Envoy (LAN) or Cloudflare (tunnel); both send X-Forwarded-Proto.
  # Tomcat trusts it only from private addresses, and the NetworkPolicy admits
  # only those two namespaces.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax
management:
  otlp:
    metrics:
      export:
        enabled: false
