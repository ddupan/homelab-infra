# kv/k8s/iam-login: signing_key (PKCS#8 PEM), truststore (base64 PKCS#12
# holding only the public "ddupan.top Internal CA", which signs the DC's LDAPS cert).
# Values never enter Git; see README.md for how each is created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-login
  namespace: iam-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: iam-login
    creationPolicy: Owner
  data:
    - secretKey: signing-key.pem
      remoteRef: { key: k8s/iam-login, property: signing_key }
    - secretKey: truststore.p12
      remoteRef: { key: k8s/iam-login, property: truststore, decodingStrategy: Base64 }
---
# kv/k8s/iam-login-ldap: the read-only AD service account svc-iam-login (username = UPN). Written by the
# samba-ad play when it creates the account (infrastructure/samba-ad), never by hand; rendered as Boot's
# SPRING_LDAP_USERNAME/PASSWORD for the app's own LDAP connection (reads without the user present).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-login-ldap
  namespace: iam-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: iam-login-ldap
    creationPolicy: Owner
  data:
    - secretKey: SPRING_LDAP_USERNAME
      remoteRef: { key: k8s/iam-login-ldap, property: username }
    - secretKey: SPRING_LDAP_PASSWORD
      remoteRef: { key: k8s/iam-login-ldap, property: password }
