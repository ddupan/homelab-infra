# kv/k8s/iam-login: db_password, signing_key (PKCS#8 PEM), truststore (base64 PKCS#12
# holding only the public "ddupan.top Internal CA", which signs the DC's LDAPS cert).
# Values never enter Git; see README.md for how each is created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iam-login
  namespace: iam-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: iam-login
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef: { key: k8s/iam-login, property: db_password }
    - secretKey: signing-key.pem
      remoteRef: { key: k8s/iam-login, property: signing_key }
    - secretKey: truststore.p12
      remoteRef: { key: k8s/iam-login, property: truststore, decodingStrategy: Base64 }
