apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot-reader
  namespace: zot
spec:
  chart:
    spec:
      chart: zot
      version: 0.1.124
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: zot
  releaseName: zot-reader
  interval: 30m
  timeout: 5m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
  - kind: ConfigMap
    name: zot-values
  - kind: ConfigMap
    name: zot-reader-values
