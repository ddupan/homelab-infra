# 叠加于共用 values.yaml；同一镜像、S3、Secret、安全设置，无制品副本。
# 无 Bearer middleware，仅 anonymousPolicy=read；关闭 GC 避免多个实例清理共享存储。
# 已不挂路由，待观察后删除。
configFiles:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": false,
        "storageDriver": {
          "name": "s3",
          "region": "us-east-1",
          "regionendpoint": "https://s3.lab.ddupan.top",
          "bucket": "zot",
          "rootdirectory": "/registry",
          "secure": true,
          "skipverify": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://zot.lab.ddupan.top",
        "compat": [
          "docker2s2"
        ],
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": [
                "read"
              ]
            }
          }
        }
      },
      "log": {
        "level": "info"
      }
    }
# 拉取域名已移到主实例（values.yaml）；reader 不再对外，随后整体删除。
httproute:
  enabled: false
