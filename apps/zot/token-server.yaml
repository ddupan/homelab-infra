# 匿名 pull token（github.com/panxiao81/oci-token-server）。zot 把不带凭据的
# token 请求经 upstreamTokenEndpoint 转发到这里，拿回只含 pull 的 token；
# SPIFFE JWT-SVID 仍由 zot 本地校验。镜像在 ghcr.io，不依赖 zot 自身，避免循环。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-token-server
  namespace: zot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oci-token-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oci-token-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oci-token-server
          image: ghcr.io/panxiao81/oci-token-server:0.0.1@sha256:f460ba5bb6459dab7df2358e95bafc757dc4efc79cf5cf1739217581896060ce
          env:
            - name: KEY_FILE
              value: /key/private_key
            - name: ISSUER
              value: oci-token-server
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: key
              mountPath: /key
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: zot-token-signing
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: oci-token-server
  namespace: zot
spec:
  selector:
    app.kubernetes.io/name: oci-token-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# 只有 zot 实例会转发 token 请求过来。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oci-token-server-ingress
  namespace: zot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oci-token-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: zot
      ports:
        - protocol: TCP
          port: 8080
