apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - external-secret.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - helmrelease-reader.yaml
  - networkpolicy.yaml
  - token-server.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: zot-values
    namespace: zot
    files:
      - values.yaml=values.yaml
  - name: zot-reader-values
    namespace: zot
    files:
      - values.yaml=reader-values.yaml
