apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot-s3
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: k8s/zot-s3
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: k8s/zot-s3
        property: secret_key
