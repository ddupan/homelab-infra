apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot-s3
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: k8s/zot-s3
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: k8s/zot-s3
        property: secret_key
---
# oci-token-server 的 Ed25519 签名私钥，只给 token server。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-token-signing
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot-token-signing
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: k8s/zot-token-server
        property: private_key
---
# 对应公钥，zot 的 bearer.cert 用来验证匿名 pull token。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-token-verify
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: zot-token-verify
    creationPolicy: Owner
  data:
    - secretKey: public_key
      remoteRef:
        key: k8s/zot-token-server
        property: public_key
