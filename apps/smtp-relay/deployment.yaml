apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: smtp-relay
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: postfix
          # Stock Postfix relay with SASL user/password to OCI Email Delivery. The queue is
          # in the container: mail queued at restart is lost, as it was with the M365 image.
          image: docker.io/boky/postfix:5.2.1-alpine@sha256:f88cc3667ca4f48e0f96edc63fb1689b8f47430724b383938908449d17aa060b
          envFrom:
            - secretRef:
                name: smtp-relay-secret   # RELAYHOST_USERNAME, RELAYHOST_PASSWORD
          env:
            - name: TZ
              value: 'Asia/Shanghai'
            - name: POSTFIX_myhostname
              value: 'smtp-relay.ddupan.top'   # HELO name
            # Same region as Gitea's mailer (infrastructure/oci/ansible/roles/gitea).
            - name: RELAYHOST
              value: '[smtp.email.ap-osaka-1.oci.oraclecloud.com]:587'
            # Default is `may`: a stripped STARTTLS would send the SASL password in clear.
            - name: POSTFIX_smtp_tls_security_level
              value: 'encrypt'
            # Email Delivery rejects any From that is not an approved sender
            # (noreply@ddupan.top, infrastructure/oci/terraform/gitea-mail.tf); the image
            # also refuses to start without this list.
            # NOTE: with this set the image relays for ANY client that reaches the port
            # (smtpd_relay_restrictions=permit). Access control is the network:
            # ClusterIP in-cluster, and loadBalancerSourceRanges in service-lan.yaml.
            - name: ALLOWED_SENDER_DOMAINS
              value: 'ddupan.top'
            - name: POSTFIX_message_size_limit
              value: '26214400'                # 25 MiB
          ports:
            - name: smtp
              containerPort: 587
          readinessProbe:
            tcpSocket:
              port: 587
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 587
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
