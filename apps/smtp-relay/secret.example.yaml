# Break-glass only: copy to secret.yaml (gitignored) and `kubectl apply` when Bao is down.
# Values: `terraform output` of infrastructure/oci/terraform (smtp_relay_smtp_*).
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-secret
  namespace: smtp-relay
type: Opaque
stringData:
  RELAYHOST_USERNAME: 'CHANGE-ME'
  RELAYHOST_PASSWORD: 'CHANGE-ME'
