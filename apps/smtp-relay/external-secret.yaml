# Entra app credentials for sasl-xoauth2. Previously hand-applied from the gitignored
# secret.yaml (kept as break-glass). Same name on purpose so ESO adopts the live Secret.
# CLIENT_SECRET is intentionally EMPTY in OpenBao: the app is a public client and
# presenting a secret makes Entra reject the refresh (AADSTS700025, see README).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay-secret
  namespace: smtp-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: smtp-relay-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/smtp-relay
