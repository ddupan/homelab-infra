# OCI Email Delivery SMTP credential (RELAYHOST_USERNAME / RELAYHOST_PASSWORD), issued by
# infrastructure/oci/terraform/smtp-relay-mail.tf and written to Bao by hand after apply.
# The gitignored secret.yaml stays as break-glass for when Bao is down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay-secret
  namespace: smtp-relay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: smtp-relay-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/smtp-relay
