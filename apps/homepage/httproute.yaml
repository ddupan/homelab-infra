# No login on purpose: it is only a list of links, every app behind them does its
# own auth, and *.lab.ddupan.top resolves on the LAN/Tailscale only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - home.lab.ddupan.top
  rules:
    - backendRefs:
        - name: homepage
          port: 3000
