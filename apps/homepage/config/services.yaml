# Helm-chart routes (their charts render the HTTPRoute) and off-cluster apps.
- 应用:
    # On OCI A1, not k3s, so no namespace/podSelector: there are no pods here to report on.
    - Gitea:
        href: https://git.ddupan.top/
        icon: gitea.svg
        description: 代码与 CI
    - Artifact Keeper:
        href: https://artifacts.lab.ddupan.top/
        icon: mdi-package-variant
        description: 制品仓库
        namespace: artifact-keeper
        podSelector: app.kubernetes.io/name=artifact-keeper,app.kubernetes.io/component=web
    - zot:
        href: https://zot.lab.ddupan.top/
        icon: mdi-docker
        description: OCI 镜像仓库
        namespace: zot
        podSelector: app.kubernetes.io/instance=zot
