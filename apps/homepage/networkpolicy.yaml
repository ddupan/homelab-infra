apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage-ingress
  namespace: homepage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 3000
          protocol: TCP
