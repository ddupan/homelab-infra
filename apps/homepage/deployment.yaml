apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Homepage copies a skeleton into every config file it finds missing, at start
      # and on first request — and the list grows between releases (proxmox.yaml
      # crash-looped v2.7.0). So /app/config is a writable emptyDir seeded from the
      # ConfigMap, and Homepage creates whatever else it wants itself.
      initContainers:
        - name: seed-config
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          command: [sh, -c, cp /seed/* /app/config/]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: seed
              mountPath: /seed
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          # Index digest, not a platform one (renovate-platform-digest trap).
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Homepage rejects any Host not listed here (since v1.0). The pod IP is
            # what the kubelet's probes send.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.lab.ddupan.top,$(MY_POD_IP):3000
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            # Slow first request on the laptop's contended disk; 1s killed it.
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: seed
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
