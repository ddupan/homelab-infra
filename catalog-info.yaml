# Backstage catalog entities for the services Flux deploys from this repository,
# discovered by Backstage's Gitea provider. One Component per Flux Kustomization
# (Backstage itself lives in panxiao81/backstage; flux-image-automation is shown
# under flux, whose namespace holds its objects).
#
# Resources are matched by namespace, not by label: Flux labels only top-level
# objects, so pods (and operator-created workloads such as vmagent) never carry
# kustomize/helm.toolkit.fluxcd.io labels. Backstage still requires a label
# selector, so `!backstage.io/none` (a label nothing has) selects every object in
# the namespace. Each service here owns its namespace.
#
# Off-cluster services (OpenBao, Proxmox, Incus) carry no Kubernetes annotations.
# `links` feed the entity Links card: Web UIs use the `dashboard` icon, API
# endpoints have no icon and say "(API)" in the title.
#
# Grouping: every entity belongs to one System (declared at the end of this
# file). dependsOn records application-level runtime dependencies only (database,
# authentication, directory, object storage, registry, mail), each backed by a
# reference in the service's config. Platform plumbing that nearly everything
# uses (envoy-gateway routing, external-secrets, cert-manager, openebs, flux) is
# left out so the Catalog Graph stays readable.
#
# Adding a service: append a document with its namespace, source path and links.
