# Runner config for this cluster's executors, mounted by the controller via
# POD_RUNNER_CONFIGMAP. Actions cache goes to the cache-server shared with the
# homelab pool (platform/dynamic-runner/cache-server.yaml) over the LAN gateway;
# the runner registers each job's token there and forwards the job's cache
# calls. host-mode jobs can read the shared secret, so all Pod repositories
# share one cache trust domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: dynamic-runner
data:
  config.yaml: |
    runner:
      capacity: 1
      timeout: 3h
      shutdown_timeout: 1m
      hooks:
        job_started: /usr/local/libexec/gitea-job-started
    cache:
      external_server: https://runner-cache.lab.ddupan.top/
      external_secret_file: /run/gitea-runner-cache/external_secret
    host:
      workdir_parent: /workspace
    container:
      require_docker: false
      valid_volumes: []
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-cache-s3
  namespace: dynamic-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: gitea-runner-cache-s3
  dataFrom:
    - extract:
        key: k8s/gitea-runner-cache-s3
