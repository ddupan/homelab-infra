# Executors get no CPU limit and only a token CPU request: jobs average ~0.5
# core and mostly wait on network and disk, and CPU contention only slows jobs
# down, it never kills them. Each sandbox LXC's core count still caps the
# total, so iam-spike-build (graalvm, same PVE host as sandbox1) is protected
# at the PVE level, not here.
#
# Memory is not compressible, so it stays reserved and is what bounds
# scheduling. Allocatable after system pods: sandbox1 ~6.7Gi, sandbox2 ~5.4Gi;
# one ci-vm sandbox (3Gi + kata overhead) must still fit on either node, which
# leaves room for 8 executors at 1Gi. POD_CAPACITY must not exceed what fits,
# or the extra Pod stays Pending and its task fails after the handoff deadline.
apiVersion: v1
kind: LimitRange
metadata:
  name: executor-defaults
  namespace: dynamic-runner
spec:
  limits:
    - type: Container
      default:
        memory: 3Gi
      defaultRequest:
        cpu: 250m
        memory: 1Gi
