# Executors get no CPU limit and only a token CPU request: jobs average ~0.5
# core and mostly wait on network and disk, and CPU contention only slows jobs
# down, it never kills them. Each sandbox LXC's core count still caps the
# total, so iam-spike-build (graalvm, same PVE host as sandbox1) is protected
# at the PVE level, not here.
#
# Memory is reserved at 512Mi, below what heavier jobs (image builds,
# integration tests) peak at: most jobs peak around 0.2Gi, p95 1.5Gi, and the
# graalvm build runs on its own LXC. Overcommitting memory is deliberate. If a
# node does run short, the kernel OOM-kills burstable executor processes
# (oom_score_adj near 1000) before k3s or PostgreSQL; that job fails and can be rerun.
# That only covers memory: saturation short of OOM starves k3s and PostgreSQL
# instead (2026-11-06), which is why POD_CAPACITY is set below what fits.
#
# Requests still bound scheduling. Allocatable after system pods and the 1Gi
# system-reserved: sandbox1 ~5.7Gi, sandbox2 ~4.4Gi; one ci-vm sandbox (3Gi +
# kata overhead) must still fit on either node, which leaves room for 13
# executors at 512Mi.
# POD_CAPACITY must not exceed what fits, or the extra Pod stays Pending and
# its task fails after the handoff deadline.
apiVersion: v1
kind: LimitRange
metadata:
  name: executor-defaults
  namespace: dynamic-runner
spec:
  limits:
    - type: Container
      default:
        memory: 3Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
