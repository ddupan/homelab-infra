# Executors request their full CPU limit so the scheduler places them by real
# CPU: sandbox1 (4 CPU, its PVE host shared with iam-spike-build) fits one,
# sandbox2 (8 CPU, ~2.6 CPU already requested by OpenSandbox, the controller
# and the cache) fits two. POD_CAPACITY must not exceed what fits, or the
# extra Pod stays Pending and its task fails after the handoff deadline.
apiVersion: v1
kind: LimitRange
metadata:
  name: executor-defaults
  namespace: dynamic-runner
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 3Gi
      defaultRequest:
        cpu: "2"
        memory: 1Gi
