# This worker's own Gitea runner registration (pod-sandbox, a member of the pod
# pool), created by gitea-dynamic-runner scripts/register-runner. It fetches
# and reports only its own tasks; nothing is shared with homelab.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynamic-runner
  namespace: dynamic-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: dynamic-runner
  data:
    - secretKey: pod-runner-uuid
      remoteRef:
        key: k8s/dynamic-runner-pod-sandbox
        property: uuid
    - secretKey: pod-runner-token
      remoteRef:
        key: k8s/dynamic-runner-pod-sandbox
        property: token
---
# The capability key only binds executors to the worker that created them, so
# this worker gets its own instead of sharing the homelab one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dynamic-runner-facade-key
  namespace: dynamic-runner
spec:
  length: 64
  symbols: 0
  digits: 16
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynamic-runner-facade-key
  namespace: dynamic-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: dynamic-runner-facade-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dynamic-runner-facade-key
