# Shared with the homelab scheduler: the worker joins its NATS queue and its
# facade forwards executor updates to Gitea as the scheduler's runner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynamic-runner
  namespace: dynamic-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: dynamic-runner
  data:
    - secretKey: nats-worker-password
      remoteRef:
        key: k8s/nats
        property: ci_worker_password
    - secretKey: scheduler-uuid
      remoteRef:
        key: k8s/dynamic-runner
        property: scheduler_uuid
    - secretKey: scheduler-token
      remoteRef:
        key: k8s/dynamic-runner
        property: scheduler_token
---
# The capability key only binds executors to the worker that created them, so
# this worker gets its own instead of sharing the homelab one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dynamic-runner-facade-key
  namespace: dynamic-runner
spec:
  length: 64
  symbols: 0
  digits: 16
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynamic-runner-facade-key
  namespace: dynamic-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: dynamic-runner-facade-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dynamic-runner-facade-key
