# Cloudflare DNS-01 token for the letsencrypt ClusterIssuer. Previously hand-applied
# from the gitignored secret.yaml (kept as break-glass). Same name on purpose so ESO
# adopts the live Secret; key must stay `api-token` (clusterissuer-letsencrypt.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/cert-manager-cloudflare
