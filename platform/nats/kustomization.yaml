apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: nats-values
    namespace: nats
    files:
      - values.yaml=values.yaml
resources:
  - namespace.yaml
  - helmrepository.yaml
  - external-secret.yaml
  - certificate.yaml
  - helmrelease.yaml
