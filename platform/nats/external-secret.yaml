apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-auth
  namespace: nats
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: nats-auth
  dataFrom:
    - extract:
        key: k8s/nats
