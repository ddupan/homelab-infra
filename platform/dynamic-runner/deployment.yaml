apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-runner-controller
  namespace: dynamic-runner
spec:
  replicas: 1
  # Recreate: the worker's claims and capacity live in one process. During a
  # rolling overlap the new instance restored the old one's half-created
  # executors as its own and both stalled (2026-10-04). On shutdown the worker
  # deletes executors it has not handed off and returns them to the queue.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-runner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-runner-controller
    spec:
      serviceAccountName: dynamic-runner-controller
      initContainers:
        - name: fetch-internal-ca
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          args: [--fail, --silent, --show-error, --output, /trust/ca.pem, https://bao.lab.ddupan.top:8200/v1/pki/ca/pem]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: trust
              mountPath: /trust
      containers:
        - name: controller
          image: zot.lab.ddupan.top/panxiao81/gitea-dynamic-runner-controller@sha256:304695b915c3e46953a0557c1aee0e3fa5290b30a252c1191bbfe8a79344552c
          imagePullPolicy: IfNotPresent
          args: [controller]
          env:
            # Member of the vm pool, plus a Pod worker that only takes jobs too
            # big for sandbox (see POD_RUNNER_LABELS). Ordinary pod jobs run on
            # sandbox (pod-sandbox) to keep CI load off the laptop.
            # cloud-scheduler runs runs-on: [cloud] jobs as one-off Pods on GKE
            # Autopilot (infrastructure/gcp-ci/terraform).
            - name: COMPONENTS
              value: kubernetes-worker,opensandbox-worker,cloud-scheduler
            - name: TASK_SOURCE
              value: gitea
            - name: GITEA_INSTANCE_URL
              value: https://git.ddupan.top
            - name: POD_GITEA_RUNNER_UUID_FILE
              value: /run/dynamic-runner-secrets/pod-runner-uuid
            - name: POD_GITEA_RUNNER_TOKEN_FILE
              value: /run/dynamic-runner-secrets/pod-runner-token
            - name: VM_GITEA_RUNNER_UUID_FILE
              value: /run/dynamic-runner-secrets/vm-runner-uuid
            - name: VM_GITEA_RUNNER_TOKEN_FILE
              value: /run/dynamic-runner-secrets/vm-runner-token
            - name: RUNNER_FACADE_CAPABILITY_KEY_FILE
              value: /run/dynamic-runner-secrets/facade-capability-key
            - name: RUNNER_FACADE_LISTEN
              value: :8443
            - name: RUNNER_FACADE_URL
              value: https://192.168.10.127:30443
            - name: RUNNER_FACADE_SPIFFE_ID
              value: spiffe://ddupan.top/ns/dynamic-runner/sa/dynamic-runner-controller
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent-sockets/spire-agent.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_EXECUTOR_IMAGE
              value: zot.lab.ddupan.top/panxiao81/gitea-dynamic-runner-runner@sha256:ebfb927739c3100e7cbcb5e356cad8d830cc8e2f8b28a034ab36dc66f55ed186
            - name: POD_SERVICE_ACCOUNT
              value: gitea-dynamic-runner
            - name: POD_EXECUTOR_UID
              value: "2000"
            - name: POD_CAPACITY
              value: "1"
            # Deliberately without "pod": Gitea matches a job only if the runner
            # has all of its labels, so [self-hosted, pod] jobs stay on sandbox.
            # Jobs reach this worker with runs-on: [self-hosted, container, large].
            # The worker adds the label of each profile below by itself.
            - name: POD_RUNNER_LABELS
              value: self-hosted,container
            # The largest job has to fit: sandbox nodes have 8G and 6G in total,
            # so these jobs can only run here. iam-login's native build takes 7g
            # for its compile container; dockerd shares the same Pod cgroup.
            - name: POD_RESOURCE_PROFILES
              value: '{"large":{"requests":{"cpu":"4","memory":"9Gi"},"limits":{"cpu":"4","memory":"9Gi"}}}'
            # See runner-config.yaml.
            - name: POD_RUNNER_CONFIGMAP
              value: gitea-runner-config
            - name: POD_RUNNER_CACHE_SECRET
              value: gitea-runner-cache-s3
            - name: OPENSANDBOX_API
              value: http://sandbox-k8s.lab.ddupan.top:8080
            - name: OPENSANDBOX_API_KEY_FILE
              value: /run/dynamic-runner-secrets/opensandbox-api-key
            - name: OPENSANDBOX_POOL
              value: ci-vm
            - name: VM_CAPACITY
              value: "1"
            - name: VM_RUNNER_LABEL
              value: vm
            - name: VM_TIMEOUT_SECONDS
              value: "14400"
            # Instance-wide like pod-laptop and vm: runners are platform
            # infrastructure, usage is a cost-attribution question.
            - name: CLOUD_GITEA_SCOPE
              value: admin
            # Gitea API token (write:admin) for listing jobs and managing the
            # scheduler's ephemeral runners.
            - name: CLOUD_GITEA_TOKEN_FILE
              value: /run/dynamic-runner-secrets/cloud-gitea-token
            - name: CLOUD_KUBE_SERVER
              value: https://34.72.192.4
            - name: CLOUD_KUBE_CA_FILE
              value: /run/gke-ci/ca.pem
            # SPIRE JWT-SVID (aud=gcp) -> federation -> this service account.
            - name: CLOUD_GCP_WIF_AUDIENCE
              value: //iam.googleapis.com/projects/811223086070/locations/global/workloadIdentityPools/spire/providers/spire
            - name: CLOUD_GCP_SERVICE_ACCOUNT
              value: dynamic-runner-controller@ddupan-ci.iam.gserviceaccount.com
            # ghcr.io through the Artifact Registry remote repository next to the cluster.
            - name: CLOUD_EXECUTOR_IMAGE
              value: us-central1-docker.pkg.dev/ddupan-ci/ghcr/ddupan/gitea-dynamic-runner-runner@sha256:f11370b1730fdf7ad4e0314281460ea62c209febd28f2760449e640410adc9f7
            # Pending Pods cost nothing; the trial account's GCE quotas (12 vCPU,
            # 250 GB SSD) are what actually limit concurrent jobs.
            - name: CLOUD_CAPACITY
              value: "4"
            # Billed per request on Autopilot, so every value is explicit.
            # Ayatori lint (2026-11-11) held 1.5 vCPU flat out and peaked at
            # 2.75 GiB of 3 GiB. More CPU shortens the job about as much as it
            # costs, so only the memory headroom adds to the bill.
            # small (runs-on: [cloud-small]) is for light jobs such as
            # security-scan, whose scanners peak around 300 MiB; it fits next
            # to a default job on the same node instead of waiting for a new one.
            - name: CLOUD_RESOURCE_PROFILES
              value: '{"default":{"requests":{"cpu":"2","memory":"4Gi","ephemeral-storage":"10Gi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"10Gi"}},"small":{"requests":{"cpu":"500m","memory":"1Gi","ephemeral-storage":"5Gi"},"limits":{"cpu":"500m","memory":"1Gi","ephemeral-storage":"5Gi"}}}'
            # Created in GKE by infrastructure/gcp-ci/terraform/scheduler.tf.
            - name: CLOUD_RUNNER_CONFIGMAP
              value: gitea-runner-config
            - name: CLOUD_RUNNER_CACHE_SECRET
              value: gitea-runner-cache-gcs
            - name: SPIRE_CLUSTER
              value: homelab
            - name: SPIRE_CLASS
              value: spire-mgmt-spire
            - name: SSL_CERT_FILE
              value: /run/trust/ca.pem
          ports:
            - name: facade
              containerPort: 8443
            # Plain HTTP: kubelet cannot complete the facade's mTLS.
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            tcpSocket: null
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            tcpSocket: null
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: secret
              mountPath: /run/dynamic-runner-secrets
              readOnly: true
            - name: trust
              mountPath: /run/trust
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: true
            - name: gke-ci
              mountPath: /run/gke-ci
              readOnly: true
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secret
          secret:
            secretName: dynamic-runner
            defaultMode: 0400
        - name: trust
          emptyDir:
            sizeLimit: 1Mi
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: gke-ci
          configMap:
            name: gke-ci
