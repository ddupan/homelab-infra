apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-runner-controller
  namespace: dynamic-runner
spec:
  replicas: 1
  # Recreate: the worker's claims and capacity live in one process. During a
  # rolling overlap the new instance restored the old one's half-created
  # executors as its own and both stalled (2026-10-04). On shutdown the worker
  # deletes executors it has not handed off and returns them to the queue.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-runner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-runner-controller
    spec:
      serviceAccountName: dynamic-runner-controller
      initContainers:
        - name: fetch-internal-ca
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          args: [--fail, --silent, --show-error, --output, /trust/ca.pem, https://bao.lab.ddupan.top:8200/v1/pki/ca/pem]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: trust
              mountPath: /trust
      containers:
        - name: controller
          image: zot.lab.ddupan.top/panxiao81/gitea-dynamic-runner-controller@sha256:24c6ca522c0cd39e21abbb7580a38429275ed5709498dfc678caa4806094b151
          imagePullPolicy: IfNotPresent
          args: [controller]
          env:
            # Member of the vm pool only, fetching from Gitea with its own
            # registration. Pod jobs run on sandbox (pod-sandbox) to keep CI
            # load off the laptop; the POD_* settings stay for a quick rollback.
            - name: COMPONENTS
              value: opensandbox-worker
            - name: TASK_SOURCE
              value: gitea
            - name: GITEA_INSTANCE_URL
              value: https://git.ddupan.top
            - name: POD_GITEA_RUNNER_UUID_FILE
              value: /run/dynamic-runner-secrets/pod-runner-uuid
            - name: POD_GITEA_RUNNER_TOKEN_FILE
              value: /run/dynamic-runner-secrets/pod-runner-token
            - name: VM_GITEA_RUNNER_UUID_FILE
              value: /run/dynamic-runner-secrets/vm-runner-uuid
            - name: VM_GITEA_RUNNER_TOKEN_FILE
              value: /run/dynamic-runner-secrets/vm-runner-token
            - name: RUNNER_FACADE_CAPABILITY_KEY_FILE
              value: /run/dynamic-runner-secrets/facade-capability-key
            - name: RUNNER_FACADE_LISTEN
              value: :8443
            - name: RUNNER_FACADE_URL
              value: https://192.168.10.127:30443
            - name: RUNNER_FACADE_SPIFFE_ID
              value: spiffe://ddupan.top/ns/dynamic-runner/sa/dynamic-runner-controller
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent-sockets/spire-agent.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_EXECUTOR_IMAGE
              value: zot.lab.ddupan.top/panxiao81/gitea-dynamic-runner-runner@sha256:ebfb927739c3100e7cbcb5e356cad8d830cc8e2f8b28a034ab36dc66f55ed186
            - name: POD_SERVICE_ACCOUNT
              value: gitea-dynamic-runner
            - name: POD_EXECUTOR_UID
              value: "2000"
            - name: POD_CAPACITY
              value: "4"
            # See runner-config.yaml.
            - name: POD_RUNNER_CONFIGMAP
              value: gitea-runner-config
            - name: POD_RUNNER_CACHE_SECRET
              value: gitea-runner-cache-s3
            - name: OPENSANDBOX_API
              value: http://10.60.0.13:8080
            - name: OPENSANDBOX_API_KEY_FILE
              value: /run/dynamic-runner-secrets/opensandbox-api-key
            - name: OPENSANDBOX_POOL
              value: ci-vm
            - name: VM_CAPACITY
              value: "1"
            - name: VM_RUNNER_LABEL
              value: vm
            - name: VM_TIMEOUT_SECONDS
              value: "14400"
            - name: SPIRE_CLUSTER
              value: homelab
            - name: SPIRE_CLASS
              value: spire-mgmt-spire
            - name: SSL_CERT_FILE
              value: /run/trust/ca.pem
          ports:
            - name: facade
              containerPort: 8443
          readinessProbe:
            httpGet: null
            tcpSocket:
              port: facade
            periodSeconds: 5
          livenessProbe:
            httpGet: null
            tcpSocket:
              port: facade
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: secret
              mountPath: /run/dynamic-runner-secrets
              readOnly: true
            - name: trust
              mountPath: /run/trust
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: true
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secret
          secret:
            secretName: dynamic-runner
            defaultMode: 0400
        - name: trust
          emptyDir:
            sizeLimit: 1Mi
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
