apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynamic-runner
  namespace: dynamic-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: dynamic-runner
  data:
    - secretKey: opensandbox-api-key
      remoteRef:
        key: k8s/opensandbox-api
        property: api_key
    - secretKey: facade-capability-key
      remoteRef:
        key: k8s/dynamic-runner
        property: facade_capability_key
    - secretKey: cloud-gitea-token
      remoteRef:
        key: k8s/dynamic-runner
        property: cloud_gitea_token
    # Pool member registrations (gitea-dynamic-runner scripts/register-runner).
    - secretKey: pod-runner-uuid
      remoteRef:
        key: k8s/dynamic-runner-pod-laptop
        property: uuid
    - secretKey: pod-runner-token
      remoteRef:
        key: k8s/dynamic-runner-pod-laptop
        property: token
    - secretKey: vm-runner-uuid
      remoteRef:
        key: k8s/dynamic-runner-vm
        property: uuid
    - secretKey: vm-runner-token
      remoteRef:
        key: k8s/dynamic-runner-vm
        property: token
