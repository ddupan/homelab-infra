# Actions cache 服务，供 laptop 与 sandbox 两个 Pod 池共用。
#
# 原先每个 executor 的 runner 直接用 S3（SeaweedFS ci-cache）：runner 启动后才在后台把 bucket 里的
# 全部 metadata 导入本地索引，查找不等导入完成。executor 每个 job 都是新进程，job 开头几秒的
# restore 几乎必然 miss（terraform 的 tf-providers 从未命中）。这里常驻一个 `gitea-runner
# cache-server`，索引一直在内存/磁盘上；runner 只把 job 的 token 注册过来并转发请求，job 本身
# 不直连这里。
#
# cache-server 不支持 S3，只能用本地盘。淘汰按访问时间：7 天没用过的删除，总量封顶。
#
# 认证：runner 与 cache-server 共享 `external_secret`（Bao kv/k8s/gitea-runner-cache-s3，与原 S3 key
# 同一路径，两个集群的 ESO 已在同步）。host 模式的 job 能读到它，所以所有仓库仍在同一个 cache
# 信任域，和原来的 S3 key 一样。
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-cache-server
  namespace: dynamic-runner
data:
  config.yaml: |
    log:
      level: info
    cache:
      dir: /data
      port: 8088
      external_secret_file: /run/gitea-runner-cache/external_secret
      retention: 168h
      repo_size_limit: 15GB
      # PVC 40Gi，留余量给进行中的上传。
      size_limit: 32GB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: localpv-zfs-ceph
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  replicas: 1
  # 索引是 bbolt 文件，只能有一个进程打开。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner-cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache-server
          # 与 executor 镜像里的官方 runner 同一版本（gitea-dynamic-runner container/runner.Dockerfile）。
          image: docker.io/gitea/runner:6.0.0@sha256:f9a1f17484398b861c25a763b81febfb394b17b72e0522c25d8067d7b484f347
          command: [/usr/local/bin/gitea-runner, cache-server, -c, /etc/gitea-runner/config.yaml]
          ports:
            - name: cache
              containerPort: 8088
          readinessProbe:
            tcpSocket:
              port: cache
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/gitea-runner
              readOnly: true
            - name: secret
              mountPath: /run/gitea-runner-cache
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gitea-runner-cache-server
        - name: secret
          secret:
            secretName: gitea-runner-cache-s3
            items:
              - key: external_secret
                path: external_secret
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  selector:
    app.kubernetes.io/name: gitea-runner-cache
  ports:
    - name: cache
      port: 8088
      targetPort: cache
---
# sandbox 的 executor 经 LAN 网关访问（同 s3.lab）；laptop 的 executor 直接用 Service。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - runner-cache.lab.ddupan.top
  rules:
    - backendRefs:
        - name: gitea-runner-cache
          port: 8088
      # 缓存包上传/下载动辄几百 MB，Envoy 默认 15s 请求超时不够。
      timeouts:
        request: 900s
