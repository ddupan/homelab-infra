# Shared Actions cache for Kubernetes executors. Executors are ephemeral, so
# the runner's built-in per-process cache never survives between jobs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  length: 64
  symbols: 0
  digits: 16
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: gitea-runner-cache
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: gitea-runner-cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
data:
  config.yaml: |
    cache:
      dir: /data
      port: 8088
      external_secret_file: /run/gitea-runner-cache/password
      retention: 168h
      repo_size_limit: 10GB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: localpv-zfs-ceph
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner-cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache-server
          image: docker.io/gitea/runner:5.0.0@sha256:328b8dad8de80a19dab6c5c61292c1d624cd3460c25a5c0067e95c11318657ca
          command: [/usr/local/bin/gitea-runner, -c, /etc/gitea-runner-cache/config.yaml, cache-server]
          ports:
            - name: cache
              containerPort: 8088
          readinessProbe:
            tcpSocket:
              port: cache
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/gitea-runner-cache
              readOnly: true
            - name: secret
              mountPath: /run/gitea-runner-cache
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: gitea-runner-cache
        - name: secret
          secret:
            secretName: gitea-runner-cache
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-cache
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-runner-cache
  namespace: dynamic-runner
spec:
  selector:
    app.kubernetes.io/name: gitea-runner-cache
  ports:
    - name: cache
      port: 8088
      targetPort: cache
