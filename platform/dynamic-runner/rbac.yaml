apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynamic-runner-controller
  namespace: dynamic-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-dynamic-runner
  namespace: dynamic-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dynamic-runner-controller
  namespace: dynamic-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dynamic-runner-controller
  namespace: dynamic-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dynamic-runner-controller
subjects:
  - kind: ServiceAccount
    name: dynamic-runner-controller
    namespace: dynamic-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynamic-runner-spiffe-entries
rules:
  - apiGroups: [spire.spiffe.io]
    resources: [clusterstaticentries]
    verbs: [create, get, delete]
  # Executor entries are parented to the SPIRE agent on the Pod's node, whose
  # k8s_psat ID embeds the node UID (gitea-dynamic-runner#61).
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dynamic-runner-spiffe-entries
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynamic-runner-spiffe-entries
subjects:
  - kind: ServiceAccount
    name: dynamic-runner-controller
    namespace: dynamic-runner
