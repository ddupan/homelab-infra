apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-identity
  namespace: opensandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-identity
    spec:
      serviceAccountName: opensandbox-identity
      containers:
        - name: controller
          image: zot.ad.ddupan.top/panxiao81/gitea-dynamic-runner-controller@sha256:1e481726cbcf6da50f1ef61aa5a1b070d2859209329842e954463293c27c0e66
          imagePullPolicy: IfNotPresent
          command: [/venv/bin/gitea-dynamic-runner-opensandbox-identity]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        seccompProfile:
          type: RuntimeDefault
