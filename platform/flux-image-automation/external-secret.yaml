# GitHub App ddupan-flux (App ID, installation ID, private key) for the write source; Bao stores the
# keys under the names Flux's `provider: github` reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-infra-write
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: homelab-infra-write
  dataFrom:
    - extract:
        key: k8s/flux-github-app
