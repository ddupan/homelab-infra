---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-identity-exchange
  namespace: spire-identity-exchange
---
# k8s_psat plugin: TokenReview of the runner Pod's projected token, plus the API server's issuer
# discovery/JWKS for the in-process signature check (same as upstream k8s/ manifest).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-identity-exchange
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - nonResourceURLs: ["/.well-known/openid-configuration", "/openid/v1/jwks"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-identity-exchange
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-identity-exchange
subjects:
  - kind: ServiceAccount
    name: spire-identity-exchange
    namespace: spire-identity-exchange
