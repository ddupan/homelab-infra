apiVersion: v1
kind: ServiceAccount
metadata:
  name: microvm-runner-controller
  namespace: microvm-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-dynamic-runner
  namespace: microvm-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microvm-runner-controller
  namespace: microvm-runner
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microvm-runner-controller
  namespace: microvm-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: microvm-runner-controller
subjects:
  - kind: ServiceAccount
    name: microvm-runner-controller
    namespace: microvm-runner
