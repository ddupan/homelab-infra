---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.lab.ddupan.top:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-sandbox
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
