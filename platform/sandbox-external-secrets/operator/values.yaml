---
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-values
  namespace: external-secrets
data:
  values.yaml: |
    replicaCount: 1

    webhook:
      replicaCount: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}

    certController:
      replicaCount: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}

    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}

    serviceAccount:
      create: true
      name: external-secrets

    installCRDs: true
