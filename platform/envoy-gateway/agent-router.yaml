# Agent Router (formerly Envoy AI Gateway) — the control plane for apps/ai-gateway.
# Lives here because it is half of Envoy Gateway's own config: EG calls its extension server
# on every xDS translation (helmrelease.yaml values). Compatibility: v1.2.x needs EG >= 1.9.2.
#
# ⚠ The chart's pod-mutating webhook (injects the ext_proc sidecar into Envoy pods) is
# failurePolicy: Fail, hard-coded. With the default objectSelector (every EG-managed Envoy pod)
# a dead controller would block the next rollout of the LAN ingress Envoy — git, sso, all of
# it. So the webhook only selects the dedicated `ai` Gateway's pods (apps/ai-gateway/gateway.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway-crds
  namespace: envoy-gateway-system
spec:
  chart:
    spec:
      chart: ai-gateway-crds-helm
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      version: v1.2.1
  install:
    createNamespace: true
  interval: 30m
  releaseName: ai-gateway-crds
  targetNamespace: envoy-ai-gateway-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-gateway
  namespace: envoy-gateway-system
spec:
  dependsOn:
    - name: ai-gateway-crds
  chart:
    spec:
      chart: ai-gateway-helm
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      version: v1.3.0
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: ai-gateway
  targetNamespace: envoy-ai-gateway-system
  upgrade:
    # 无状态、不带 CRD：升级失败（timeout 内未 Ready）自动回滚到上一版。有状态或带 CRD 的
    # release 保持 RetryOnFailure，回滚撤不回数据库 migration 和 CRD。重试用尽后 HelmRelease
    # 停在 Ready=False，由 FluxResourceNotReady 告警。
    remediation:
      retries: 3
  values:
    # GenAI tracing → otel-collector → VictoriaTraces, next to the Claude API's own spans
    # (service.name claude-platform). The ext_proc sidecar propagates traceparent upstream,
    # so Anthropic's server-side spans nest under the gateway span in one trace.
    # ⚠ Sidecar env is injected at pod CREATE by the webhook: changing these needs the `ai`
    # Envoy pod recreated (delete it; EG's Deployment brings it back).
    extProc:
      extraEnvVars:
        # gen_ai, not the default OpenInference: OpenInference records full prompts and
        # responses unless every OPENINFERENCE_HIDE_* is set; gen_ai keeps content opt-in
        # (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT, left unset) and uses the same
        # gen_ai.* attribute names as the claude-platform spans.
        - name: AI_GATEWAY_TRACING_SEMCONV
          value: gen_ai
        # Traces-specific endpoint on purpose: a generic OTEL_EXPORTER_OTLP_ENDPOINT would
        # also switch on OTLP metrics and Envoy access-log export, which the collector has
        # no pipelines for. Metrics stay on the Prometheus endpoint.
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: http/protobuf
        - name: OTEL_SERVICE_NAME
          value: ai-gateway
    controller:
      # Which gateway client (apps/ai-gateway SecurityPolicy forwardClientIDHeader) made the
      # call; keeps the chart's default session mapping.
      spanRequestHeaderAttributes: "agent-session-id:session.id,x-ai-client:ai_gateway.client"
      # Per-client usage for the key UI (apps/ai-gateway/keys-ui.yaml): last used, requests,
      # tokens. Low cardinality — one value per issued key.
      metricsRequestHeaderAttributes: "x-ai-client:ai_gateway.client"
      mutatingWebhook:
        # Without cert-manager the chart mints a fresh self-signed cert on every render, and the
        # running controller keeps serving the old one until restarted.
        certManager:
          enable: true
        objectSelector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: ai
            gateway.envoyproxy.io/owning-gateway-namespace: ai-gateway
