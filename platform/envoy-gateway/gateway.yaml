# LAN ingress for k3s services on ad.ddupan.top.
#
# Replaced Contour 2026-07-25 because Contour speaks only gRPC ext_authz and the
# forward-auth target of the time (Authelia) only HTTP. Authelia and forward-auth are
# both retired (2026-10-11); apps now authenticate themselves against iam-login.
#
# Everything else carried over unchanged: the Gateway API objects, the wildcard cert
# from ../cert-manager, and the DNS A records in ../../infrastructure/samba-ad.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg
  listeners:
    # Plaintext :80 — ACME http-01 (the bao-acme ClusterIssuer solves through here)
    # and HTTP->HTTPS redirects. Never serve anything sensitive on it.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

    # HTTPS :443. One wildcard covers every LAN service, so adding a service is an
    # HTTPRoute + a DNS A record — no cert work and no edit here.
    #
    # ⚠ The cert Secret MUST live in this Gateway's namespace (a listener may only
    # reference a Secret in its own namespace without a ReferenceGrant), which is why
    # cert-manager/certificate-wildcard-ad.yaml issues into envoy-gateway-system.
    #
    # ⚠ Never point this at a Secret the gateway controller generates for its own
    # internal use. Doing exactly that with Contour's `contourcert-*` xDS secret killed
    # its dataplane for 141 days — see the legacy Git history.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.ad.ddupan.top"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-ad-ddupan-top-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

    # HTTPS :443 for lab.ddupan.top — the zone services migrate to (PowerDNS,
    # ../../infrastructure/dns/). Its own listener because a listener carries one
    # hostname. An HTTPRoute attached here (sectionName: https-lab) gets its DNS
    # record from external-dns (../external-dns), so it needs no DNS work either.
    - name: https-lab
      protocol: HTTPS
      port: 443
      hostname: "*.lab.ddupan.top"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-lab-ddupan-top-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

    # HTTPS :443 for git.ddupan.top. Its own listener: one hostname per listener,
    # and the *.ad.ddupan.top wildcard cannot match a name in the ddupan.top zone
    # (different zone, one label shallower). Envoy picks between listeners by SNI.
    #
    # Exists so `git push` stays on the LAN instead of going out to Cloudflare and
    # back down the tunnel into this same cluster. The repo is what you need during
    # an incident, so it must not depend on the WAN. Cert:
    # ../cert-manager/certificate-git-ddupan.yaml; route: ../../apps/gitea/httproute.yaml.
    # TLS :443 passthrough for SPIRE's SPIFFE Bundle Endpoint. SPIRE terminates TLS itself
    # (https_web profile, its own cert for this one name), so this listener holds no cert.
    # The exact hostname wins over the *.lab.ddupan.top listener by SNI.
    # Route: ../spire/tlsroute.yaml.
    - name: tls-spire-bundle
      protocol: TLS
      port: 443
      hostname: "spire-bundle.lab.ddupan.top"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: spire-server
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute

    - name: https-git
      protocol: HTTPS
      port: 443
      hostname: "git.ddupan.top"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-ddupan-top-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

    # HTTPS :443 for sso.ddupan.top, the iam-login issuer. Same reason as the
    # auth/git listeners: one hostname per listener, outside the *.ad.ddupan.top
    # wildcard. Without it, Gitea's token exchange and its pod-start discovery
    # fetch would hairpin through Cloudflare. Cert:
    # ../cert-manager/certificate-sso-ddupan.yaml; route: ../../apps/iam-login/httproute.yaml.
    - name: https-sso
      protocol: HTTPS
      port: 443
      hostname: "sso.ddupan.top"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: sso-ddupan-top-tls
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

    # HTTPS :443 for spire-oidc.ddupan.top, the public SPIRE JWT issuer. In-cluster verifiers
    # use this path so they keep working when the WAN is down; the internet reaches the same
    # Service through the Cloudflare tunnel. Only spire-server may attach. Cert:
    # ../cert-manager/certificate-spire-oidc-ddupan.yaml; route: ../spire/httproute.yaml.
    - name: https-spire-oidc
      protocol: HTTPS
      port: 443
      hostname: "spire-oidc.ddupan.top"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: spire-oidc-ddupan-top-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: spire-server
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
