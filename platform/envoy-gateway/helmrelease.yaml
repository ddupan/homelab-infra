apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  chart:
    spec:
      chart: gateway-helm
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
      version: 1.10.0
  # Hooks for Agent Router (ex-Envoy AI Gateway, ./agent-router.yaml): its controller rewrites the
  # xDS of AIGatewayRoutes, and its Backends (api.anthropic.com) are Backend objects.
  # ⚠ The hooks see EVERY listener/route/cluster, including the whole LAN ingress. EG fails closed by
  # default — an unreachable extension server freezes xDS updates for all of it. failOpen: true
  # confines a dead ai-gateway-controller to the AI routes.
  values:
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
        extensionManager:
          failOpen: true
          hooks:
            xdsTranslator:
              translation:
                listener: {includeAll: true}
                route: {includeAll: true}
                cluster: {includeAll: true}
                secret: {includeAll: true}
              post: [Translation, Cluster, Route]
          service:
            fqdn:
              hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
              port: 1063
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: envoy-gateway
  targetNamespace: envoy-gateway-system
  timeout: 10m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
