---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-spire-values
  namespace: spire-mgmt
  labels:
    # Flux re-renders the HelmRelease as soon as this changes, not at its next interval.
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    global:
      k8s:
        clusterDomain: cluster.local
      spire:
        bundleConfigMap: spire-bundle
        clusterName: sandbox
        trustDomain: ddupan.top
        namespaces:
          create: false
          system:
            name: spire-system
          server:
            name: spire-server
        recommendations:
          enabled: true
          namespaceLayout: true
          namespacePSS: true
          priorityClassName: true
          strictMode: true
          securityContexts: true
          prometheus: false

    spire-server:
      enabled: false

    spire-agent:
      enabled: true
      serviceAccount:
        name: spire-agent
      server:
        address: spire-server.lab.ddupan.top
        port: 8081
      nodeAttestor:
        k8sPSAT:
          enabled: true
      workloadAttestors:
        k8s:
          enabled: true
        unix:
          enabled: false
      # Delegated Identity API for spire-identity-exchange (platform/sandbox-identity-exchange):
      # the admin socket is put on the host so that Pod can mount it, and only the exchange's own
      # SVID may use it. It mints SVIDs only for entries matching the selectors it derives from
      # validated tokens (GitHub CI: platform/spire/github-ci.yaml).
      sockets:
        admin:
          enabled: true
          mountOnHost: true
      authorizedDelegates:
        - spiffe://ddupan.top/sandbox/spire-identity-exchange
      telemetry:
        prometheus:
          enabled: true
          podMonitor:
            enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 192Mi

    spiffe-csi-driver:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi

    spiffe-oidc-discovery-provider:
      enabled: false

    upstream:
      enabled: false
    tornjak-frontend:
      enabled: false
    spire-identity-exchange:
      enabled: false
    spike-keeper:
      enabled: false
    spike-nexus:
      enabled: false
    spike-pilot:
      enabled: false
