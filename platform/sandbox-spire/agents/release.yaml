---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sandbox-spire
  namespace: spire-mgmt
spec:
  chart:
    spec:
      chart: spire
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: spiffe-hardened
      version: 0.31.0
  dependsOn:
    - name: spire-crds
      namespace: spire-mgmt
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: sandbox-spire
  targetNamespace: spire-mgmt
  timeout: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: sandbox-spire-values
