apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  # Hourly; a run is a few minutes per repo. Forbid so a slow run is never doubled.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 0
            fsGroup: 0
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.227.4@sha256:fe058db9710840a4821f20190b3769e3ce709a049b8640aa2bf5f044969fe702
              env:
                - {name: RENOVATE_CONFIG_FILE, value: /config/config.js}
                - {name: LOG_LEVEL, value: info}
                # Go 模块走 Artifact Keeper 的 pull-through 缓存，与 CI 相同；直连 proxy.golang.org
                # 时外网随机断开，每次运行都有一批模块 lookup 返回 no-result，分组 PR 因此缺项。
                - {name: GOPROXY, value: https://artifacts.lab.ddupan.top/go/go-proxy}
                - {name: GOPRIVATE, value: git.ddupan.top}
              envFrom:
                - secretRef: {name: renovate}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {cpu: "1", memory: 2Gi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: config
              configMap: {name: renovate-config}
            # Clones and runtime-installed tools (binarySource=install) land here.
            - name: tmp
              emptyDir: {sizeLimit: 5Gi}
