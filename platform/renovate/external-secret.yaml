# Gitea PAT of the restricted `renovate-bot` user (see README for scopes). Written to
# Bao directly at bootstrap; nothing else holds it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: renovate
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: k8s/renovate
        property: token
