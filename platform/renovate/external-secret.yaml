# Tokens written to Bao directly at bootstrap (README); nothing else holds them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: renovate
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: k8s/renovate
        property: token
    # Read-only fine-grained GitHub PAT (public repos, no permissions): anonymous
    # api.github.com is 60 req/h, which one run exhausts (github-actions, github-releases).
    - secretKey: GITHUB_COM_TOKEN
      remoteRef:
        key: k8s/renovate
        property: github_com_token
