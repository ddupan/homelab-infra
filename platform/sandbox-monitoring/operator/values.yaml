---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-operator-values
  namespace: monitoring
  labels:
    # Flux re-renders the HelmRelease as soon as this changes, not at its next interval.
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    crds:
      plain: true
      cleanup:
        enabled: false
    operator:
      disable_prometheus_converter: true
    serviceMonitor:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
