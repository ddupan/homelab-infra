---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-state-metrics
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      version: 9.0.1
  install:
    remediation:
      retries: 3
  interval: 30m
  releaseName: kube-state-metrics
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    # 无状态、不带 CRD：升级失败（timeout 内未 Ready）自动回滚到上一版。有状态或带 CRD 的
    # release 保持 RetryOnFailure，回滚撤不回数据库 migration 和 CRD。重试用尽后 HelmRelease
    # 停在 Ready=False。⚠ sandbox 尚未采集 gotk_resource_info，FluxResourceNotReady 覆盖不到这里。
    remediation:
      retries: 3
  values:
    prometheus:
      monitor:
        enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
