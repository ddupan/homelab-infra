---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: sandbox
  namespace: monitoring
spec:
  externalLabels:
    cluster: sandbox
  remoteWrite:
    - url: https://metrics-write.ad.ddupan.top/api/v1/write
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scrapeInterval: 30s
  selectAllByDefault: true
