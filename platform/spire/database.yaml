# pg-prod 上的数据库由 Ayatori 供应（../../clusters/ayatori-prod/spire-server.yaml），凭据只交付到 OpenBao。
# 本 namespace 以自己的 SA 登录 bao：spire-server-database role（../../infrastructure/openbao/terraform/
# ayatori-database-consumers.tf）只能读这一份凭据，共享的 ClusterSecretStore 无需读取所有租户。
# spire-server 的 datastore 密码取自这里（values.yaml dataStore.sql.externalSecret；2026-10-13 自 CNPG 迁入）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server-database
  namespace: spire-server
# Used only by ESO to log in to bao; nothing mounts its token.
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ayatori-prod
  namespace: spire-server
spec:
  provider:
    vault:
      server: 'https://bao.lab.ddupan.top:8200'
      path: 'kv'
      version: 'v2'
      auth:
        kubernetes:
          mountPath: 'kubernetes'
          role: 'spire-server-database'
          serviceAccountRef:
            name: 'spire-server-database'
---
# Reads the latest version: only Ayatori writes this path, and every version it writes is usable.
# Pods pick up a re-issued credential on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spire-server-pgprod
  namespace: spire-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ayatori-prod
  target:
    name: spire-server-pgprod
    creationPolicy: Owner
    template:
      data:
        host: '{{ .host }}'
        # 直连租户端口，不走连接池：SPIRE 的驱动是 lib/pq（见 values.yaml dataStore.sql）。
        # chart 只从这里取 password；host/port 在 values.yaml。
        port: '{{ .port }}'
        database: '{{ .database }}'
        username: '{{ .username }}'
        password: '{{ .password }}'
        # verify-full：服务端证书由内部 CA 签发，CA 用 trust-manager 分发的 ConfigMap internal-ca（ca.pem）。
        sslmode: '{{ .sslmode }}'
  dataFrom:
    - extract:
        key: ayatori/prod/applications/3c561678-1239-4d57-9ace-54c309926fc8
