# Serving cert of the SPIFFE Bundle Endpoint (values.yaml spire-server.federation). SPIRE terminates
# TLS itself (the Gateway only passes it through), so the cert must live in this namespace. A second
# copy of the *.lab.ddupan.top wildcard rather than a per-host name, to keep the host out of
# Certificate Transparency logs (same reasoning as ../cert-manager/certificate-wildcard-lab.yaml).
# SPIRE re-reads the files every fileSyncInterval (1h), so renewals need no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spire-bundle
  namespace: spire-server
spec:
  secretName: spire-bundle-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: "*.lab.ddupan.top"
  dnsNames:
    - "*.lab.ddupan.top"
  duration: 2160h    # 90d — Let's Encrypt maximum
  renewBefore: 720h  # 30d; the WAN is unreliable
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
