apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: spire-values
    namespace: spire-mgmt
    files:
      - values.yaml=values.yaml
resources:
  - namespaces.yaml
  - helmrepository.yaml
  - gitrepository-fork.yaml
  - helmrelease-crds.yaml
  - helmrelease.yaml
  - httproute.yaml
  - certificate.yaml
  - local-development-identity.yaml
  - iam-build-ci-publish.yaml
  - spire-node-aliases.yaml
  - database.yaml
