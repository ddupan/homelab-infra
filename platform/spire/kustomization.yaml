apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: spire-values
    namespace: spire-mgmt
    files:
      - values.yaml=values.yaml
  # OCI region roots for the oci_instance NodeAttestor (values.yaml customPlugins). Public certs,
  # as returned by GET auth.ap-osaka-1.oraclecloud.com/v1/instancePrincipalRootCACertificates on
  # 2026-11-13 (base64 DER wrapped in PEM). The plugin re-reads the file on every attestation, so a
  # rotation is: fetch again, replace the file, merge; no spire-server restart.
  - name: oci-instance-roots
    namespace: spire-server
    files:
      - roots.pem=oci-instance-roots.pem
resources:
  - namespaces.yaml
  - helmrepository.yaml
  - ocirepository-fork.yaml
  - helmrelease-crds.yaml
  - helmrelease.yaml
  - httproute.yaml
  - certificate.yaml
  - local-development-identity.yaml
  - spire-node-aliases.yaml
  - etcd-members.yaml
  - oci-arm.yaml
  - ayatori-compute-agents.yaml
  - database.yaml
  - tlsroute.yaml
