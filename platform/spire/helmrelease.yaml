apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-mgmt
spec:
  chart:
    spec:
      chart: ./charts/spire
      interval: 1h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: spiffe-hardened-fork
  dependsOn:
    - name: spire-crds
      namespace: spire-mgmt
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: spire
  targetNamespace: spire-mgmt
  timeout: 15m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: spire-values
