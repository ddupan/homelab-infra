# Workloads on oci-arm. The oci_instance agent ID is the instance OCID and survives re-attestation
# (no leaf fingerprint in it, unlike x509pop), so entries parent to it directly without a node alias.
# A rebuilt instance gets a new OCID: update parentID here.
---
# Renovate's credential helper (infrastructure/oci/ansible/roles/renovate). The uid is a dedicated,
# login-less user that is not in the docker group; Bao's jwt-spire role `renovate` maps this ID to
# read-only access to Renovate's two tokens.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: oci-arm-renovate
  labels:
    spire.spiffe.io/class-name: spire-mgmt-spire
spec:
  className: spire-mgmt-spire
  parentID: spiffe://ddupan.top/spire/agent/oci_instance/ocid1.instance.oc1.ap-osaka-1.anvwsljroshrbqact2buxnlpae2ow3vetmzghyvedkqvugur6i7umgls5pnq
  spiffeID: spiffe://ddupan.top/node/oci-arm/renovate
  selectors:
    - unix:uid:12021
