apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spire-oidc-discovery-provider
  namespace: spire-server
spec:
  parentRefs:
    # The issuer host; external-dns publishes it.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
    # LAN path to the public name. external-dns only writes lab.ddupan.top, so this adds no
    # record; split-horizon comes from infrastructure/dns/records.yml.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-spire-oidc
  hostnames:
    - spire-oidc.lab.ddupan.top
    - spire-oidc.ddupan.top
  rules:
    - backendRefs:
        - name: spire-spiffe-oidc-discovery-provider
          port: 80
