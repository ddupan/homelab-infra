# SPIRE Agent for a host outside any Kubernetes cluster (/etc/spire-agent/agent.conf).
agent {
  data_dir          = "/var/lib/spire-agent"
  log_level         = "INFO"
  server_address    = "spire-server.ad.ddupan.top"
  server_port       = "8081"
  socket_path       = "/run/spire-agent/agent.sock"
  # Initial bundle from `spire-server bundle show` (public). Only used to bootstrap;
  # the agent keeps it current from the server afterwards.
  trust_bundle_path = "/etc/spire-agent/bootstrap-bundle.pem"
  trust_domain      = "ddupan.top"
}

plugins {
  # On disk so the agent SVID survives restarts: a join token is single-use, and an
  # agent that loses its key needs a new token and a new parent ID in every entry.
  KeyManager "disk" {
    plugin_data { directory = "/var/lib/spire-agent" }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
