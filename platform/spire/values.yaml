global:
  k8s:
    clusterDomain: cluster.local
  spire:
    clusterName: homelab
    trustDomain: ddupan.top
    # The `iss` of every JWT-SVID. Consumers that check it: Bao jwt-spire
    # (bound_issuer), zot (bearer.oidc[].issuer), iam-login (spiffe.issuer) and the Anthropic
    # Console's federation issuer, which is set by hand.
    # Changing it is a cutover for all three — see README "Issuer migration".
    # Public so verifiers outside the LAN can reach it (Entra, Google, OCI). Moved from
    # spire-oidc.lab on 2026-11-09.
    jwtIssuer: https://spire-oidc.ddupan.top
    caSubject:
      country: CN
      organization: ddupan homelab
      commonName: ddupan.top
    namespaces:
      create: false
      system:
        name: spire-system
      server:
        name: spire-server
    recommendations:
      enabled: true
      namespaceLayout: true
      namespacePSS: true
      priorityClassName: true
      strictMode: true
      securityContexts: true
      prometheus: false

spire-server:
  kind: statefulset
  replicaCount: 1
  auditLogEnabled: true
  # Sandbox CI creates one attested node record per executor Pod (Agent ID has the
  # Pod UID) and nothing evicts them, so they would pile up forever. Real nodes
  # re-attest if they were down longer than this. pruneTOFUNodes stays off: a
  # join_token node that loses its record cannot come back without a new token.
  pruneAttestedNodesExpiredFor: "168h"
  service:
    type: LoadBalancer
    port: 8081
    loadBalancerIP: 192.168.10.127
  kubeConfigs:
    sandbox:
      externalSecret:
        name: spire-external-kubeconfigs
        key: sandbox
    sandbox-controller:
      externalSecret:
        name: spire-external-kubeconfigs
        key: sandbox-controller
    sandbox-runner-bundle:
      externalSecret:
        name: spire-external-kubeconfigs
        key: sandbox-controller
  nodeAttestor:
    # Hosts outside any Kubernetes cluster (the iam-login build LXC on pve1) attest once
    # with a single-use token from `spire-server token generate`, then renew their own SVID.
    # The token is consumed on first use; the resulting agent ID is what entries parent to.
    # See README.md "集群外 Agent".
    joinToken:
      enabled: true
    # Hosts managed by Cinc (homelab_base spire_agent): x509pop with a node
    # certificate each host obtains and renews itself over ACME from Bao's dedicated
    # pki-spire-nodes CA (EAB only at first enrollment, infrastructure/chef/). Unlike
    # join_token it re-attests, so downtime or a lost data_dir needs no human.
    # The agent ID embeds the leaf fingerprint and changes on every renewal, so
    # entries parent to a stable node alias (spire-node-aliases.yaml), never to it.
    # Public CA only: anything chaining to it IS a node identity, hence its own root.
    x509POP:
      enabled: true
      mode: externalPKI
      caBundle:
        bundle: |
          -----BEGIN CERTIFICATE-----
          MIIBszCCAVmgAwIBAgIUTl+uDchLiMaQOI2QOLlVJ7pnO5wwCgYIKoZIzj0EAwIw
          JzElMCMGA1UEAxMcZGR1cGFuIGhvbWVsYWIgU1BJUkUgbm9kZSBDQTAeFw0yNjEw
          MDkwOTE3MzlaFw0zNjEwMDYwOTE4MDlaMCcxJTAjBgNVBAMTHGRkdXBhbiBob21l
          bGFiIFNQSVJFIG5vZGUgQ0EwWTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAATQ/R/U
          C3HvJ3XpLGT5WBFPw3VpgtPvhquj0aXdPBLaVvyUilGmnkgm38X1IWivA1Yk9AUZ
          SQTXWG/Svfke3/ZCo2MwYTAOBgNVHQ8BAf8EBAMCAQYwDwYDVR0TAQH/BAUwAwEB
          /zAdBgNVHQ4EFgQUzrK6CV0+gOsQTqH4IzDte1b6ThswHwYDVR0jBBgwFoAUzrK6
          CV0+gOsQTqH4IzDte1b6ThswCgYIKoZIzj0EAwIDSAAwRQIgVGhL5eAZ/TeHMr/V
          hxAcE1tl3fUm/RMjAdYxRSLtplMCIQDtKv1pF8AwirHsqjFBJwq6p39HTzb+ZhFy
          84CUUinGCg==
          -----END CERTIFICATE-----
    externalK8sPSAT:
      enabled: true
      clusters:
        sandbox:
          kubeConfigName: sandbox
          serviceAccountAllowList:
            - spire-system:spire-agent
        sandbox-kata:
          kubeConfigName: sandbox
          serviceAccountAllowList:
            - spire-smoke:spire-smoke
            - opensandbox:gitea-ci
          usePodUIDForAgentID: true
  # OCI instances (oci-arm first; homelab-infra #642): attest with the instance identity certificate
  # from IMDS, via our own plugin (github.com/panxiao81/spire-plugin-oci). SPIRE has no OCI attestor,
  # and x509pop rejects OCI's leaf (no KeyUsage). The agent ID is .../spire/agent/oci_instance/<instance
  # OCID> and stays stable across the ~2h leaf rotation, so entries parent to it directly.
  # The chart copies plugin_cmd out of the image in an init container (it supplies busybox itself,
  # so a scratch image works). Pinned by digest, pulled straight from ghcr like spire-server's own
  # image; once pulled, containerd's cache covers restarts. plugin_checksum is the server-amd64 line
  # of the release's SHA256SUMS; bump image digest and checksum together.
  customPlugins:
    nodeAttestor:
      oci_instance:
        plugin_cmd: /spire-plugin-oci-server
        plugin_checksum: ea3792fb27f47d391b2e657f0f495ea3715c7f39ecc9a3c8412d541a7ea51645
        image:
          registry: ghcr.io
          repository: panxiao81/spire-plugin-oci
          tag: v0.1.1@sha256:94eef6462e88496b88670d4868d6186d3e0882648c519024d42d3677e3845b1e
          pullPolicy: IfNotPresent
        plugin_data:
          trust_bundle_path: /etc/oci-instance-roots/roots.pem
          # The roots are shared by every OCI customer in the region; this is the actual gate.
          tenancy_allow_list:
            - ocid1.tenancy.oc1..aaaaaaaalncmdinfnljot5oh7rqleavphhsa6jpyurfu4luztcct3tp5gsfa
  externalControllerManagers:
    enabled: true
    clusters:
      sandbox:
        kubeConfigName: sandbox-controller
        # Dynamic OpenSandbox runner identities are exact Pod-UID-bound
        # ClusterStaticEntries created in the sandbox cluster. The chart
        # defaults this reconciler to false, so enable the central registration
        # path explicitly.
        reconcile:
          clusterStaticEntries: true
  bundlePublisher:
    externalK8sConfigMap:
      enabled: true
      clusters:
        sandbox:
          kubeConfigName: sandbox-controller
          namespace: spire-system
          configMapName: spire-bundle
          configMapKey: bundle.spiffe
          format: spiffe
        sandbox-runner-bundle:
          kubeConfigName: sandbox-runner-bundle
          namespace: opensandbox
          configMapName: spire-bundle-pem
          configMapKey: bundle.pem
          format: pem
  persistence:
    # PostgreSQL stores registrations, but the disk KeyManager still needs durable
    # storage for the trust-domain signing keys.
    type: pvc
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: localpv-zfs-ceph
  dataStore:
    sql:
      databaseType: postgres
      databaseName: spire
      # pg-prod (Ayatori tenant spire, database.yaml), DIRECT 5432 — not the PgBouncer pool: SPIRE's datastore is
      # jinzhu/gorm on lib/pq, whose unnamed statements span two Syncs and break under transaction pooling
      # (Gitea hit it 2026-10-13; see infrastructure/shared-postgresql/README.md). verify-full against the
      # internal CA (trust-manager ConfigMap internal-ca, mounted below).
      host: pg-prod.lab.ddupan.top
      port: 5432
      username: spire
      options:
        - sslmode: verify-full
      rootCAPath: /etc/internal-ca/ca.pem
      externalSecret:
        enabled: true
        name: spire-server-pgprod
        key: password
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 30m
  controllerManager:
    enabled: true
    # Identities are opt-in. Do not issue a fallback SVID to every pod in the
    # cluster merely because it can mount the Workload API socket.
    identities:
      clusterSPIFFEIDs:
        default:
          enabled: false
        test-keys:
          enabled: false

  extraVolumes:
    - name: internal-ca
      configMap:
        name: internal-ca
    - name: oci-instance-roots
      configMap:
        name: oci-instance-roots
  extraVolumeMounts:
    - name: internal-ca
      mountPath: /etc/internal-ca
      readOnly: true
    # A directory mount, not subPath: subPath mounts never see ConfigMap updates, and root
    # rotation relies on the file changing under the running server.
    - name: oci-instance-roots
      mountPath: /etc/oci-instance-roots
      readOnly: true
  # SPIFFE Bundle Endpoint (WebPKI) for relying parties that verify SVIDs without being in the
  # trust domain: iam-login's JWT-SVID client authentication (draft-ietf-oauth-spiffe-client-auth
  # §6.1 requires the https_web profile). Served at https://spire-bundle.lab.ddupan.top through an
  # Envoy TLS passthrough listener (tlsroute.yaml), with its own Let's Encrypt cert (certificate.yaml).
  # ⚠ Port 8444, not the chart's 8443: the Service is a LoadBalancer on 192.168.10.127, where
  # Incus already listens on 8443 and kube-proxy's DNAT would silently take it over. The bundle
  # is public key material, so its also being reachable on .127:8444 is harmless.
  federation:
    enabled: true
    bundleEndpoint:
      port: 8444
    tls:
      spire:
        enabled: false
      externalSecret:
        enabled: true
        secretName: spire-bundle-tls
spire-agent:
  server:
    # Keep the Agent endpoint aligned with spire-server.service.port. The
    # chart defaults this to 443, which only remained unnoticed while the
    # Agent's pre-upgrade gRPC connection stayed alive.
    port: 8081
  nodeAttestor:
    k8sPSAT:
      enabled: true
  workloadAttestors:
    k8s:
      enabled: true
    unix:
      # The node Agent also exposes its Workload API socket on the host. Enable
      # Unix attestation so local development processes can receive an identity
      # through an explicitly scoped ClusterStaticEntry.
      enabled: true

spiffe-csi-driver:
  enabled: true

spiffe-oidc-discovery-provider:
  enabled: true
  config:
    # Adds "use":"sig" to each JWK. Entra rejects a JWKS without it; other verifiers ignore it.
    setKeyUse: true
    # Host allowlist: the lab name stays because Bao (jwks_url) and iam-login (jwk-set-uri)
    # fetch keys there. jwt_issuer stays fixed, so the discovery document says the public
    # issuer whichever name serves it.
    additionalDomains:
      - spire-oidc.lab.ddupan.top
  # TLS will terminate at the existing Envoy Gateway when the stable issuer is
  # exposed. The service remains ClusterIP-only during the first deployment.
  tls:
    spire:
      enabled: false
    externalSecret:
      enabled: false
    certManager:
      enabled: false

upstream:
  enabled: false
tornjak-frontend:
  enabled: false
spire-identity-exchange:
  enabled: false
spike-keeper:
  enabled: false
spike-nexus:
  enabled: false
spike-pilot:
  enabled: false
