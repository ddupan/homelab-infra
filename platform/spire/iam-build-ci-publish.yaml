# iam-login CI publish identity on the iam-build runner (pve1 LXC 104), used by
# scripts/publish-image to push the tested native image to zot iam/iam-login.
# parentID is that host's join_token agent; the token in it was consumed at attestation
# (re-attested 2026-10-31 after its SVID expired while pve1 was down) and is only an identifier now. Re-attesting the host means a new agent ID
# here. uid 0: the runner runs every job as root. See external-agent/README.md.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: iam-build-ci-publish
  labels:
    spire.spiffe.io/class-name: spire-mgmt-spire
spec:
  className: spire-mgmt-spire
  parentID: spiffe://ddupan.top/spire/agent/join_token/32245b13-59fd-4ec5-855c-d958f2fa2b6b
  spiffeID: spiffe://ddupan.top/ci/panxiao81/iam-login/publish
  selectors:
    - unix:uid:0
