apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-values
    namespace: monitoring
    files:
      - values.yaml=values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: grafana-dashboard-victoriametrics
    namespace: monitoring
    files:
      - victoriametrics.json=dashboards/victoriametrics.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-homelab-memory
    namespace: monitoring
    files:
      - homelab-memory.json=dashboards/homelab-memory.json
    options:
      labels:
        grafana_dashboard: "1"
resources:
  - helmrelease.yaml
  - httproute.yaml
  - sso-external-secret.yaml
