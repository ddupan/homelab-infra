apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: grafana-values
  namespace: monitoring
  files:
  - values.yaml=values.yaml
  options:
    labels:
      reconcile.fluxcd.io/watch: Enabled
- name: grafana-dashboard-node-exporter
  namespace: monitoring
  files:
  - node-exporter.json=dashboards/node-exporter.json
  options:
    labels:
      grafana_dashboard: '1'
    annotations:
      grafana_folder: Hosts
- name: grafana-dashboard-homelab-memory
