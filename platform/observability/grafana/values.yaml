# Grafana — single pane over metrics (VictoriaMetrics), logs (VictoriaLogs) and
# traces (VictoriaTraces via Jaeger API). LAN: grafana.lab.ddupan.top,
# authenticated via iam-login OIDC (sso.ddupan.top). Local admin is
# break-glass only.
#
# Chart: grafana/grafana   (repo: https://grafana.github.io/helm-charts)

# --- VictoriaLogs needs its Grafana datasource plugin ---
plugins:
  - victoriametrics-logs-datasource

# --- Dashboard sidecar: auto-loads any ConfigMap labeled grafana_dashboard=1 in the
# namespace. Boards live in ./dashboards (upstream ones via ./dashboards/import.py) and are
# turned into ConfigMaps by kustomization.yaml ---
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# --- Provisioned datasources ---
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://vmsingle-main.monitoring.svc:8428
        isDefault: true
        jsonData:
          prometheusType: Prometheus
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://vmalertmanager-main.monitoring.svc:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlsingle-main.monitoring.svc:9428
      - name: VictoriaTraces
        type: jaeger
        access: proxy
        # VictoriaTraces (VTSingle CR) exposes a Jaeger-compatible query API under /select/jaeger.
        url: http://vtsingle-main.monitoring.svc:10428/select/jaeger

# --- Persistence on OpenEBS ZFS ---
persistence:
  enabled: true
  storageClassName: localpv-zfs-ceph
  size: 5Gi

# localpv-zfs-ceph cannot mount the same RWO volume into the old and new Grafana
# Pods concurrently. RollingUpdate leaves the old Pod serving while the new Pod
# blocks forever in verifyMount, so upgrades must stop the old Pod first.
deploymentStrategy:
  type: Recreate

# 内网入口由 httproute.yaml 接入 Envoy，使用现有通配 TLS 证书。
# 客户端通过既有内网 DNS 转发解析，无需独立 Tailscale Ingress。
ingress:
  enabled: false

# --- OIDC via iam-login (sso.ddupan.top; AD groups -> Grafana roles) ---
# client_secret comes from the grafana-sso Secret (sso-external-secret.yaml), which Terraform fills in bao
# (apps/iam-login/terraform/clients.tf). The env var overrides any value in grafana.ini.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-sso
      key: client_secret

grafana.ini:
  server:
    root_url: "https://grafana.lab.ddupan.top"   # 与 iam-login 客户端的 redirect_uri 一致
  auth:
    # Keep the local admin login available as break-glass; don't force OIDC-only.
    disable_login_form: false
    oauth_auto_login: false
  auth.generic_oauth:
    enabled: true
    name: SSO
    client_id: grafana
    scopes: "openid profile email groups"
    auth_url: "https://sso.ddupan.top/oauth2/authorize"
    token_url: "https://sso.ddupan.top/oauth2/token"
    api_url: "https://sso.ddupan.top/userinfo"
    # The client is registered for client_secret_basic; don't let Go's oauth2 auto-detect try POST params.
    auth_style: InHeader
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    groups_attribute_path: groups
    # The platform's administrator group (infrastructure/samba-ad) -> Grafana server admin (and org Admin);
    # everyone else who can sign in -> Viewer. AD's Domain/Enterprise Admins no longer grant app roles.
    role_attribute_path: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || 'Viewer'"
    allow_assign_grafana_admin: true
    role_attribute_strict: false
    use_pkce: true

# Dashboards are loaded by the sidecar (above); see kustomization.yaml.
