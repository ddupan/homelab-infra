# Client secret of Grafana's `grafana` client at the iam-login issuer (sso.ddupan.top). Terraform registers the
# client and writes the secret to bao (apps/iam-login/terraform/clients.tf); nobody handles it by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-sso
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-sso
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: k8s/grafana-sso
        property: client_secret
