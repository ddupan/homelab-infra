# Grafana 自身使用 OIDC，不增加第二层 forward-auth。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-lan
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.ad.ddupan.top
  rules:
    - backendRefs:
        - name: grafana
          port: 80
