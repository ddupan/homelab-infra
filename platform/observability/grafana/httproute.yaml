# Grafana 自身使用 OIDC，不增加第二层 forward-auth。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-lan
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/group: "平台"
    gethomepage.dev/icon: "grafana.svg"
    gethomepage.dev/description: "监控与日志"
    gethomepage.dev/href: "https://grafana.lab.ddupan.top/"
    gethomepage.dev/app: "grafana"
spec:
  parentRefs:
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. See infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - grafana.lab.ddupan.top
  rules:
    - backendRefs:
        - name: grafana
          port: 80
---
# The old name only redirects: root_url and the OAuth callback are on the lab name, and Grafana's OAuth state
# cookie is per host, so a login started on the ad name would fail at the callback. Remove together with the
# Samba A record once nothing uses the old name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-ad-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.ad.ddupan.top
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: grafana.lab.ddupan.top
            statusCode: 301
