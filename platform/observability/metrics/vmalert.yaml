# Rule evaluator. selectAllByDefault picks up every VMRule in all namespaces
# (see ./rules). Reads from and writes alert/recording state to VMSingle;
# sends firing alerts to VMAlertmanager.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: main
  namespace: monitoring
spec:
  replicaCount: 1
  selectAllByDefault: true
  evaluationInterval: 30s
  # 告警 Source 复用已认证的 Grafana 入口，携带表达式和触发时间。
  # 整个 Explore JSON 一次性 URL 编码，避免表达式中的引号、&、+ 损坏链接。
  extraArgs:
    external.url: https://grafana.lab.ddupan.top
    external.alert.source: 'explore?left={{ printf "{\"datasource\":\"VictoriaMetrics\",\"queries\":[{\"expr\":%s,\"refId\":\"A\"}],\"range\":{\"from\":\"%d\",\"to\":\"now\"}}" (.Expr | jsonEscape) .ActiveAt.UnixMilli | queryEscape }}'
  datasource:
    url: http://vmsingle-main.monitoring.svc:8428
  remoteWrite:
    url: http://vmsingle-main.monitoring.svc:8428
  remoteRead:
    url: http://vmsingle-main.monitoring.svc:8428
  # 第二个 notifier 是 oci-arm 上的外部 Alertmanager（经 Tailscale），dead-man 用：
  # 它靠持续收到 Watchdog 来抑制 LabWatchdogMissing。所有告警都会推过去，那边只代发
  # 告警链路自身的故障，其余丢弃。oci-arm 不可达时这里会累计发送错误，触发 AlertmanagerErrors。
  notifiers:
    - url: http://vmalertmanager-main.monitoring.svc:9093
    - url: http://100.99.94.44:9093
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
