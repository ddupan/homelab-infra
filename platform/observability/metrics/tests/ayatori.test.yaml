rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: Prod 目标不可采集为 critical，Dev 为 warning
  interval: 1m
  input_series:
  - series: up{job="ayatori-manager",cluster="ayatori-prod",env="prod"}
    values: 0x10
  - series: up{job="ayatori-manager",cluster="ayatori-dev",env="dev"}
    values: 0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: AyatoriTargetDown
    exp_alerts:
    - exp_labels: {job: ayatori-manager, cluster: ayatori-prod, env: prod, severity: critical}
      exp_annotations:
        summary: Ayatori ayatori-prod 的 ayatori-manager 不可采集
        description: 检查对应 LXC 与 systemd/quadlet 服务；KSM 不可采集时 Instance/Tenant 状态告警同时失效。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
    - exp_labels: {job: ayatori-manager, cluster: ayatori-dev, env: dev, severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-dev 的 ayatori-manager 不可采集
        description: 检查对应 LXC 与 systemd/quadlet 服务；KSM 不可采集时 Instance/Tenant 状态告警同时失效。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: Ayatori 的 Flux 对象不命中集群内 Flux 规则，只命中 Ayatori 规则
  interval: 1m
  input_series:
  - series: gotk_resource_info{job="ayatori-kube-state-metrics",cluster="ayatori-prod",ready="False",customresource_kind="Kustomization",resource_namespace="flux-system",name="gitops"}
    values: 1x30
  - series: gotk_resource_info{job="kube-state-metrics",customresource_kind="Kustomization",resource_namespace="flux-system",name="flux-system",ready="True"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: FluxResourceNotReady
    exp_alerts: []
  - eval_time: 20m
    alertname: AyatoriFluxNotReady
    exp_alerts:
    - exp_labels: {job: ayatori-kube-state-metrics, cluster: ayatori-prod, ready: 'False', customresource_kind: Kustomization, resource_namespace: flux-system, name: gitops, severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod Flux Kustomization gitops 未就绪
        description: k0s kubectl -n flux-system describe 对应对象；gitops 目录中出现不允许的对象会使整个同步失败。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 备份服务的 inactive 不算服务未运行，失败与过期单独告警
  interval: 1m
  input_series:
  - series: node_systemd_unit_state{job="ayatori-node",cluster="ayatori-prod",env="prod",name="ayatori-backup.service",state="active",type="oneshot"}
    values: 0x2500
  - series: node_systemd_unit_state{job="ayatori-node",cluster="ayatori-prod",env="prod",name="ayatori-backup.service",state="failed",type="oneshot"}
    values: 0x2500
  - series: up{job="ayatori-node",cluster="ayatori-prod",env="prod"}
    values: 1x2500
  - series: ayatori_backup_last_success_timestamp_seconds{job="ayatori-node",cluster="ayatori-prod",env="prod"}
    values: 0x2500
  alert_rule_test:
  - eval_time: 40h
    alertname: AyatoriServiceInactive
    exp_alerts: []
  - eval_time: 30h
    alertname: AyatoriBackupStale
    exp_alerts: []
  - eval_time: 40h
    alertname: AyatoriBackupStale
    exp_alerts:
    - exp_labels: {job: ayatori-node, cluster: ayatori-prod, env: prod, severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod 超过 36 小时没有成功备份
        description: 检查 ayatori-backup.timer 是否排程、最近一次运行结果。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: Database 冲突立即告警，不可用持续 30 分钟才告警
  interval: 1m
  input_series:
  - series: ayatori_resource_info{job="ayatori-kube-state-metrics",cluster="ayatori-prod",customresource_kind="PostgreSQLDatabase",name="a",resource_phase="Conflict",ready="False"}
    values: 1x40
  - series: ayatori_resource_info{job="ayatori-kube-state-metrics",cluster="ayatori-prod",customresource_kind="PostgreSQLDatabase",name="b",resource_phase="Unavailable",ready="False"}
    values: 1x40
  alert_rule_test:
  - eval_time: 3m
    alertname: AyatoriDatabaseConflict
    exp_alerts:
    - exp_labels: {job: ayatori-kube-state-metrics, cluster: ayatori-prod, customresource_kind: PostgreSQLDatabase, name: a, resource_phase: Conflict, ready: 'False', severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod Database a 冲突，需要人工处理
        description: controller 不会自动接管或扩大删除；按 Conditions 消息核对 PostgreSQL/OpenBao 中的对象。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
  - eval_time: 20m
    alertname: AyatoriDatabaseUnavailable
    exp_alerts: []
- name: 主机指标消失按环境告警
  interval: 1m
  input_series:
  - series: up{job="ayatori-node",cluster="ayatori-dev"}
    values: 1x20
  alert_rule_test:
  - eval_time: 15m
    alertname: AyatoriTargetAbsent
    exp_alerts:
    - exp_labels: {job: ayatori-node, cluster: ayatori-prod, env: prod, severity: critical}
      exp_annotations:
        summary: Ayatori ayatori-prod 主机指标缺失
        description: VMStaticScrape 中该目标消失或 vmagent 未加载；检查 platform/observability 的 ayatori 采集声明。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 证书 30 天内到期为 warning，7 天内为 critical
  interval: 1m
  input_series:
  - series: ayatori_certificate_not_after_timestamp_seconds{job="ayatori-node",cluster="ayatori-prod",source="kubeconfig",identity="ayatori-controller"}
    values: 1728000x200
  - series: ayatori_certificate_not_after_timestamp_seconds{job="ayatori-node",cluster="ayatori-prod",source="k0s-pki",path="/var/lib/k0s/pki/ca.crt"}
    values: 315360000x200
  alert_rule_test:
  - eval_time: 2h
    alertname: AyatoriCertificateExpiring
    exp_alerts:
    - exp_labels: {job: ayatori-node, cluster: ayatori-prod, source: kubeconfig, identity: ayatori-controller, severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod 证书 ayatori-controller 30 天内到期
        description: kubeconfig 客户端证书删除 /etc/ayatori-control-plane/<identity>/kubeconfig 后重跑部署即重签；k0s PKI 服务端证书重启 k0scontroller 轮换。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
  - eval_time: 2h
    alertname: AyatoriCertificateExpiringSoon
    exp_alerts: []

- name: 定时 oneshot 正常退出不按常驻服务告警
  interval: 1m
  input_series:
  - series: node_systemd_unit_state{job="ayatori-node",cluster="ayatori-prod",name="ayatori-cert-metrics.service",type="oneshot",state="active"}
    values: 0x10
  - series: node_systemd_unit_state{job="ayatori-node",cluster="ayatori-dev",name="ayatori-cert-metrics.service",type="oneshot",state="active"}
    values: 0x10
  alert_rule_test:
  - eval_time: 8m
    alertname: AyatoriServiceInactive
    exp_alerts: []
- name: 选主丢失按环境分级并保留 env 以便路由
  interval: 1m
  input_series:
  - series: leader_election_master_status{job="ayatori-manager",cluster="ayatori-prod",env="prod",instance="192.168.10.12:8080",name="a6325ed6.ddupan.top"}
    values: 0x10
  - series: leader_election_master_status{job="ayatori-manager",cluster="ayatori-dev",env="dev",instance="192.168.10.11:8080",name="a6325ed6.ddupan.top"}
    values: 1x10
  alert_rule_test:
  - eval_time: 6m
    alertname: AyatoriControllerNotLeader
    exp_alerts:
    - exp_labels: {cluster: ayatori-prod, env: prod, severity: critical}
      exp_annotations:
        summary: Ayatori ayatori-prod manager 没有持有选主 Lease
        description: 所有 controller 停止协调；查 journalctl -u ayatori-manager 中的 leader election 与 API 超时（宿主磁盘争用时常见）。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 1 小时内重启 3 次告警，2 次不告警
  interval: 10m
  input_series:
  - series: process_start_time_seconds{job="ayatori-manager",cluster="ayatori-prod",env="prod"}
    values: 100 700 1300 1900 1900 1900 1900
  - series: process_start_time_seconds{job="ayatori-external-secrets",cluster="ayatori-prod",env="prod"}
    values: 100 700 700 1900 1900 1900 1900
  alert_rule_test:
  - eval_time: 40m
    alertname: AyatoriProcessRestarting
    exp_alerts:
    - exp_labels: {job: ayatori-manager, cluster: ayatori-prod, env: prod, severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod ayatori-manager 1 小时内重启 3 次以上
        description: 反复退出后被 systemd 重启；查 journalctl 退出原因（选主丢失、OOM、配置错误）。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 备份告警只看 prod，dev 不备份
  interval: 1m
  input_series:
  - series: up{job="ayatori-node",cluster="ayatori-prod",env="prod",instance="192.168.10.12:9100"}
    values: 1x200
  - series: up{job="ayatori-node",cluster="ayatori-dev",env="dev",instance="192.168.10.11:9100"}
    values: 1x200
  alert_rule_test:
  - eval_time: 3h
    alertname: AyatoriBackupMetricMissing
    exp_alerts:
    - exp_labels: {job: ayatori-node, cluster: ayatori-prod, env: prod, instance: "192.168.10.12:9100", severity: warning}
      exp_annotations:
        summary: Ayatori ayatori-prod 没有备份成功记录
        description: 备份从未成功或 textfile 未写入；手动 systemctl start ayatori-backup.service 后核对。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: Agent 连不上 libvirt 时告警
  interval: 1m
  input_series:
  - series: ayatori_compute_agent_libvirt_up{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1"}
    values: 0x10
  alert_rule_test:
  - eval_time: 6m
    alertname: AyatoriComputeLibvirtDown
    exp_alerts:
    - exp_labels: {job: ayatori-compute-agent, cluster: ayatori-dev, env: dev, node: compute-dev1, severity: warning}
      exp_annotations:
        summary: 计算节点 compute-dev1 的 Agent 连不上 libvirt
        description: systemctl status libvirtd；连不上期间实例不会被收敛，节点的 compute Ready 也为 False。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 应当运行的实例没有节点在运行时告警，换节点或有意关机不告警
  interval: 1m
  input_series:
  # down：应当运行，没有节点在运行。
  - series: ayatori_compute_agent_domain_should_run{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="down"}
    values: 1x20
  - series: ayatori_compute_agent_domain_running{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="down"}
    values: 0x20
  # moved：旧节点上没运行，另一个节点在运行。
  - series: ayatori_compute_agent_domain_should_run{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="moved"}
    values: 1x20
  - series: ayatori_compute_agent_domain_running{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="moved"}
    values: 0x20
  - series: ayatori_compute_agent_domain_running{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev2",namespace="default",name="moved"}
    values: 1x20
  # off：客户机内关机，should_run 为 0。
  - series: ayatori_compute_agent_domain_should_run{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="off"}
    values: 0x20
  - series: ayatori_compute_agent_domain_running{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",namespace="default",name="off"}
    values: 0x20
  alert_rule_test:
  - eval_time: 11m
    alertname: AyatoriComputeInstanceDown
    exp_alerts:
    - exp_labels: {cluster: ayatori-dev, env: dev, namespace: default, name: down, severity: warning}
      exp_annotations:
        summary: 实例 default/down 应当运行，但没有节点在运行它
        description: 查 LibvirtDomain 的 status.message 与节点上的 virsh domstate --reason。客户机内关机或 destroy 不会触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 对象长时间没有收敛成功时告警，从未成功同样告警，持续成功不告警
  interval: 1m
  input_series:
  - series: ayatori_compute_agent_object_last_success_timestamp_seconds{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",kind="LibvirtDomain",namespace="default",name="never"}
    values: 0x40
  - series: ayatori_compute_agent_object_last_success_timestamp_seconds{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",kind="LibvirtDomain",namespace="default",name="healthy"}
    values: 0+60x40
  alert_rule_test:
  - eval_time: 36m
    alertname: AyatoriComputeObjectNotConverging
    exp_alerts:
    - exp_labels: {job: ayatori-compute-agent, cluster: ayatori-dev, env: dev, node: compute-dev1, kind: LibvirtDomain, namespace: default, name: never, severity: warning}
      exp_annotations:
        summary: LibvirtDomain never 在 compute-dev1 上 30 分钟没有收敛成功
        description: 从未成功时同样触发。查对象 status 中的 message 与 journalctl -u ayatori-compute-agent。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: 存储池使用超过 90% 时告警
  interval: 1m
  input_series:
  - series: ayatori_compute_agent_pool_bytes{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",name="full",type="capacity"}
    values: 100x40
  - series: ayatori_compute_agent_pool_bytes{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",name="full",type="available"}
    values: 5x40
  - series: ayatori_compute_agent_pool_bytes{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",name="ok",type="capacity"}
    values: 100x40
  - series: ayatori_compute_agent_pool_bytes{job="ayatori-compute-agent",cluster="ayatori-dev",env="dev",node="compute-dev1",name="ok",type="available"}
    values: 50x40
  alert_rule_test:
  - eval_time: 31m
    alertname: AyatoriComputePoolAlmostFull
    exp_alerts:
    - exp_labels: {job: ayatori-compute-agent, cluster: ayatori-dev, env: dev, node: compute-dev1, name: full, severity: warning}
      exp_annotations:
        summary: 计算节点 compute-dev1 的存储池 full 使用超过 90%
        description: 清理不用的卷与镜像，或扩容底层存储。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/services/ayatori.md#出问题时
- name: pg-prod LB 入口没有 primary 时告警，有一个时安静
  interval: 30s
  input_series:
  - series: ayatori_loadbalancer_port_ready_endpoints{job="ayatori-kube-state-metrics",cluster="ayatori-prod",resource_namespace="shared-postgresql",name="pg-prod",port="5432"}
    values: 1x4 0x6
  alert_rule_test:
  - eval_time: 1m
    alertname: PgProdLbNoPrimary
    exp_alerts: []
  - eval_time: 4m
    alertname: PgProdLbNoPrimary
    exp_alerts:
    - exp_labels: {job: ayatori-kube-state-metrics, cluster: ayatori-prod, resource_namespace: shared-postgresql, name: pg-prod, port: "5432", severity: critical, service: shared-postgresql}
      exp_annotations:
        summary: pg-prod LB 入口端口 5432 没有可用的 primary
        description: 所有成员的 Patroni /primary 都不是 200：故障切换进行中，或集群失去 leader。patronictl list；同时看 SharedPostgres* 告警。
- name: pg-prod LB 同一主机上两个成员 UP 告警，各主机一个 UP 时安静
  interval: 30s
  input_series:
  - series: ayatori_loadbalancer_endpoint_status{job="ayatori-kube-state-metrics",cluster="ayatori-prod",resource_namespace="shared-postgresql",name="pg-prod",port="5432",host="lb-prod-1",endpoint="192.168.10.127",state="UP"}
    values: 1x10
  - series: ayatori_loadbalancer_endpoint_status{job="ayatori-kube-state-metrics",cluster="ayatori-prod",resource_namespace="shared-postgresql",name="pg-prod",port="5432",host="lb-prod-2",endpoint="192.168.10.127",state="UP"}
    values: 1x10
  - series: ayatori_loadbalancer_endpoint_status{job="ayatori-kube-state-metrics",cluster="ayatori-prod",resource_namespace="shared-postgresql",name="pg-prod",port="5432",host="lb-prod-1",endpoint="10.60.0.20",state="DOWN"}
    values: 1x4 _x6
  - series: ayatori_loadbalancer_endpoint_status{job="ayatori-kube-state-metrics",cluster="ayatori-prod",resource_namespace="shared-postgresql",name="pg-prod",port="5432",host="lb-prod-1",endpoint="10.60.0.20",state="UP"}
    values: _x4 1x6
  alert_rule_test:
  - eval_time: 1m
    alertname: PgProdLbMultiplePrimaries
    exp_alerts: []
  - eval_time: 4m
    alertname: PgProdLbMultiplePrimaries
    exp_alerts:
    - exp_labels: {host: lb-prod-1, port: "5432", severity: critical, service: shared-postgresql}
      exp_annotations:
        summary: pg-prod LB 主机 lb-prod-1 端口 5432 同时把流量送给 2 个 primary
        description: 疑似脑裂，写入可能分叉。立即 patronictl list，必要时停掉入口止血。
