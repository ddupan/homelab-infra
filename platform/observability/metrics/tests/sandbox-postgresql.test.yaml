rule_files:
- rules.yaml
evaluation_interval: 30s
tests:
- name: 没有 primary 时告警，正常 leader 加同步 standby 时安静
  interval: 30s
  input_series:
  - series: patroni_primary{job="sandbox-postgresql-patroni",instance="10.60.0.11:8008",cluster="pg-sandbox",member="sandbox1"}
    values: 1x4 0x6
  - series: patroni_primary{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 0x10
  - series: patroni_sync_standby{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 1x10
  alert_rule_test:
  - eval_time: 1m
    alertname: SandboxPostgresNoPrimary
    exp_alerts: []
  - eval_time: 5m
    alertname: SandboxPostgresNoPrimary
    exp_alerts:
    - exp_labels: {severity: critical, service: sandbox-postgresql}
      exp_annotations:
        summary: sandbox PG 没有 primary，sandbox K3s 无法写入
        description: patronictl -c /etc/patroni/patroni.yml list；两个成员都在而无 leader 时检查共享 etcd （SharedEtcd* 告警）与同步状态（/sync 未登记 standby 时不会提升）。
  - eval_time: 5m
    alertname: SandboxPostgresNoSyncStandby
    exp_alerts: []
- name: 双主
  interval: 30s
  input_series:
  - series: patroni_primary{job="sandbox-postgresql-patroni",instance="10.60.0.11:8008",cluster="pg-sandbox",member="sandbox1"}
    values: 1x4
  - series: patroni_primary{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 1x4
  alert_rule_test:
  - eval_time: 1m
    alertname: SandboxPostgresMultiplePrimaries
    exp_alerts:
    - exp_labels: {severity: critical, service: sandbox-postgresql}
      exp_annotations:
        summary: sandbox PG 观察到 2 个 primary
        description: 疑似脑裂，K3s 写入可能分叉。立即 patronictl list，核对 VyOS sandbox-postgresql 后端。
- name: 同步 standby 消失 10 分钟
  interval: 1m
  input_series:
  - series: patroni_sync_standby{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 1 1 0x12
  alert_rule_test:
  - eval_time: 9m
    alertname: SandboxPostgresNoSyncStandby
    exp_alerts: []
  - eval_time: 13m
    alertname: SandboxPostgresNoSyncStandby
    exp_alerts:
    - exp_labels: {severity: warning, service: sandbox-postgresql}
      exp_annotations:
        summary: sandbox PG 没有同步 standby，已降为异步或单节点
        description: 此时故障切换可能丢最近的写入，或根本无法切换。patronictl list 查看另一成员状态。
- name: 切换后新 leader 告警，10 分钟后恢复
  interval: 1m
  input_series:
  - series: patroni_postgres_timeline{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 3x2 4x20
  - series: patroni_primary{job="sandbox-postgresql-patroni",instance="10.60.0.12:8008",cluster="pg-sandbox",member="sandbox2"}
    values: 0x2 1x20
  alert_rule_test:
  - eval_time: 1m
    alertname: SandboxPostgresLeaderChanged
    exp_alerts: []
  - eval_time: 5m
    alertname: SandboxPostgresLeaderChanged
    exp_alerts:
    - exp_labels: {job: sandbox-postgresql-patroni, instance: '10.60.0.12:8008', cluster: pg-sandbox, member: sandbox2, severity: warning, service: sandbox-postgresql}
      exp_annotations:
        summary: sandbox PG 发生切换，新 leader 为 sandbox2
        description: 计划内 switchover 可忽略；否则查看旧 leader 的 journalctl -u patroni 与节点状态。
  - eval_time: 15m
    alertname: SandboxPostgresLeaderChanged
    exp_alerts: []
- name: 连不上 etcd 进入 failsafe
  interval: 30s
  input_series:
  - series: patroni_failsafe_mode_is_active{job="sandbox-postgresql-patroni",instance="10.60.0.11:8008",cluster="pg-sandbox",member="sandbox1"}
    values: 0 1x4
  alert_rule_test:
  - eval_time: 2m
    alertname: SandboxPostgresFailsafeActive
    exp_alerts:
    - exp_labels: {job: sandbox-postgresql-patroni, instance: '10.60.0.11:8008', cluster: pg-sandbox, member: sandbox1, severity: warning, service: sandbox-postgresql}
      exp_annotations:
        summary: sandbox PG sandbox1 进入 failsafe：连不上共享 etcd
        description: leader 仍可写，但不会自动切换。检查 SharedEtcd* 告警与 /etc/patroni/etcd.crt 是否过期。
