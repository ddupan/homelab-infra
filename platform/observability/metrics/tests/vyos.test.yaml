rule_files:
- rules.yaml
evaluation_interval: 30s
tests:
- name: pg-prod 没有 primary
  interval: 30s
  input_series:
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="laptop",state="UP"}
    values: '0x6'
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="pve1",state="UP"}
    values: '0x6'
  alert_rule_test:
  - eval_time: 2m
    alertname: PgProdNoPrimary
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: pg-prod 入口没有可用的 primary
        description: 所有成员的 Patroni /primary 都不是 200：故障切换进行中，或集群失去 leader。 patronictl list；同时看 SharedPostgres* 告警。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
  - eval_time: 2m
    alertname: PgProdMultiplePrimaries
    exp_alerts: []
- name: pg-prod 双主
  interval: 30s
  input_series:
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="laptop",state="UP"}
    values: 1x6
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="pve1",state="UP"}
    values: 1x6
  alert_rule_test:
  - eval_time: 1m
    alertname: PgProdMultiplePrimaries
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: pg-prod 入口同时把流量送给 2 个 primary
        description: 疑似脑裂，写入可能分叉。立即 patronictl list，必要时停掉 HAProxy 入口止血。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
- name: pg-prod 正常（一主一从）不告警
  interval: 30s
  input_series:
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="laptop",state="UP"}
    values: 1x6
  - series: haproxy_server_status{job="pg-proxy-haproxy",instance="192.168.10.2:8405",node="vyos-rtr",proxy="pg-prod",server="pve1",state="UP"}
    values: '0x6'
  alert_rule_test:
  - eval_time: 2m
    alertname: PgProdNoPrimary
    exp_alerts: []
  - eval_time: 2m
    alertname: PgProdMultiplePrimaries
    exp_alerts: []
- name: OSPF 邻接全部丢失
  interval: 1m
  input_series:
  - series: frr_ospf_neighbor_adjacencies{job="frr",instance="192.168.10.2:9342",node="vyos-rtr",area="0.0.0.0",iface="eth0",vrf="default"}
    values: 2 0x4
  - series: frr_ospf_neighbors{job="frr",instance="192.168.10.2:9342",node="vyos-rtr",area="0.0.0.0",iface="eth0",vrf="default"}
    values: 2 1x4
  alert_rule_test:
  - eval_time: 4m
    alertname: VyosOspfNoAdjacency
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: VyOS 在 eth0 上没有任何 OSPF 邻接
        description: labnet / retronet 路由不再通告给 LAN。show ip ospf neighbor；NEC IX（192.168.10.1） 侧的 OSPF 配置；vyos.yml 的部署后断言也会检查这一点。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
- name: 关键服务 2 分钟即 critical，次要服务 5 分钟 warning
  interval: 1m
  input_series:
  - series: vyos_unit_active{job="node-exporter",instance="192.168.10.2:9100",node="vyos-rtr",unit="isc-kea-dhcp4-server.service"}
    values: '0x6'
  - series: vyos_unit_active{job="node-exporter",instance="192.168.10.2:9100",node="vyos-rtr",unit="radvd.service"}
    values: '0x6'
  - series: vyos_unit_active{job="node-exporter",instance="192.168.10.2:9100",node="vyos-rtr",unit="frr.service"}
    values: 1x6
  alert_rule_test:
  - eval_time: 3m
    alertname: VyosCriticalServiceDown
    exp_alerts:
    - exp_labels:
        job: node-exporter
        instance: 192.168.10.2:9100
        node: vyos-rtr
        unit: isc-kea-dhcp4-server.service
        severity: critical
      exp_annotations:
        summary: VyOS 上 isc-kea-dhcp4-server.service 未运行
        description: frr = OSPF/BGP；haproxy = sandbox k3s API 与 sandbox PG；homelab-pg-proxy = 生产 pg-prod； kea = labnet/retronet DHCP。systemctl status；VyOS CLI 管理的服务改动后先 commit 再查。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
  - eval_time: 3m
    alertname: VyosServiceDown
    exp_alerts: []
  - eval_time: 6m
    alertname: VyosServiceDown
    exp_alerts:
    - exp_labels:
        job: node-exporter
        instance: 192.168.10.2:9100
        node: vyos-rtr
        unit: radvd.service
        severity: warning
      exp_annotations:
        summary: VyOS 上 radvd.service 未运行
        description: pdns-recursor = DN42 DNS；radvd = ULA RA；chrony = 私网 NTP；另两个是本监控自己的 exporter。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
- name: BGP 会话断开
  interval: 1m
  input_series:
  - series: frr_bgp_peer_state{job="frr",instance="192.168.10.2:9342",node="vyos-rtr",afi="ipv4",local_as="4242421811",peer="fe80::1811:2",peer_as="4242421811",safi="unicast",vrf="default"}
    values: '0x7'
  alert_rule_test:
  - eval_time: 6m
    alertname: VyosBgpPeerDown
    exp_alerts:
    - exp_labels:
        job: frr
        instance: 192.168.10.2:9342
        node: vyos-rtr
        afi: ipv4
        local_as: '4242421811'
        peer: fe80::1811:2
        peer_as: '4242421811'
        safi: unicast
        vrf: default
        severity: warning
      exp_annotations:
        summary: VyOS BGP 会话 fe80::1811:2（AS4242421811，ipv4）未建立
        description: 与 oci-amd 的 DN42 iBGP 经 wg42 隧道。会话断开即 DN42 不可达；先看 wg show wg42 的 latest handshake，再看 oci-amd 侧 FRR（infrastructure/oci/ansible）。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
