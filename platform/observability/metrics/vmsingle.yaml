# Single-node metrics TSDB. Replaces the Compose `victoriametrics` service.
# Service exposed by the operator: vmsingle-main.monitoring.svc:8428
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: main
  namespace: monitoring
spec:
  retentionPeriod: "6"          # months
  removePvcAfterDelete: false   # keep data if the CR is deleted
  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: localpv-zfs-ceph   # OpenEBS ZFS (data/ceph pool)
    resources:
      requests:
        storage: 50Gi
  extraArgs:
    dedup.minScrapeInterval: 30s
    # Default 5s fsyncs in-memory data every 5s. Everything shares one consumer
    # SATA SSD (ZFS pool data); at peak these fsync storms pushed OpenBao's Raft
    # writes past CI's 15s login timeout (2026-10-09). 1m cuts the fsyncs ~12x.
    # Cost: an unclean shutdown (power loss, OOM, SIGKILL) loses up to 1m of
    # data; a normal shutdown still flushes everything.
    inmemoryDataFlushInterval: 1m
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
