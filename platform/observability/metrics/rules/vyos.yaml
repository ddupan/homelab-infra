apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vyos
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics
spec:
  groups:
  # vyos-rtr（192.168.10.2，PVE HA 资源 vm:100）。整机不可达由 NodeExporterUnavailable 覆盖，
  # HA 状态由 PveHaResourceNotStarted 覆盖。下面是它承载的各项职责。
  - name: vyos
    interval: 30s
    rules:
    # OSPF 是 LAN 到 labnet/retronet 的唯一路由来源：没有邻接，SDN 上所有客户机从 LAN 不可达。
    - alert: VyosOspfNoAdjacency
      expr: max(frr_ospf_neighbor_adjacencies{job="frr",iface="eth0"}) == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: VyOS 在 eth0 上没有任何 OSPF 邻接
        description: >-
          labnet / retronet 路由不再通告给 LAN。show ip ospf neighbor；NEC IX（192.168.10.1）
          侧的 OSPF 配置；vyos.yml 的部署后断言也会检查这一点。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosOspfNeighborNotFull
      expr: frr_ospf_neighbor_adjacencies{job="frr"} < frr_ospf_neighbors{job="frr"}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VyOS {{ $labels.iface }} 上有 OSPF 邻居未达到 Full
        description: 邻居发现了但邻接没建起来，常见于 MTU / hello 参数不一致。show ip ospf neighbor。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # wg42 是 WireGuard，operstate 恒为 unknown，node_network_up 恒为 0——用其上的 BGP 判断隧道。
    - alert: VyosBgpPeerDown
      expr: frr_bgp_peer_state{job="frr"} != 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VyOS BGP 会话 {{ $labels.peer }}（AS{{ $labels.peer_as }}，{{ $labels.afi }}）未建立
        description: >-
          与 oci-amd 的 DN42 iBGP 经 wg42 隧道。会话断开即 DN42 不可达；先看 wg show wg42 的
          latest handshake，再看 oci-amd 侧 FRR（infrastructure/oci/ansible）。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosInterfaceDown
      expr: node_network_up{job="node-exporter",node="vyos-rtr",device=~"eth[0-2]"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: VyOS 接口 {{ $labels.device }} 断开
        description: eth0 = LAN，eth1 = labnet 网关，eth2 = retronet 网关。检查 PVE 上 vm:100 的网卡与 SDN VNet。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # 这几个服务停了，影响面是整个网段或生产数据库，没有其他信号会报出来。
    - alert: VyosCriticalServiceDown
      expr: vyos_unit_active{job="node-exporter",unit=~"frr.service|homelab-pg-proxy.service|isc-kea-dhcp4-server.service"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: VyOS 上 {{ $labels.unit }} 未运行
        description: >-
          frr = OSPF/BGP；homelab-pg-proxy = 生产 pg-prod；
          kea = labnet/retronet DHCP。systemctl status；VyOS CLI 管理的服务改动后先 commit 再查。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosServiceDown
      expr: vyos_unit_active{job="node-exporter",unit=~"pdns-recursor.service|radvd.service|chrony.service|node_exporter.service|frr_exporter.service"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VyOS 上 {{ $labels.unit }} 未运行
        description: pdns-recursor = DN42 DNS；radvd = ULA RA；chrony = 私网 NTP；另两个是本监控自己的 exporter。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosUnitMetricsStale
      expr: time() - node_textfile_mtime_seconds{job="node-exporter",node="vyos-rtr",file=~".*vyos_units.prom"} > 180
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VyOS 服务状态指标超过 3 分钟没有刷新
        description: >-
          vyos-unit-metrics.timer 停了，上面两条服务告警失效。镜像升级后由 postconfig hook 恢复；
          没恢复就重跑 infrastructure/proxmox/ansible/vyos-monitoring.yml。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # pg-prod 只把流量送给 /primary 返回 200 的成员。0 个 = 写入全部失败；2 个 = 双主，最危险。
    - alert: PgProdNoPrimary
      expr: sum(haproxy_server_status{job="pg-proxy-haproxy",proxy="pg-prod",state="UP"}) == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: pg-prod 入口没有可用的 primary
        description: >-
          所有成员的 Patroni /primary 都不是 200：故障切换进行中，或集群失去 leader。
          patronictl list；同时看 SharedPostgres* 告警。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: PgProdMultiplePrimaries
      expr: sum(haproxy_server_status{job="pg-proxy-haproxy",proxy="pg-prod",state="UP"}) > 1
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: pg-prod 入口同时把流量送给 {{ $value }} 个 primary
        description: 疑似脑裂，写入可能分叉。立即 patronictl list，必要时停掉 HAProxy 入口止血。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosEntrypointDown
      expr: probe_success{probe_group="vyos"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: VyOS 入口 {{ $labels.instance }} 不可达
        description: >-
          192.168.10.2:5432 = pg-prod（homelab-pg-proxy）。进程在跑而端口不通，多半是监听地址丢了。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: Dn42DnsFailing
      expr: probe_success{probe_group="dn42"} == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 经 VyOS 解析 DN42 失败
        description: pdns-recursor → wg42 → DN42 delegation server。BGP 正常而解析失败时看 pdns-recursor；都失败先看 VyosBgpPeerDown。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: VyosExporterScrapeFailing
      expr: up{job=~"frr|pg-proxy-haproxy"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: VyOS 上的 {{ $labels.job }} 指标抓取失败
        description: frr 失败则 OSPF/BGP 告警失效；pg-proxy-haproxy 失败则 pg-prod 主库告警失效。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
