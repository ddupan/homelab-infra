apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: data-services
  namespace: monitoring
spec:
  groups:
  - name: data-services
    interval: 30s
    rules:
    - alert: DataServiceMetricsUnavailable
      expr: up{job="seaweedfs-master"} == 0 or absent(up{job="seaweedfs-master"})
      for: 5m
      labels:
        severity: critical
        job: seaweedfs-master
      annotations:
        summary: 数据服务 {{ $labels.job }} 指标不可用
        description: 检查监控对象、Pod 与 exporter；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    - alert: DataServiceMetricsUnavailable
      expr: up{job="seaweedfs-volume"} == 0 or absent(up{job="seaweedfs-volume"})
      for: 5m
      labels:
        severity: critical
        job: seaweedfs-volume
      annotations:
        summary: 数据服务 {{ $labels.job }} 指标不可用
        description: 检查监控对象、Pod 与 exporter；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    - alert: DataServiceMetricsUnavailable
      expr: up{job="seaweedfs-filer"} == 0 or absent(up{job="seaweedfs-filer"})
      for: 5m
      labels:
        severity: critical
        job: seaweedfs-filer
      annotations:
        summary: 数据服务 {{ $labels.job }} 指标不可用
        description: 检查监控对象、Pod 与 exporter；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    - alert: SeaweedVolumeDiskLow
      expr: SeaweedFS_volumeServer_resource{job="seaweedfs-volume",type="avail"} / ignoring(type) SeaweedFS_volumeServer_resource{job="seaweedfs-volume",type="all"} < 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: SeaweedFS {{ $labels.name }} 可用空间不足 10%
        description: 检查 volume 文件系统容量、保留策略与底层 ZFS；不要直接删除卷文件。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    - alert: SeaweedVolumeDiskReadOnly
      expr: SeaweedFS_volumeServer_read_only_volumes{job="seaweedfs-volume",type="isDiskSpaceLow"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: SeaweedFS 因磁盘空间不足限制卷写入
        description: 检查磁盘容量和 volume 日志；主动只读或满卷切换不按此故障处理。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    - alert: SeaweedVolumeWriteFailures
      expr: increase(SeaweedFS_volumeServer_file_write_failures{job="seaweedfs-volume"}[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: SeaweedFS 卷写入失败
        description: 检查 volume 日志、磁盘状态及上游请求；不代表已经验证 S3 端到端可用。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-data-services.md
    # CronJob 每小时一次。absent 兜住从未成功过的情况：那时 last_successful_time 不存在。
    - alert: TfstateBackupStale
      expr: |
        time() - max by (cluster,namespace,cronjob) (kube_cronjob_status_last_successful_time{job="kube-state-metrics",namespace="seaweedfs",cronjob="tfstate-backup"}) > 21600
        or absent(kube_cronjob_status_last_successful_time{job="kube-state-metrics",namespace="seaweedfs",cronjob="tfstate-backup"})
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: tfstate 异地备份超过 6 小时没有成功
        description: 检查 seaweedfs 命名空间 tfstate-backup Job 的日志和 ExternalSecret；SeaweedFS 丢失时只能靠这份备份恢复。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-infra/src/branch/main/apps/seaweedfs/README.md
