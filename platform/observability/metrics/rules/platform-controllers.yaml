apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-controllers
  namespace: monitoring
spec:
  groups:
  - name: platform-controllers
    interval: 30s
    rules:
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="cert-manager"} == 0 or absent(up{job="cert-manager"})
      for: 5m
      labels:
        severity: warning
        job: cert-manager
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="external-secrets"} == 0 or absent(up{job="external-secrets"})
      for: 5m
      labels:
        severity: warning
        job: external-secrets
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="external-secrets-cert-controller"} == 0 or absent(up{job="external-secrets-cert-controller"})
      for: 5m
      labels:
        severity: warning
        job: external-secrets-cert-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="external-secrets-webhook"} == 0 or absent(up{job="external-secrets-webhook"})
      for: 5m
      labels:
        severity: warning
        job: external-secrets-webhook
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="helm-controller"} == 0 or absent(up{job="helm-controller"})
      for: 5m
      labels:
        severity: warning
        job: helm-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="kustomize-controller"} == 0 or absent(up{job="kustomize-controller"})
      for: 5m
      labels:
        severity: warning
        job: kustomize-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="source-controller"} == 0 or absent(up{job="source-controller"})
      for: 5m
      labels:
        severity: warning
        job: source-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="notification-controller"} == 0 or absent(up{job="notification-controller"})
      for: 5m
      labels:
        severity: warning
        job: notification-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    # platform/spire/oci-instance-roots.pem 里最早到期的根（ap-osaka-1 Instance Identity Root）。
    # 它是静态文件，没有指标可抓，所以把 notAfter 写死在这里：轮换 PEM 时同步改这个时间戳。
    # 根过期后 oci_instance 证明全部失败，OCI 上的 agent 拿不到 SVID（Renovate 等随之停摆）。
    # 提前 90 天：轮换需要一个已认证的 OCI 主体去取新根（platform/spire/README.md）。
    - alert: OciInstanceRootCaExpiring
      expr: vector(1875208837) - time() < 90 * 86400
      labels:
        severity: warning
      annotations:
        summary: OCI 实例身份根证书 {{ $value | humanizeDuration }} 后到期
        description: >-
          按 platform/spire/README.md「根证书轮换」取新根替换 oci-instance-roots.pem，
          并把本规则里的到期时间戳改成新 PEM 中最早的 notAfter。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-infra/src/branch/main/platform/spire/README.md
    - alert: CertificateNotReady
      expr: certmanager_certificate_ready_status{job="cert-manager",condition="True"}
        == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 证书 {{ $labels.namespace }}/{{ $labels.name }} 未就绪
        description: 检查 Certificate、CertificateRequest、Issuer、Order 与 Challenge；允许短暂签发过程。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: CertificateExpiringSoon
      expr: (certmanager_certificate_expiration_timestamp_seconds{job="cert-manager"}
        - time() < 7 * 86400) and (certmanager_certificate_expiration_timestamp_seconds{job="cert-manager"}
        - time() >= 86400)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 证书 {{ $labels.namespace }}/{{ $labels.name }} 将在七天内到期
        description: 检查自动续期链路及实际入口证书；一天内到期由 critical 规则接替。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: CertificateExpiryCritical
      expr: certmanager_certificate_expiration_timestamp_seconds{job="cert-manager"}
        - time() < 86400
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: 证书 {{ $labels.namespace }}/{{ $labels.name }} 即将到期或已过期
        description: 不足一天或已经过期；立即检查续期与入口证书。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: ExternalSecretNotReady
      expr: externalsecret_status_condition{job="external-secrets",condition="Ready",status="True"}
        == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Secret 同步 {{ $labels.namespace }}/{{ $labels.name }} 未就绪
        description: 检查 ExternalSecret 状态及 provider 权限、网络；不要输出 Secret 内容。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: ClusterSecretStoreNotReady
      expr: clustersecretstore_status_condition{job="external-secrets",condition="Ready",status="True"}
        == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: ClusterSecretStore {{ $labels.name }} 未就绪
        description: 检查 OpenBao 可达性与 ESO 身份鉴权；可能影响多个命名空间。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    # homelab 与 sandbox（vmagent-sandbox 写入，带 cluster="sandbox"）共用这条；Ayatori 集群的 Flux
    # 由 ayatori.yaml 按 job="ayatori-kube-state-metrics" 覆盖。
    - alert: FluxResourceNotReady
      expr: gotk_resource_info{job="kube-state-metrics",ready!="True",suspended!="true",repository_type!="oci"}
        == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Flux {{ with $labels.cluster }}[{{ . }}] {{ end }}{{ $labels.customresource_kind
          }} {{ $labels.resource_namespace }}/{{ $labels.name }} 未就绪
        description: 检查对象 conditions、依赖和 controller 日志；主动 suspend 不触发，不自动解除暂停。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    # 按集群分别判缺失：absent() 不分集群，一个集群有数据就会掩盖另一个集群的缺失。homelab 的
    # kube-state-metrics 由本地 vmagent 抓取，没有 cluster 标签（cluster="" 即标签不存在）。
    - alert: FluxStateMetricsMissing
      expr: absent(gotk_resource_info{job="kube-state-metrics",cluster="",customresource_kind="Kustomization",resource_namespace="flux-system",name="flux-system"})
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Flux 对象状态指标缺失
        description: 检查 kube-state-metrics 自定义资源配置、RBAC 与采集；不能把空结果当作健康。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: FluxStateMetricsMissing
      expr: absent(gotk_resource_info{job="kube-state-metrics",cluster="sandbox",customresource_kind="Kustomization",resource_namespace="flux-system",name="flux-system"})
      for: 5m
      labels:
        severity: warning
        cluster: sandbox
      annotations:
        summary: Flux [sandbox] 对象状态指标缺失
        description: 检查 sandbox 的 kube-state-metrics 自定义资源配置（platform/sandbox-monitoring/workloads）、vmagent-sandbox
          的 remote write；不能把空结果当作健康。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    # OpenSandbox controller（sandbox 集群，platform/sandbox-opensandbox/monitor-scrape.yaml）。只有
    # controller-runtime 标准指标；server 与 egress sidecar 的 OTLP 指标待升级 1.x 时接入。
    - alert: PlatformControllerMetricsUnavailable
      expr: up{job="monitoring/opensandbox-controller"} == 0 or absent(up{job="monitoring/opensandbox-controller"})
      for: 5m
      labels:
        severity: warning
        job: monitoring/opensandbox-controller
      annotations:
        summary: 控制器 {{ $labels.job }} 指标不可用
        description: 检查对应 Pod、监控 CR 转换与 targets；目标消失同样触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: OpenSandboxReconcileErrors
      expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total{job="monitoring/opensandbox-controller"}[15m]))
        > 0
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: OpenSandbox controller {{ $labels.controller }} 持续 reconcile 出错
        description: 连续 30 分钟有 reconcile 错误：查 opensandbox-system 的 controller 日志与对应 BatchSandbox/Pool 状态；沙箱创建（CI vm 池、升级评审）可能失败。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
    - alert: OpenSandboxReconcilePanics
      expr: sum by (controller) (increase(controller_runtime_reconcile_panics_total{job="monitoring/opensandbox-controller"}[10m]))
        > 0
      labels:
        severity: warning
      annotations:
        summary: OpenSandbox controller {{ $labels.controller }} 发生 panic
        description: reconcile panic 意味着 controller 代码缺陷或遇到异常对象；查 controller 日志中的堆栈。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-controllers.md
