apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: host-health
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics
spec:
  groups:
  - name: host-health
    interval: 30s
    rules:
    - alert: HostMemoryLow
      expr: (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
        < 0.10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} 可用内存不足 10%
        description: 检查主机内存、Swap、进程 PSS；仅使用 node-exporter job，避免重复采集统计。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostFilesystemSpaceLow
      expr: (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        < 0.10) and on(instance,device,mountpoint) (node_filesystem_readonly{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        == 0)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} {{ $labels.mountpoint }} 可用空间不足 10%
        description: 检查文件系统和 ZFS dataset 容量，清理前确认数据归属。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostFilesystemInodesLow
      expr: (node_filesystem_files_free{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        / node_filesystem_files{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        < 0.10) and on(instance,device,mountpoint) (node_filesystem_files{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        > 0) and on(instance,device,mountpoint) (node_filesystem_readonly{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        == 0)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} {{ $labels.mountpoint }} inode 不足 10%
        description: 检查小文件数量，确认 filesystem 是否耗尽 inode。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostFilesystemReadOnly
      expr: node_filesystem_readonly{job="node-exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/run(/.*)?|/var/lib/kubelet/.*|/var/lib/docker/.*"}
        == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: 主机 {{ $labels.instance }} {{ $labels.mountpoint }} 变为只读
        description: 排查磁盘和文件系统错误；不要直接强制重新挂载。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostZpoolUnhealthy
      expr: node_zfs_zpool_state{job="node-exporter",state!="online"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: 主机 {{ $labels.instance }} ZFS 池 {{ $labels.zpool }} 状态 {{ $labels.state }}
        description: 检查 zpool status、磁盘和冗余；零值状态不触发。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # 笔记本是整个 lab 的单点（k3s/NFS/libvirt/ingress），而它在用电池兜底：AC 掉了
    # 只剩电池续航的时间，必须立刻知道。只看 AC，USB-C 口的 online=0 是常态。
    - alert: HostOnBattery
      expr: node_power_supply_online{job="node-exporter",power_supply="AC"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: 主机 {{ $labels.instance }} 已断开交流电，正在用电池运行
        description: 检查电源适配器和插座；电池耗尽时整个 lab（k3s、NFS、libvirt 上的 DC/bao）一起掉线。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostBatteryLow
      expr: node_power_supply_capacity{job="node-exporter",power_supply=~"BAT.*"} < 30
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: 主机 {{ $labels.instance }} 电池电量 {{ $value }}%
        description: 恢复供电，或在电量耗尽前有序关停 guest，避免 ZFS/数据库非正常断电。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # unit 状态由 DaemonSet 的 systemd collector 经宿主 D-Bus 读取。注意它抓不到
    # "active 但实际已坏"的情况（例如 openvpn-client@naist 的 tun0 黑洞），那类要靠探测。
    - alert: HostSystemdUnitFailed
      expr: node_systemd_unit_state{job="node-exporter",state="failed"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} systemd unit {{ $labels.name }} 处于 failed
        description: systemctl status / journalctl -u 查看原因；确认无用的 unit 用 systemctl reset-failed 清除。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # 这台笔记本的 CPU 常年贴着 TjMax 跑（7 天 p90=97°C，阈值 100°C），所以用"达到传感器
    # 自报的 crit 并持续 10 分钟"作为阈值：低于此值会一直在响，等于没有告警。
    - alert: HostTemperatureCritical
      expr: node_hwmon_temp_celsius{job="node-exporter"}
        >= on(job,instance,chip,sensor) node_hwmon_temp_crit_celsius{job="node-exporter"}
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} {{ $labels.chip }}/{{ $labels.sensor }} 持续达到临界温度 {{ $value }}°C
        description: 检查散热（风扇、积灰、通风）和当前负载；持续过热会降频并拖慢所有服务。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # 用 PSI 而不是 load/swap：load 混入 D 状态进程，swap 平时就用掉一半以上（7 天中位数
    # 66%），都不能区分"忙"和"卡住"。阈值按 7 天回放选定：0.3/10m 只命中 2 次，包括
    # 2026-10-04 CI 构建把 VMSingle 拖到查询超时那次（当时只有副作用 AlertingRulesError 响了）。
    - alert: HostIoPressureHigh
      expr: rate(node_pressure_io_waiting_seconds_total{job="node-exporter"}[5m]) > 0.3
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} IO 压力过高（{{ $value | humanizePercentage }} 时间有任务在等 IO）
        description: 找出写盘大户（iotop、CI 构建 Pod、VM 磁盘）；同主机上的 VMSingle 查询会随之超时。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostMemoryPressureHigh
      expr: rate(node_pressure_memory_stalled_seconds_total{job="node-exporter"}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} 内存压力过高（{{ $value | humanizePercentage }} 时间全部任务卡在内存回收上）
        description: 内存与 swap 都快耗尽，OOM 随时可能发生；查看进程 PSS 看板，优先停掉 CI 构建等可推迟负载。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    # Kerberos 容忍 5 分钟时钟偏差，dc1 失步会让全域认证失败；其他主机失步会让 TLS、
    # TOTP、日志关联出错。只看 job=node-exporter，避免 docker-hosts 重复采集。
    - alert: HostClockNotSynchronising
      expr: node_timex_sync_status{job="node-exporter"} == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} 时钟未同步
        description: 检查 chrony / systemd-timesyncd（chronyc tracking、timedatectl）。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
    - alert: HostClockSkew
      expr: abs(node_timex_offset_seconds{job="node-exporter"}) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 主机 {{ $labels.instance }} 时钟偏差 {{ $value | humanizeDuration }}
        description: 偏差接近 5 分钟时 Kerberos 认证开始失败；先查 NTP 源是否可达。
        runbook_url: https://git.ddupan.top/panxiao81/homelab-wiki/src/branch/main/guides/monitoring-foundation.md
