apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
  data:
    - secretKey: telegram_bot_token
      remoteRef:
        key: k8s/alertmanager
        property: telegram_bot_token
