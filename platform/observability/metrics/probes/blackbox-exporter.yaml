# 集群内黑盒探测（COVERAGE B1）。从 Pod 视角发起，所以走的是和业务 Pod 相同的
# CoreDNS、Envoy hairpin 和宿主路由表（包括 tun0）——这正是要验证的路径。
# 外部视角（经 Cloudflare 的公网入口）由 oci-arm 上的看守负责，见 infrastructure/oci/ansible。
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.18.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: blackbox-exporter
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    config:
      modules:
        # 健康检查端点：不跟随跳转，跳转到登录页意味着探到的不是后端本身。
        http_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            fail_if_not_ssl: true
        # zot-push 的 /v2/ 要求认证；401 来自 zot 本身，说明路由和后端都在。
        http_401:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            fail_if_not_ssl: true
            valid_status_codes: [401]
        # 外网出口：只关心通不通，跟随跳转、接受任意 2xx/3xx。
        http_egress:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 301, 302]
        dns_dc1:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: dc1.ad.ddupan.top
            query_type: A
            validate_answer_rrs:
              fail_if_not_matches_regexp: ['.*\t192\.168\.10\.5$']
        # split-horizon：git.ddupan.top 在内网必须解析到 Envoy，而不是 Cloudflare。
        dns_split_horizon:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: git.ddupan.top
            query_type: A
            validate_answer_rrs:
              fail_if_not_matches_regexp: ['.*\t192\.168\.10\.127$']
