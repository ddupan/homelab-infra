# 集群内黑盒探测（COVERAGE B1）。从 Pod 视角发起，所以走的是和业务 Pod 相同的
# CoreDNS、Envoy hairpin 和宿主路由表（包括 tun0）——这正是要验证的路径。
# 外部视角（经 Cloudflare 的公网入口）由 oci-arm 上的看守负责，见 infrastructure/oci/ansible。
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.24.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: blackbox-exporter
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # dc1 的 LDAPS 证书由 bao 内部 CA 签发，系统 CA 里没有它。
    extraConfigmapMounts:
      - name: bao-ca
        mountPath: /etc/bao-ca
        # 由 trust-manager 分发（platform/trust-manager/bundle）。
        configMap: internal-ca
        readOnly: true
        defaultMode: 420
    config:
      modules:
        # 健康检查端点：不跟随跳转，跳转到登录页意味着探到的不是后端本身。
        http_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            fail_if_not_ssl: true
        # zot-push 的 /v2/ 要求认证；401 来自 zot 本身，说明路由和后端都在。
        http_401:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
            fail_if_not_ssl: true
            valid_status_codes: [401]
        # 外网出口：只关心通不通，跟随跳转、接受任意 2xx/3xx。
        # 只开了明文 HTTP 的内网健康端点（如 OpenSandbox server，经 Ayatori LB 暴露在 :8080）。
        http_plain_2xx:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            follow_redirects: false
        http_egress:
          prober: http
          timeout: 10s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 301, 302]
        dns_dc1:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: dc1.ad.ddupan.top
            query_type: A
            validate_answer_rrs:
              fail_if_not_matches_regexp: ['.*\t192\.168\.10\.5$']
        # split-horizon：sso.ddupan.top 在内网必须解析到 Envoy，而不是 Cloudflare。
        # （原来查 git.ddupan.top；Gitea 迁到 OCI 后它刻意不再 split-horizon。）
        dns_split_horizon:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: sso.ddupan.top
            query_type: A
            validate_answer_rrs:
              fail_if_not_matches_regexp: ['.*\t192\.168\.10\.127$']
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        # 按 IP 连、按主机名校验：dc1 的 ACME 证书只有 DNS SAN（见 samba-ad-dc 记忆/README），
        # 用 IP 校验必然 IP mismatch。顺带产出 probe_ssl_earliest_cert_expiry。
        tcp_ldaps_dc1:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
            tls: true
            tls_config:
              ca_file: /etc/bao-ca/ca.pem
              server_name: dc1.ad.ddupan.top
        dns_dn42:
          prober: dns
          timeout: 10s
          dns:
            preferred_ip_protocol: ip4
            transport_protocol: udp
            query_name: dn42
            query_type: SOA
            validate_answer_rrs:
              fail_if_not_matches_regexp: ['.*\tSOA\t.*']
