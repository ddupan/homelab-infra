# 上游 Probe（blackbox 探测），见 ../../README.md「CRD 约定」。converter 保留 Probe.jobName。
# Envoy 后每个服务域名的健康端点（COVERAGE B2）+ Bao（B7，按主机名验证 LE 证书）。
# 从 Pod 发起：CoreDNS 解析 → 192.168.10.127 → Envoy → 后端，整条链路一起验证。
# metrics-write 只匹配 POST /api/v1/write，GET 探不到；它由 vmagent-sandbox 的 remote write 告警覆盖。
# 新增 HTTPRoute 时在这里加一行，下线服务时删掉对应行；步骤见 platform/envoy-gateway/README.md「Adding a service」。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-https
  namespace: monitoring
spec:
  jobName: probe-lan-https
  module: http_2xx
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: lan
      static:
        - https://auth.ddupan.top/api/health
        - https://backstage.lab.ddupan.top/.backstage/health/v1/readiness
        - https://git.ddupan.top/api/healthz
        - https://incus.ad.ddupan.top/1.0
        # 总 health 含 LDAP（Boot 的 ContextSource 连 dc1 LDAPS），目录不可用时也会告警。
        - https://sso.ddupan.top/actuator/health
        - https://grafana.lab.ddupan.top/api/health
        - https://nexus.ad.ddupan.top/service/rest/v1/status
        - https://dns.ad.ddupan.top/login
        - https://s3.ad.ddupan.top/status
        - https://spire-oidc.ad.ddupan.top/.well-known/openid-configuration
        - https://zot.ad.ddupan.top/v2/
        - https://bao.lab.ddupan.top:8200/v1/sys/health
        # lab.ddupan.top：同一批服务的新域名，经 PowerDNS + external-dns 解析，与 *.ad 走 dc1 是两条
        # 不同的 DNS 路径，所以各探一次。
        - https://dns.lab.ddupan.top/login
        - https://nexus.lab.ddupan.top/service/rest/v1/status
        - https://s3.lab.ddupan.top/status
---
# 要求认证的端点：401 由后端返回，证明路由和后端都在。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-https-auth
  namespace: monitoring
spec:
  jobName: probe-lan-https-auth
  module: http_401
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: lan
      static:
        - https://zot-push.ad.ddupan.top/v2/
---
# COVERAGE B4：dc1 直连、CoreDNS（ad.ddupan.top 转发到 dc1）、Blocky 三条解析路径。
# 内部解析绝不能依赖 WAN（CLAUDE.md）。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns-dc1
  namespace: monitoring
spec:
  jobName: probe-dns-dc1
  module: dns_dc1
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: dns
      static:
        - 192.168.10.5:53
        - 10.43.0.10:53
        - 192.168.10.127:53
---
# split-horizon：git.ddupan.top 在 Blocky 和 CoreDNS 都要解析到 Envoy（infrastructure/dns/records.yml）。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns-split-horizon
  namespace: monitoring
spec:
  jobName: probe-dns-split-horizon
  module: dns_split_horizon
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: dns
      static:
        - 192.168.10.127:53
        - 10.43.0.10:53
---
# COVERAGE B6：外网出口。两个都不在 tun0 路由内，用来区分"WAN 断了"和"VPN 断了"。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: egress
  namespace: monitoring
spec:
  jobName: probe-egress
  module: http_egress
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: egress
      static:
        - https://github.com/
        - https://www.cloudflare.com/cdn-cgi/trace
---
# COVERAGE B5：www.naist.jp（163.221.8.230）落在 openvpn-client@naist 接受的 163.221.0.0/16 路由里。
# 隧道死了 systemd 仍报 active、路由仍在，发往 NAIST 的流量全部黑洞；从外部（oci-arm）访问正常。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: naist-vpn
  namespace: monitoring
spec:
  jobName: probe-naist-vpn
  module: http_egress
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: vpn
      static:
        - https://www.naist.jp/
---
# COVERAGE H1：dc1 的 AD 服务端口。DNS 已由 dns-dc1 覆盖；这里是 Kerberos 与 LDAP。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: samba-dc-tcp
  namespace: monitoring
spec:
  jobName: probe-samba-dc-tcp
  module: tcp_connect
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: ad
      static:
        - 192.168.10.5:88
        - 192.168.10.5:389
---
# LDAPS：Authelia、PVE AD realm 等都靠它；同时监控证书到期（bao ACME 证书约 32 天，
# samba-acme.timer 在剩 10 天时续期）。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: samba-dc-ldaps
  namespace: monitoring
spec:
  jobName: probe-samba-dc-ldaps
  module: tcp_ldaps_dc1
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: ad
      static:
        - 192.168.10.5:636
---
# COVERAGE P6：VyOS 上对外提供的 TCP 入口。HAProxy 进程活着不代表在监听正确的地址。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vyos-entrypoints
  namespace: monitoring
spec:
  jobName: probe-vyos-entrypoints
  module: tcp_connect
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: vyos
      static:
        - 192.168.10.2:5432    # pg-prod（生产 PostgreSQL，homelab-pg-proxy）
        - 10.60.0.13:6443      # sandbox k3s API
        - 10.60.0.13:8080      # opensandbox API
        - 10.60.0.1:5432       # sandbox PostgreSQL
---
# DN42 解析：经 VyOS pdns-recursor → wg42 隧道 → DN42 delegation server。
# 同时验证了 pdns-recursor、wg42 与经 oci-amd 的路由。
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns-dn42
  namespace: monitoring
spec:
  jobName: probe-dns-dn42
  module: dns_dn42
  interval: 60s
  scrapeTimeout: 15s
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: dn42
      static:
        - 192.168.10.2:53
