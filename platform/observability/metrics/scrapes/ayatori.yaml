  namespace: monitoring
spec:
  jobName: ayatori-flux-source-controller
  targetEndpoints:
    - targets: ['192.168.10.11:8280']
      labels: {cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:8280']
      labels: {cluster: ayatori-prod, environment: prod}
