# Ayatori Dev/Prod 控制面（Incus LXC，见 infrastructure/ayatori）。各组件 metrics 由部署 role 监听在
# LXC 地址；每个组件一个 VMStaticScrape，job 取自 jobName（endpoint labels 中的 job 会被 jobName
# 覆盖），一律以 ayatori- 开头并带 cluster 标签，避免命中集群内 kube-state-metrics/Flux 的规则。
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ayatori-node
  namespace: monitoring
spec:
  jobName: ayatori-node
  targetEndpoints:
    - targets: ['192.168.10.11:9100']
      labels: {cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:9100']
      labels: {cluster: ayatori-prod, environment: prod}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ayatori-kube-state-metrics
  namespace: monitoring
spec:
  jobName: ayatori-kube-state-metrics
  targetEndpoints:
    - targets: ['192.168.10.11:8085']
      labels: {cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:8085']
      labels: {cluster: ayatori-prod, environment: prod}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ayatori-manager
  namespace: monitoring
spec:
  jobName: ayatori-manager
  targetEndpoints:
    - targets: ['192.168.10.11:8080']
      labels: {cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:8080']
      labels: {cluster: ayatori-prod, environment: prod}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ayatori-external-secrets
  namespace: monitoring
spec:
  jobName: ayatori-external-secrets
  targetEndpoints:
    - targets: ['192.168.10.11:8180']
      labels: {cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:8180']
      labels: {cluster: ayatori-prod, environment: prod}
---
apiVersion: operator.victoriametrics.com/v1beta1
