# Ayatori Dev/Prod 控制面（Incus LXC，见 infrastructure/ayatori）。各组件 metrics 由部署 role 监听在
# LXC 地址；job 一律以 ayatori- 开头并带 cluster 标签，避免命中集群内 kube-state-metrics/Flux 的规则。
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ayatori
  namespace: monitoring
spec:
  jobName: ayatori
  targetEndpoints:
    - targets: ['192.168.10.11:9100']
      labels: {job: ayatori-node, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.11:8085']
      labels: {job: ayatori-kube-state-metrics, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.11:8080']
      labels: {job: ayatori-manager, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.11:8180']
      labels: {job: ayatori-external-secrets, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.11:8280']
      labels: {job: ayatori-flux-source-controller, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.11:8281']
      labels: {job: ayatori-flux-kustomize-controller, cluster: ayatori-dev, environment: dev}
    - targets: ['192.168.10.12:9100']
      labels: {job: ayatori-node, cluster: ayatori-prod, environment: prod}
    - targets: ['192.168.10.12:8085']
      labels: {job: ayatori-kube-state-metrics, cluster: ayatori-prod, environment: prod}
    - targets: ['192.168.10.12:8080']
      labels: {job: ayatori-manager, cluster: ayatori-prod, environment: prod}
    - targets: ['192.168.10.12:8180']
      labels: {job: ayatori-external-secrets, cluster: ayatori-prod, environment: prod}
    - targets: ['192.168.10.12:8280']
      labels: {job: ayatori-flux-source-controller, cluster: ayatori-prod, environment: prod}
    - targets: ['192.168.10.12:8281']
      labels: {job: ayatori-flux-kustomize-controller, cluster: ayatori-prod, environment: prod}
