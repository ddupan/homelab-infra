# postgres_exporter 跑在数据库主机上，按实例一个端口；env 标签供 Alertmanager 分流 dev。
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: shared-postgresql-sql
  namespace: monitoring
spec:
  jobName: shared-postgresql-sql
  targetEndpoints:
    - targets: ['192.168.10.127:9187']
      labels: {cluster: homelab-pg-prod, member: pg-laptop, env: prod}
      interval: 30s
    - targets: ['10.60.0.20:9187']
      labels: {cluster: homelab-pg-prod, member: pg-pve1, env: prod}
      interval: 30s
    - targets: ['192.168.10.127:9188']
      labels: {cluster: homelab-pg-dev, member: pg-laptop, env: dev}
      interval: 30s
