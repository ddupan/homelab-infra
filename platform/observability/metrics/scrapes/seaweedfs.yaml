apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seaweedfs
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
    - seaweedfs
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: seaweedfs
  endpoints:
  - port: metrics
    interval: 30s
    honorLabels: true
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_service_name
      regex: seaweedfs-(master|volume|filer)
      action: keep
    - sourceLabels:
      - __meta_kubernetes_service_name
      targetLabel: job
