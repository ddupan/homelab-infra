# Kubelet + cAdvisor metrics (per-node pod/container CPU, memory, network, fs).
# Scraped over the kubelet's authenticated https port using the vmagent pod's
# ServiceAccount token. Pattern from the operator docs (VMNodeScrape / cadvisor).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: kubelet
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics
spec:
  scheme: https
  honorLabels: true
  honorTimestamps: false
  interval: 30s
  # k3s 此端点包含 apiserver/etcd 指标，响应已超过默认 16 MiB。
  # 仅放宽 kubelet 任务，其他采集目标保留默认限制。
  max_scrape_size: "32MiB"
  tlsConfig:
    insecureSkipVerify: true
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - targetLabel: job
      replacement: kubelet
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: cadvisor
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics
spec:
  scheme: https
  honorLabels: true
  honorTimestamps: false
  interval: 30s
  path: /metrics/cadvisor
  tlsConfig:
    insecureSkipVerify: true
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - targetLabel: job
      replacement: cadvisor
