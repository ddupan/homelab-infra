# COVERAGE K：集群内基础组件。都是只读抓取，不改被抓的工作负载。
# 用上游 prometheus-operator CRD（ServiceMonitor / PodMonitor），由 VM operator 的 converter 转换，
# 见 ../../README.md「CRD 约定」。job 用 relabelings 显式设定：默认值是 Service 名或
# "<namespace>/<name>"，规则里不好写死。
#
# k3s 控制面（apiserver/scheduler/controller-manager）不在这里：k3s 把它们跑在 kubelet
# 同一进程里，kubelet 的 /metrics 已经带上（job=kubelet），见 rules/k3s-components.yaml。
#
# CoreDNS（k3s 自带插件，kube-system/kube-dns 已声明 metrics 端口）。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coredns
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
  - port: metrics
    interval: 30s
    relabelings:
    - targetLabel: job
      replacement: coredns
---
# Envoy Gateway 控制面：xDS 下发、Gateway API 资源处理。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
  endpoints:
  - port: metrics
    interval: 30s
    relabelings:
    - targetLabel: job
      replacement: envoy-gateway
---
# Envoy 数据面（192.168.10.127 上的 LAN ingress）：每个后端 cluster 的成员健康与上游 5xx。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
    interval: 30s
    relabelings:
    - targetLabel: job
      replacement: envoy-proxy
---
# cloudflared（公网入口）。Deployment 已带 --metrics 0.0.0.0:2000（infrastructure/cloudflared），
# 但容器没声明端口。不能用 portNumber：operator 生成的是
# "keep __meta_kubernetes_pod_container_port_number=2000"，未声明端口的容器永远被过滤掉（#298 上线
# 后实测没有 target）。改为不指定端口——未声明端口的容器会得到一个不带端口的 target——再把
# __address__ 补成 <podIP>:2000。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [cloudflared]
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
  - path: /metrics
    interval: 30s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_ip]
      targetLabel: __address__
      replacement: $1:2000
    - targetLabel: job
      replacement: cloudflared
