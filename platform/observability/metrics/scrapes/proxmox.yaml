# 上游 ScrapeConfig（集群外固定地址），见 ../../README.md「CRD 约定」。converter 会丢掉
# ScrapeConfig.jobName，job 一律用 relabelings 设定。
#
# Proxmox 三个节点的 node_exporter（infrastructure/proxmox/ansible/monitoring.yml 部署）。
# job 用 node-exporter，host-health 规则自动覆盖；quorum 来自 textfile 的 pve_corosync_*。
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pve-node-exporter
  namespace: monitoring
spec:
  scrapeInterval: 30s
  staticConfigs:
  - targets: [192.168.10.4:9100]
    labels:
      node: pve1
  - targets: [192.168.10.7:9100]
    labels:
      node: pve2
  - targets: [192.168.10.9:9100]
    labels:
      node: pve3
  relabelings:
  - targetLabel: job
    replacement: node-exporter
---
# 集群级视图（/cluster/resources、HA、cluster info）从任一节点都能拿到。抓两个节点：
# 被抓的那个节点挂了时，另一个仍能报告它离线。规则里用 max without(instance) 去重。
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pve-cluster
  namespace: monitoring
spec:
  metricsPath: /pve
  params:
    cluster: ["1"]
    node: ["0"]
  scrapeInterval: 60s
  scrapeTimeout: 30s
  staticConfigs:
  - targets:
    - pve1.ad.ddupan.top
    - pve2.ad.ddupan.top
  relabelings:
  - sourceLabels: [__address__]
    targetLabel: __param_target
  - sourceLabels: [__param_target]
    targetLabel: instance
  - targetLabel: __address__
    replacement: pve-exporter.monitoring.svc:9221
  - targetLabel: job
    replacement: pve-cluster
---
# 节点级 collector（onboot 配置、replication、subscription）只能从各自节点取。
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pve-node
  namespace: monitoring
spec:
  metricsPath: /pve
  params:
    cluster: ["0"]
    node: ["1"]
  scrapeInterval: 60s
  scrapeTimeout: 30s
  staticConfigs:
  - targets:
    - pve1.ad.ddupan.top
    - pve2.ad.ddupan.top
    - pve3.ad.ddupan.top
  relabelings:
  - sourceLabels: [__address__]
    targetLabel: __param_target
  - sourceLabels: [__param_target]
    targetLabel: instance
  - targetLabel: __address__
    replacement: pve-exporter.monitoring.svc:9221
  - targetLabel: job
    replacement: pve-node
