# dc1（Samba AD DC，laptop 上的 libvirt VM）的 node_exporter，由
# infrastructure/samba-ad/ansible/monitoring-dc.yml 部署。job 改写为 node-exporter，
# 这样 host-health 的磁盘/内存/systemd/PSI/时钟规则自动覆盖 dc1；与 bao1 同一做法。
apiVersion: v1
kind: Service
metadata:
  name: samba-dc-node-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: samba-dc-node-metrics
spec:
  ports:
  - name: http
    port: 9100
    targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: samba-dc-node-metrics
  namespace: monitoring
subsets:
- addresses:
  - ip: 192.168.10.5
  ports:
  - name: http
    port: 9100
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: samba-dc-node
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: samba-dc-node-metrics
  endpoints:
  - port: http
    interval: 30s
    scrapeTimeout: 10s
    relabelings:
    - targetLabel: job
      replacement: node-exporter
    - targetLabel: node
      replacement: dc1
