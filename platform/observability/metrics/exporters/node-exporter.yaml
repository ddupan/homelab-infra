# Host metrics (CPU/mem/disk/net/filesystem) for every node. node-exporter has no
# ServiceMonitor of its own here, so we scrape it directly with a VMNodeScrape:
# vmagent discovers each Node and scrapes its InternalIP:9100.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true          # bind 9100 on the node so VMNodeScrape can reach it
      hostPID: true
      tolerations:
        - operator: Exists       # run on control-plane / tainted nodes too
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            # systemd 默认关闭；HostSystemdUnitFailed 依赖它。经宿主 D-Bus 只读查询 unit 状态，
            # 默认已排除 mount/scope/slice 等单元，k3s 的大量 Pod scope 不会进来。
            # ⚠ 需要 AppArmor profile homelab-node-exporter，默认 profile 拒绝 D-Bus（见 README.md）。
            - --collector.systemd
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - { name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
            - { name: dbus, mountPath: /var/run/dbus/system_bus_socket, readOnly: true }
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
        - { name: dbus, hostPath: { path: /run/dbus/system_bus_socket, type: Socket } }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics
spec:
  port: "9100"
  scheme: http
  interval: 30s
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - targetLabel: job
      replacement: node-exporter
