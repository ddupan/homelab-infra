apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 30m
  timeout: 5m
  dependsOn:
  - name: vm-operator
  - name: prometheus-operator-crds
  chart:
    spec:
      chart: kube-state-metrics
      version: 9.0.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kube-state-metrics
    collectors:
    - cronjobs
    - daemonsets
    - deployments
    - jobs
    - namespaces
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - statefulsets
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    prometheus:
      monitor:
        enabled: true
        jobLabel: app.kubernetes.io/name
        http:
          interval: 30s
          honorLabels: true
        metrics:
          interval: 30s
          honorLabels: true
    selfMonitor:
      enabled: true
    rbac:
      extraRules:
      - apiGroups:
        - kustomize.toolkit.fluxcd.io
        resources:
        - kustomizations
        verbs:
        - list
        - watch
      - apiGroups:
        - helm.toolkit.fluxcd.io
        resources:
        - helmreleases
        verbs:
        - list
        - watch
      - apiGroups:
        - source.toolkit.fluxcd.io
        resources:
        - gitrepositories
        - helmrepositories
        - helmcharts
        - ocirepositories
        verbs:
        - list
        - watch
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
                repository_type:
                - spec
                - type
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmChart
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
            - name: resource_info
              help: The current state of a GitOps Toolkit resource.
              each:
                type: Info
                info:
                  labelsFromPath:
                    name:
                    - metadata
                    - name
              labelsFromPath:
                resource_namespace:
                - metadata
                - namespace
                suspended:
                - spec
                - suspend
                ready:
                - status
                - conditions
                - '[type=Ready]'
                - status
