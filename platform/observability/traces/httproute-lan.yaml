# OTLP 的 LAN 入口：给不在 homelab 集群里的内网写入方（sandbox 集群里跑的 CI job，如 Renovate
# 升级评审）发 trace。指向带 bearer token 的 4319（otlp/public 接收器，只进 traces 管道），
# 与公网入口 otlp.ddupan.top 同一扇门；只是不绕 Cloudflare——内网服务不依赖 WAN（CLAUDE.md）。
# 4317/4318 不认证，仍只在集群内，不要把路由指向它们。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otlp-lan
  namespace: monitoring
spec:
  parentRefs:
    # lab.ddupan.top (PowerDNS); external-dns publishes the record. See infrastructure/dns/README.md.
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-lab
  hostnames:
    - otlp.lab.ddupan.top
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/traces
      backendRefs:
        - name: otel-collector
          port: 4319
