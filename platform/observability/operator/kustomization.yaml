apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: vm-operator-values
    namespace: monitoring
    files:
      - values.yaml=values.yaml
resources:
  - prometheus-crds-helmrelease.yaml
  - helmrelease.yaml
