apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-operator
  namespace: monitoring
spec:
  dependsOn:
    - name: prometheus-operator-crds
  chart:
    spec:
      chart: victoria-metrics-operator
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: vm
      version: 0.66.2
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: vm-operator
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: vm-operator-values
