apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      version: 32.0.2
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: prometheus-operator-crds
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
