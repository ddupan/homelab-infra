apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: victoria-logs-collector-values
    namespace: monitoring
    files:
      - values.yaml=collector-values.yaml
resources:
  - vlsingle.yaml
  - helmrelease.yaml
