apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
  namespace: monitoring
spec:
  chart:
    spec:
      chart: victoria-logs-collector
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: vm
      version: 0.3.6
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: victoria-logs-collector
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: victoria-logs-collector-values
