apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
  namespace: monitoring
spec:
  chart:
    spec:
      chart: victoria-logs-collector
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: vm
      version: 0.3.8
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 30m
  releaseName: victoria-logs-collector
  targetNamespace: monitoring
  timeout: 10m
  upgrade:
    # 无状态、不带 CRD：升级失败（timeout 内未 Ready）自动回滚到上一版。有状态或带 CRD 的
    # release 保持 RetryOnFailure，回滚撤不回数据库 migration 和 CRD。重试用尽后 HelmRelease
    # 停在 Ready=False，由 FluxResourceNotReady 告警。
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: victoria-logs-collector-values
