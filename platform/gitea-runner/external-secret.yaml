apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-token
  namespace: gitea-actions
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: gitea-runner-token
  data:
    - secretKey: token
      remoteRef:
        key: k8s/gitea-runner
        property: token
