apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-actions
  namespace: gitea-actions
spec:
  chart:
    spec:
      chart: actions
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: gitea-charts
      version: 0.1.1
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: gitea-actions
  suspend: true
  targetNamespace: gitea-actions
  timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: gitea-actions-values
