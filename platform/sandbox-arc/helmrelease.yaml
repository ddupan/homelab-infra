---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc
  namespace: arc-systems
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  # The controller's ServiceAccount is <releaseName>-gha-rs-controller; the scale set names it below.
  releaseName: arc
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
---
# Runner scale set "homelab": `runs-on: homelab` in a ddupan workflow. The org runner group of the
# same name limits which repositories may use it (public repos must be allowed explicitly there).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab
  namespace: arc-runners
spec:
  dependsOn:
    - name: arc
      namespace: arc-systems
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  # The chart hard-codes `docker:dind` for the dind sidecar (initContainers[1] on Kubernetes >= 1.29,
  # a native sidecar), which values cannot override. Unpinned it would not even stay current: with
  # IfNotPresent each node keeps whatever it pulled first, and it would follow Docker majors silently.
  # A floating major tag plus digest instead: Renovate automerges the digest bumps (renovate.json,
  # floating Docker Hub tags), so 29.x patches land with a commit; a new major is a reviewed PR.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: AutoscalingRunnerSet
              name: homelab
            patch: |
              - op: test
                path: /spec/template/spec/initContainers/1/name
                value: dind
              - op: replace
                path: /spec/template/spec/initContainers/1/image
                # renovate: image
                value: docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
              # Docker Hub pulls go through the Artifact Keeper pull-through cache, as on the Gitea runners.
              # setup-artifact-keeper's `docker` input cannot do it here: it rewrites daemon.json and SIGHUPs
              # a dockerd in the job container, but in dind mode dockerd lives in this sidecar.
              - op: add
                path: /spec/template/spec/initContainers/1/args/-
                value: --registry-mirror=https://artifacts.lab.ddupan.top
  releaseName: homelab
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    githubConfigUrl: https://github.com/ddupan
    githubConfigSecret: arc-github-app
    runnerGroup: homelab
    runnerScaleSetName: homelab
    minRunners: 0
    # Sandbox kubepods are capped at 7G/5G and also hold one Gitea ci-vm executor (3Gi). Four runners
    # at a 2Gi request fit beside it; more queue as Pending. Not much beyond that: executors have no
    # CPU limit, and CI saturating the nodes is what took sandbox k3s down on 2026-11-06.
    maxRunners: 4
    containerMode:
      type: dind
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
    template:
      spec:
        containers:
          - name: runner
            # github.com/ddupan/arc-runner-image: actions-runner plus Python 3, Node 24, zip, make.
            # The official image has no toolchains, and a node-local tool cache would never be cleaned.
            # renovate: image
            image: ghcr.io/ddupan/arc-runner:latest@sha256:a88a63853d19213d3b3c8dbe2c4676329d85807dac2c9a9777ee23d89692fd73
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                memory: 4Gi
            # Proves "this request comes from a homelab ARC runner Pod" to spire-identity-exchange
            # (k8s_psat, checked by TokenReview); the job's GitHub OIDC token proves which job.
            volumeMounts:
              - name: spire-identity-exchange-token
                mountPath: /var/run/secrets/spire-identity-exchange
                readOnly: true
        volumes:
          - name: spire-identity-exchange-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: spire-identity-exchange
                    expirationSeconds: 600
                    path: token
