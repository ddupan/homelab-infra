# GitHub App "ddupan ARC" (org ddupan, Organization → Self-hosted runners: read & write, nothing
# else). ARC uses it only to manage the scale set and mint JIT runner configs; no repository access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: arc-github-app
  data:
    - secretKey: github_app_id
      remoteRef:
        key: k8s/arc-github-app
        property: app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: k8s/arc-github-app
        property: installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: k8s/arc-github-app
        property: private_key
