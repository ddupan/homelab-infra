apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: openebs-values
    namespace: openebs
    files:
      - values.yaml=values.yaml
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - storageclasses.yaml
