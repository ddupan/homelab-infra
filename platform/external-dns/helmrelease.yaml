apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: external-dns
  releaseName: external-dns
  interval: 30m
  timeout: 5m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    # 无状态、不带 CRD：升级失败（timeout 内未 Ready）自动回滚到上一版。有状态或带 CRD 的
    # release 保持 RetryOnFailure，回滚撤不回数据库 migration 和 CRD。重试用尽后 HelmRelease
    # 停在 Ready=False，由 FluxResourceNotReady 告警。
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: external-dns-values
