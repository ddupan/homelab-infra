# The single pdns API key, shared with pdns itself, Poweradmin and the dns
# Terraform root. Rotate there, not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: external-dns
  data:
    - secretKey: api_key
      remoteRef:
        key: k8s/powerdns
        property: api_key
