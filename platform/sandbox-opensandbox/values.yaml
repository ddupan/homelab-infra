---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-values
  namespace: opensandbox-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    # base 子 chart：保留 OpenSandbox 自己的 CRD（BatchSandbox/Pool/SandboxSnapshot，与 0.2.2 一样由本
    # release 管理）。fast-sandbox 不用：不装它的 CRD/RBAC，也不建 namespace——opensandbox-system 由本目录
    # namespace.yaml 管理，Helm 收编不了已存在的 namespace，默认值会让 upgrade 失败。
    base:
      fastSandbox:
        crds:
          install: false
        namespaces:
          createSystem: false
          create: false
        rbac:
          create: false
    opensandbox-controller:
      controller:
        metrics:
          enabled: true
          port: 8080
          secure: false

    opensandbox-server:
      server:
        replicaCount: 1
        env:
          - name: OPENSANDBOX_SERVER_API_KEY
            valueFrom:
              secretKeyRef:
                name: opensandbox-api-key
                key: api-key
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
          - name: batchsandbox-template
            mountPath: /etc/opensandbox/batchsandbox-template.yaml
            subPath: batchsandbox-template.yaml
            readOnly: true
        volumes:
          - name: batchsandbox-template
            configMap:
              name: opensandbox-batchsandbox-template

      configToml: |
        [server]
        host = "0.0.0.0"
        port = 80
        api_key = ""
        max_sandbox_timeout_seconds = 86400

        [log]
        level = "INFO"

        [runtime]
        type = "kubernetes"
        execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.1"

        [storage]
        allowed_host_paths = []
        volume_default_size = "1Gi"

        [kubernetes]
        kubeconfig_path = ""
        namespace = "opensandbox"
        informer_resync_seconds = 300
        informer_watch_timeout_seconds = 60
        # 创建请求同步等 Pod Running；节点上没缓存镜像时拉 runner-images 超过默认的 60 秒，server 会返回 504
        # 并删掉 sandbox。比 ci-actions/upgrade-review 的客户端超时（600 秒）短，超时时由 server 带回 Pod 详情。
        sandbox_create_timeout_seconds = 540
        workload_provider = "batchsandbox"
        image_pull_policy = "IfNotPresent"
        batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"

        [egress]
        image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:release-1.2.1"
        mode = "dns+nft"
        disable_ipv6 = true

        [secure_runtime]
        type = "kata"
        k8s_runtime_class = "kata-clh-runtime-rs"

    opensandbox-node-agent:
      enabled: false
