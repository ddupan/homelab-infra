---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensandbox-api-key
  namespace: opensandbox-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: opensandbox-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: k8s/opensandbox-api
        property: api_key
