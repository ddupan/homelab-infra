---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: opensandbox
  namespace: opensandbox-system
spec:
  interval: 1h
  # 跟随上游正式 release tag（release-x.y.z，不跟 rc），Renovate 按 tag 升级；每次变化经 flux-diff
  # 渲染与升级评审。release-1.2.1 = db708c218771a8d311356f0e96552c15df6e097a（README）。
  ref:
    tag: release-1.2.1
  url: https://github.com/opensandbox-group/OpenSandbox.git
