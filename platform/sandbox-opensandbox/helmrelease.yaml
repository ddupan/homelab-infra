---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensandbox
  namespace: opensandbox-system
spec:
  chart:
    spec:
      chart: ./kubernetes/charts/opensandbox
      interval: 1h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: opensandbox
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 30m
  releaseName: opensandbox
  targetNamespace: opensandbox-system
  timeout: 15m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: ConfigMap
      name: opensandbox-values
      valuesKey: values.yaml
