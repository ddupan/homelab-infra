---
# Telegram：与 laptop 的 VMAlertmanager 同一个 bot、同一个生产频道。token 来自
# host_vars/oci_arm/vault.yml（ansible-vault），刻意不在部署时读 Bao：bao1 跑在 laptop 上，
# laptop 挂了正是需要重建看守的时候。它和 Bao kv/k8s/alertmanager 是同一个值，几乎不轮换。
watcher_telegram_chat_id: -1003956377923
watcher_telegram_bot_token: "{{ vault_watcher_telegram_bot_token }}"

# 从外部（经 Cloudflare）看公网入口；obj 是 S3 根路径，未认证返回 403 也说明隧道和 SeaweedFS 都在。
watcher_public_probes:
  - {url: 'https://auth.ddupan.top/api/health', module: http_2xx}
  - {url: 'https://git.ddupan.top/api/healthz', module: http_2xx}
  - {url: 'https://e5renew.ddupan.top/', module: http_2xx}
  - {url: 'https://obj.ddupan.top/', module: http_s3_root}

# laptop 自己的告警链路告警：它们说明 laptop → Telegram 这条路坏了，由 laptop 自己发等于没发。
watcher_forward_from_lab:
  - AlertmanagerTelegramDeliveryFailed
  - AlertmanagerConfigurationReloadFailed
  - AlertmanagerErrors
