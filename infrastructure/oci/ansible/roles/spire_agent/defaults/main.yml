---
# SPIRE agent on an OCI instance, attesting with oci_instance (github.com/panxiao81/spire-plugin-oci).
# Mirrors homelab_base's spire_agent (Cinc) except for the attestor, so it can move there if the
# OCI hosts ever join Cinc (#642).

spire_agent_version: 1.15.3
# Map Ansible's architecture name to the release naming (aarch64 -> arm64).
spire_agent_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_architecture] }}"
# From spire-<v>-linux-<arch>-musl_sha256sum.txt, cross-checked with the GitHub asset digest.
spire_agent_sha256:
  arm64: a9982b3ca7de489def22265fd4586d8e13091ecb6fddf6adcea9291313b18886

spire_agent_plugin_version: v0.1.1
# The agent-linux-<arch> lines of the release's SHA256SUMS. SPIRE re-checks this as
# plugin_checksum on every start, so a tampered or wrong binary stops the agent.
spire_agent_plugin_sha256:
  arm64: 37c71eae8f222bfcd27ed821123414493264813e62d8915b1a3b1d9776cbc003
  amd64: a367c192bdcbb9edf14106d6f5e4c880e76f397c30d7c3905c439f68dd66e8c5

spire_agent_server_address: spire-server.lab.ddupan.top
spire_agent_trust_domain: ddupan.top
# Bootstrap bundle fetched over WebPKI (Let's Encrypt) from the server's https_web bundle endpoint,
# instead of a copied PEM: a copied bundle goes stale when the server CA rotates, and re-attesting
# then fails with "unknown authority" (platform/spire/external-agent/README.md).
spire_agent_trust_bundle_url: https://spire-bundle.lab.ddupan.top
