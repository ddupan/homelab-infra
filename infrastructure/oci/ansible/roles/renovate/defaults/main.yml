---
# Self-hosted Renovate on oci-arm (#642): an hourly systemd timer runs the container, which used to
# be a CronJob on the laptop k3s (it was a big part of the laptop's memory pressure).

# renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
renovate_version: "44.251.0@sha256:64adaabe8ee3e34820c2b044b5f87e281aa278bf53e5d76df2ce800f9cc9407a"
# The image's own user. The host user with the same uid is what the SPIRE entry
# spiffe://ddupan.top/node/oci-arm/renovate selects (platform/spire/oci-arm.yaml), so changing it
# means changing that entry too.
renovate_uid: 12021

renovate_bao_addr: https://bao.lab.ddupan.top:8200
renovate_bao_role: renovate
# Still under k8s/ from the CronJob days; the path is only a name, moving it buys nothing.
renovate_bao_secret: kv/data/k8s/renovate
renovate_spire_socket: /run/spire/agent-sockets/spire-agent.sock
