---
- name: 安装 AMD DN42 loopback 地址启动单元
  ansible.builtin.copy:
    dest: /etc/systemd/system/dn42-loopback.service
    mode: '0644'
    content: |
      [Unit]
      Description=DN42 router loopback addresses
      Before=frr.service
      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ip address replace 172.21.111.162/32 dev lo
      # OCI-WG-SOURCE 用 set src {{ bgp_router_id }}；该地址只在 ens3 上时，networkd 重启（unattended-upgrades
      # 升级 systemd 会触发）的瞬间地址消失，zebra 以 Invalid prefsrc 装路由失败且永不重试，家中前缀
      # 一直停在 RIB Failed（2026-11-13 起 LAN↔OCI 断了 5 天）。lo 上常驻一份，prefsrc 永远有效。
      ExecStart=/usr/sbin/ip address replace {{ bgp_router_id }}/32 dev lo
      ExecStart=/usr/sbin/ip -6 address replace fdd0:98df:15b0::2/128 dev lo
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  register: dn42_loopback_unit

- name: 启用 AMD DN42 loopback
  ansible.builtin.systemd_service:
    name: dn42-loopback
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if dn42_loopback_unit.changed else 'started' }}"
  when: not ansible_check_mode

- name: 开启路由器 IPv6 转发
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_file: /etc/sysctl.d/90-dn42-forwarding.conf
    sysctl_set: true
