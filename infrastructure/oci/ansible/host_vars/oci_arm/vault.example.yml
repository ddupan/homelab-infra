---
# Copy to vault.yml and encrypt:  ansible-vault encrypt host_vars/oci_arm/vault.yml
# NEVER commit the decrypted vault.yml.
#
# 与 Bao kv/k8s/alertmanager 的 telegram_bot_token 是同一个值。外部看守刻意不在部署时
# 读 Bao：bao1 跑在 laptop 上，laptop 挂了正是需要重建看守的时候。
vault_watcher_telegram_bot_token: "CHANGE-ME-telegram-bot-token"

# Gitea（roles/gitea）。四个密钥必须是 k3s 时期 app.ini 的原值（SECRET_KEY 加密库内
# 2FA 种子与 OAuth 登录源 secret，换了就解不开）。
vault_gitea_secret_key: "CHANGE-ME"
vault_gitea_internal_token: "CHANGE-ME"
vault_gitea_oauth2_jwt_secret: "CHANGE-ME"
vault_gitea_lfs_jwt_secret: "CHANGE-ME"
# Cloudflare Origin CA 私钥；CSR 在 infrastructure/cloudflared/terraform/gitea-origin.csr。
vault_gitea_tls_key: |
  -----BEGIN PRIVATE KEY-----
  CHANGE-ME
  -----END PRIVATE KEY-----
# 以下可选，定义了才启用：
# vault_gitea_smtp_user: "OCI Email Delivery SMTP 凭据用户名"
# vault_gitea_smtp_password: "CHANGE-ME"
# vault_gitea_entra_client_secret: "CHANGE-ME"（同时在 host_vars 设 gitea_entra_tenant_id / gitea_entra_client_id）
