---
- name: 读取 AMD 的现有 WireGuard 公钥
  hosts: oci_amd
  become: true
  gather_facts: false
  tasks:
    - name: 仅交换公钥
      ansible.builtin.shell: wg pubkey < /etc/wireguard/wg-oci.key
      register: wg_public_key
      changed_when: false
      check_mode: false

- name: 配置 VyOS 站点与 DN42 内部路由
  hosts: site_routers
  gather_facts: false
  vars:
    # 本 play 独占的配置路径（`set ` 之后的正则，按 token 边界匹配）。这些路径下模板没渲染的内容会被
    # match=enforce 删除，路径以外的一概不碰。同一台机器还由 proxmox/ansible 的 vyos_router（IX/LB BGP、
    # IPv4 接口地址、DHCP、监控、SSH CA）、dn42-ra.yml（v6 接口地址、router-advert）、dn42-dns.yml
    # （dns forwarding）写入，这里不能与它们重叠。
    # 以前一次性退役的旧地址和旧邻居（10.255.254.0/30 传输网、fdd0:…:ffff::1）都在这些路径下，现在由
    # enforce 自动删除，不再单独维护退役列表。
    vyos_owned_paths:
      # private-key 必须排除：它只在 VyOS 本机生成（vyos-key-bootstrap），模板里没有。
      # 不排除的话，enforce 会把它删掉，wg42 就断了，而且私钥也会进入基线。
      - interfaces wireguard wg42 (?!private-key\s)\S+
      - interfaces loopback lo address
      - "protocols static route {{ dn42_ipv4 | regex_escape }}"
      - protocols static route6
      - protocols bgp (?:system-as|parameters)
      - protocols bgp address-family ipv[46]-unicast network
      # 按规则归属：OCI 传输网和 DN42 段内的邻居。IX 和 labnet 的 LB 邻居归 vyos_router。
      - protocols bgp neighbor (?:fe80:|fdd0:|10\.255\.254\.)\S+
      - policy (?:prefix-list|prefix-list6|route-map) OCI-\S+
      - nat source rule 181\d\d
  tasks:
    - name: 检查 VyOS 是否已有 WireGuard 私钥，仅返回存在状态
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, ConnectTimeout=10, 'vyos@192.168.10.2', /bin/cli-shell-api, existsActive, interfaces, wireguard, wg42, private-key]
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
      register: vyos_key_present
      changed_when: false
      failed_when: vyos_key_present.rc not in [0, 1]
      check_mode: false

    - name: 首次在 VyOS 本机生成并保存私钥，控制机不接收私钥
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, ConnectTimeout=10, 'vyos@192.168.10.2', /bin/vbash, -s]
        stdin: "{{ lookup('template', 'templates/vyos-key-bootstrap.vbash.j2') }}"
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_python_interpreter: /usr/bin/python3
      no_log: true
      register: vyos_key_bootstrap
      changed_when: true
      when: not ansible_check_mode and vyos_key_present.rc == 1

    - name: 读取 VyOS WireGuard 公钥
      vyos.vyos.vyos_command:
        commands: show interfaces wireguard wg42 public-key
      register: vyos_wg_public
      changed_when: false
      when: not ansible_check_mode

    - name: 准備 Linux 端需要的公钥事实
      ansible.builtin.set_fact:
        wg_public_key:
          stdout: '{{ vyos_wg_public.stdout[0] | trim }}'
        wg_key_file:
          stat:
            exists: true
      when: not ansible_check_mode

    # `| no-more` 不能省：不经管道时 CLI 按 512 列宽输出，超长行在第 512 列会被替换成空格
    # （见 proxmox 的 vyos_router）。完整配置里有私钥和登录哈希，所以 no_log。
    - name: 读取运行配置
      vyos.vyos.vyos_command:
        commands:
          - show configuration commands | no-more
      register: vyos_running_commands
      changed_when: false
      no_log: true

    # enforce 自己按顶层节划范围，而 interfaces/protocols/policy 这几节都有别的 play 在写。
    # 用双引号是为了让 YAML 把 `\\s`/`\n` 转成正则字符类和换行；放进 `>-` 块里会原样交给 Jinja，
    # 基线就被拼成一整行，什么都匹配不上。
    - name: 截取本 play 独占的运行配置
      ansible.builtin.set_fact:
        vyos_owned_running: "{{ vyos_running_commands.stdout[0].splitlines()
          | select('match', '^set (?:' ~ (vyos_owned_paths | join('|')) ~ ')(?:\\s|$)')
          | join('\n') }}"
      no_log: true

    - name: 应用 VyOS 双栈 WireGuard、iBGP 与精确路由过滤
      vyos.vyos.vyos_config:
        lines: "{{ lookup('template', 'templates/vyos-site.conf.j2').splitlines() | map('trim') | reject('equalto', '') | list }}"
        config: "{{ vyos_owned_running }}"
        # 需要 vyos.vyos >= 6.2.0。默认开启 commit-confirm：如果 delete 把会话断了，10 分钟后自动回滚。
        match: enforce
        save: true
        comment: Ansible OCI WireGuard DN42 preparation
      register: vyos_site_config
      changed_when: (vyos_site_config.commands | default([]) | length) > 0

    # 不用 no_log：private-key 被排除在基线之外，所以 enforce 下发的命令里不会有它；其余内容都是公开的。
    # enforce 可能会删东西，要看得到具体下发了什么。
    - name: 显示下发的命令
      ansible.builtin.debug:
        msg: "{{ vyos_site_config.commands | default([]) }}"
