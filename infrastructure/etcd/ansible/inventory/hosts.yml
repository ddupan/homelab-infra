---
all:
  vars:
    ansible_user: root
  children:
    # 三个成员都由 Cinc（homelab_data::etcd，infrastructure/chef/policies/etcd-pve*.rb）安装、
    # 配置并续签证书；这里的 playbook 只管账号（bootstrap-auth/consumers）、检查（verify）和成员增删
    # （member-join/remove）。ansible_host 用 lab 名：Cinc 的 known_hosts 按名字记录。
    etcd:
      hosts:
        etcd-pve1:
          ansible_host: etcd-pve1.lab.ddupan.top
          etcd_address: 10.60.0.20
        etcd-pve2:
          ansible_host: etcd-pve2.lab.ddupan.top
          etcd_address: 10.60.0.21
        etcd-pve3:
          ansible_host: etcd-pve3.lab.ddupan.top
          etcd_address: 10.60.0.22
    etcd_pve:
      hosts:
        pve1:
          ansible_host: 192.168.10.4
          etcd_lxc_vmid: 150
          etcd_lxc_hostname: etcd-pve1
          etcd_lxc_address: 10.60.0.20/24
          etcd_lxc_memory: 1536
        pve2:
          ansible_host: 192.168.10.7
          etcd_lxc_vmid: 151
          etcd_lxc_hostname: etcd-pve2
          etcd_lxc_address: 10.60.0.21/24
          etcd_lxc_memory: 768
        # etcd-pve3 取代 etcd-laptop（#570）：只跑 etcd，不挂 PG 数据盘。
        pve3:
          ansible_host: 192.168.10.9
          etcd_lxc_vmid: 152
          etcd_lxc_hostname: etcd-pve3
          etcd_lxc_address: 10.60.0.22/24
