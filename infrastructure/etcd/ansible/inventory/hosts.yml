---
# 已部署成员；共置 PG standby/备份的承载预算，数据库数据用独立 HDD mp0。
all:
  vars:
    ansible_user: root
  children:
    etcd:
      hosts:
        etcd-laptop:
          ansible_connection: local
          ansible_host: 192.168.10.127
          ansible_user: panxiao81
          etcd_address: 192.168.10.127
        etcd-pve1:
          ansible_host: 10.60.0.20
          etcd_address: 10.60.0.20
        etcd-pve2:
          ansible_host: 10.60.0.21
          etcd_address: 10.60.0.21
    # 由 Cinc（homelab_data::etcd）部署的成员，site.yml 不管。首次收敛后用 member-join.yml
    # 加入集群。ansible_host 用 lab 名：Cinc 的 known_hosts（infrastructure/chef/known_hosts）按名字记录。
    etcd_cinc:
      hosts:
        etcd-pve3:
          ansible_host: etcd-pve3.lab.ddupan.top
          etcd_address: 10.60.0.22
    etcd_pve:
      hosts:
        pve1:
          ansible_host: 192.168.10.4
          etcd_lxc_vmid: 150
          etcd_lxc_hostname: etcd-pve1
          etcd_lxc_address: 10.60.0.20/24
          etcd_lxc_memory: 1536
        pve2:
          ansible_host: 192.168.10.7
          etcd_lxc_vmid: 151
          etcd_lxc_hostname: etcd-pve2
          etcd_lxc_address: 10.60.0.21/24
          etcd_lxc_memory: 768
        # etcd-pve3 取代 etcd-laptop（#570）：只跑 etcd，不挂 PG 数据盘，由 Cinc 部署 etcd，
        # 因此不在上面的 etcd 组里（site.yml 只管现有三成员）。
        pve3:
          ansible_host: 192.168.10.9
          etcd_lxc_vmid: 152
          etcd_lxc_hostname: etcd-pve3
          etcd_lxc_address: 10.60.0.22/24
