---
# 把 Cinc 部署好的成员（etcd 组，运行时 -l 新成员）加入现有集群：member add --learner → 启动 → promote。
# 一次性的成员变更，所以不在 site.yml 里；对已加入的成员重跑只做只读检查，changed=0。
#
# 为什么是 learner：learner 不计入 quorum。直接 member add 会让 3 成员（quorum 2）立刻变成
# 4 成员（quorum 3），新成员起不来或追不上时再掉一个就丢 quorum，Patroni 随即降级 pg-prod 主库。
#
# 前提：节点已由 Cinc 收敛（证书、etcd.yml、unit 都在，unit 因没有数据目录和 join 标记而未启动）。
# 用节点自己的 admin 证书（CN=root，homelab_data::etcd 签发），控制端不持有任何 etcd 凭据。
#
#   ansible-playbook member-join.yml --check   # 只做发现与检查
#   ansible-playbook member-join.yml -l etcd-pve3
- name: 将 Cinc 管理的成员加入 shared etcd
  hosts: etcd
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    etcd_join_dir: /etc/homelab-etcd
    etcd_join_data_dir: /var/lib/homelab-etcd
    etcd_join_ctl: /opt/homelab-etcd/etcdctl
    etcd_join_peer_url: "https://{{ etcd_address }}:2380"
    # 只作发现入口：真正的成员与 endpoint 取自集群自己的 member list。
    etcd_join_seed: >-
      {{ groups['etcd'] | difference([inventory_hostname])
         | map('extract', hostvars, 'etcd_address')
         | map('regex_replace', '^(.*)$', 'https://\1:2379') | join(',') }}
  environment:
    ETCDCTL_CACERT: "{{ etcd_join_dir }}/ca.crt"
    ETCDCTL_CERT: "{{ etcd_join_dir }}/admin.crt"
    ETCDCTL_KEY: "{{ etcd_join_dir }}/admin.key"
  tasks:
    - name: 读取 Cinc 写的成员配置
      ansible.builtin.slurp:
        src: "{{ etcd_join_dir }}/etcd.yml"
      register: etcd_join_config_raw

    # 名字或 peer URL 不对时 member add 登记的成员永远等不到它；new 状态会另起一个集群。
    - name: 核对配置是加入现有集群的这个成员
      vars:
        etcd_join_config: "{{ etcd_join_config_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - etcd_join_config.name == inventory_hostname
          - etcd_join_config['initial-advertise-peer-urls'] == etcd_join_peer_url
          - etcd_join_config['initial-cluster-state'] == 'existing'
        fail_msg: "{{ etcd_join_dir }}/etcd.yml 与 inventory 不符；先核对 Cinc policy 的 homelab_data.etcd.members"
        quiet: true

    - name: 读取集群成员
      ansible.builtin.command:
        argv: ["{{ etcd_join_ctl }}", "--endpoints={{ etcd_join_seed }}", member, list, -w, json]
      register: etcd_join_list
      changed_when: false
      check_mode: false

    - name: 判断本成员状态
      vars:
        members: "{{ (etcd_join_list.stdout | from_json).members }}"
      ansible.builtin.set_fact:
        etcd_join_self: "{{ members | selectattr('peerURLs', 'contains', etcd_join_peer_url) | first | default({}) }}"
        # 已启动的投票成员；健康检查只看它们（learner 与未启动的成员没有可用 endpoint）。
        # isLearner/name 在 JSON 里是 omitempty：缺省即 false/未启动。
        etcd_join_voters: >-
          {%- set urls = [] -%}
          {%- for m in members if not (m.isLearner | default(false)) and (m.name | default('')) -%}
          {%- set _ = urls.extend(m.clientURLs) -%}
          {%- endfor -%}
          {{ urls | join(',') }}

    - name: 检查数据目录
      ansible.builtin.stat:
        path: "{{ etcd_join_data_dir }}/member"
      register: etcd_join_data

    # 不在集群里却有数据：多半是被 member remove 过的旧成员，以旧身份启动会被拒绝。
    # 是否清空数据目录要人判断，这里不做。
    - name: 不在集群中的成员不得带旧数据
      ansible.builtin.assert:
        that: etcd_join_self | length > 0 or not etcd_join_data.stat.exists
        fail_msg: "{{ inventory_hostname }} 不在 member list 中但 {{ etcd_join_data_dir }}/member 存在；确认后手动清空再重跑"
        quiet: true

    - name: 现有投票成员全部健康
      ansible.builtin.command:
        argv: ["{{ etcd_join_ctl }}", "--endpoints={{ etcd_join_voters }}", endpoint, health]
      changed_when: false
      check_mode: false

    - name: 以 learner 登记新成员
      ansible.builtin.command:
        argv:
          - "{{ etcd_join_ctl }}"
          - "--endpoints={{ etcd_join_voters }}"
          - member
          - add
          - "{{ inventory_hostname }}"
          - --learner
          - "--peer-urls={{ etcd_join_peer_url }}"
      when: etcd_join_self | length == 0
      changed_when: true

    # unit 只在有数据目录或 join 标记时启动（homelab_data::etcd 的 ConditionPathExists）。
    - name: 放置 join 标记
      ansible.builtin.file:
        path: "{{ etcd_join_dir }}/join"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      when: not etcd_join_data.stat.exists

    - name: 启动成员
      ansible.builtin.systemd_service:
        name: homelab-etcd
        state: started

    - name: 读取登记后的成员 ID
      ansible.builtin.command:
        argv: ["{{ etcd_join_ctl }}", "--endpoints={{ etcd_join_voters }}", member, list, -w, json]
      register: etcd_join_list_after
      changed_when: false
      check_mode: false

    - name: 记录本成员
      ansible.builtin.set_fact:
        etcd_join_self: >-
          {{ (etcd_join_list_after.stdout | from_json).members
             | selectattr('peerURLs', 'contains', etcd_join_peer_url) | first | default({}) }}

    # learner 追上 leader 之前 promote 会被拒绝（"can only promote a learner member which is in sync"），
    # 所以重试；数据量 MB 级，通常几秒。
    - name: 提升为投票成员
      ansible.builtin.command:
        argv:
          - "{{ etcd_join_ctl }}"
          - "--endpoints={{ etcd_join_voters }}"
          - member
          - promote
          - "{{ '%x' | format(etcd_join_self.ID) }}"
      register: etcd_join_promote
      until: etcd_join_promote.rc == 0
      retries: 24
      delay: 5
      when: etcd_join_self.isLearner | default(false)
      changed_when: true

    # 数据目录已存在后标记无用；留着的话数据目录被清空时 unit 仍会启动并反复失败。
    - name: 移除 join 标记
      ansible.builtin.file:
        path: "{{ etcd_join_dir }}/join"
        state: absent

    - name: 全部成员健康
      ansible.builtin.command:
        argv: ["{{ etcd_join_ctl }}", "--endpoints={{ etcd_join_seed }},https://{{ etcd_address }}:2379",
               endpoint, health, --cluster]
      register: etcd_join_health
      until: etcd_join_health.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      when: not ansible_check_mode

    - name: 查找已有快照
      ansible.builtin.find:
        paths: /var/backups/homelab-etcd
        patterns: "*.db"
      register: etcd_join_snapshots

    # 维护指标要求有快照；首个快照不等每天 03:20 的 timer。
    - name: 首个快照
      ansible.builtin.systemd_service:
        name: homelab-etcd-snapshot.service
        state: started
      when: etcd_join_snapshots.matched == 0
