# Ayatori 控制面 LXC（infrastructure/incus/terraform）；地址见该 root 的 main.tf。
all:
  vars:
    ansible_user: panxiao81
  children:
    dev:
      hosts:
        ayatori-dev:
          ansible_host: ayatori-dev.lab.ddupan.top
      vars:
        ayatori_environment: dev
        ayatori_gitops:
          url: https://git.ddupan.top/panxiao81/homelab-infra.git
          path: ./clusters/ayatori-dev
        ayatori_postgresql_instance:
          name: homelab-dev
          host: pg-dev.lab.ddupan.top
          hostaddr: 192.168.10.127
          port: 5433
        # LoadBalancerHost 由部署 role 按 hosts 生成；VIP 池见 infrastructure/network/ipam.yml。
        # agent_url 是 lb-agent 的 metricsAddress（cookbooks homelab_loadbalancer），manager 要能访问到。
        ayatori_loadbalancer:
          address_pool: 10.62.1.0/24
          hosts:
            - name: lb-dev-1
              data_plane_url: https://lb-dev-1.lab.ddupan.top:5555
              agent_url: http://lb-dev-1.lab.ddupan.top:9641
            - name: lb-dev-2
              data_plane_url: https://lb-dev-2.lab.ddupan.top:5555
              agent_url: http://lb-dev-2.lab.ddupan.top:9641
    prod:
      hosts:
        ayatori-prod:
          ansible_host: ayatori-prod.lab.ddupan.top
      vars:
        ayatori_environment: prod
        ayatori_gitops:
          url: https://git.ddupan.top/panxiao81/homelab-infra.git
          path: ./clusters/ayatori-prod
        ayatori_postgresql_instance:
          name: homelab-prod
          host: pg-prod.lab.ddupan.top
          hostaddr: 192.168.10.2
          port: 5432
