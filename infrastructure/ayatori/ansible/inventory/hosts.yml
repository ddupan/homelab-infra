# Ayatori 控制面 LXC（infrastructure/incus/terraform）；地址见该 root 的 main.tf。
# dev 已迁入 Chef（infrastructure/chef/policies/ayatori-dev.rb）；prod 迁移前仍由本 play 部署。
all:
  vars:
    ansible_user: panxiao81
  children:
    prod:
      hosts:
        ayatori-prod:
          ansible_host: ayatori-prod.lab.ddupan.top
      vars:
        ayatori_environment: prod
        ayatori_gitops:
          url: https://git.ddupan.top/panxiao81/homelab-infra.git
          path: ./clusters/ayatori-prod
        ayatori_postgresql_instance:
          name: homelab-prod
          host: pg-prod.lab.ddupan.top
          hostaddr: 192.168.10.2
          port: 5432
