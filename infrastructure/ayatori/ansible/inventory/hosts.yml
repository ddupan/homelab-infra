# Ayatori 控制面 LXC（infrastructure/incus/terraform）；地址见该 root 的 main.tf。
# dev 已迁入 Chef（infrastructure/chef/policies/ayatori-dev.rb）；prod 迁移前仍由本 play 部署。
all:
  vars:
    ansible_user: panxiao81
  children:
    prod:
      hosts:
        ayatori-prod:
          ansible_host: ayatori-prod.lab.ddupan.top
      vars:
        ayatori_environment: prod
        ayatori_gitops:
          url: https://git.ddupan.top/panxiao81/homelab-infra.git
          path: ./clusters/ayatori-prod
        ayatori_postgresql_instance:
          name: homelab-prod
          host: pg-prod.lab.ddupan.top
          hostaddr: 192.168.10.2
          port: 5432
        # 同 dev：LoadBalancerHost 由部署 role 按 hosts 生成；VIP 池见 infrastructure/network/ipam.yml，
        # Hostname 写入 lb-zones.tf 创建的 zone。
        ayatori_loadbalancer:
          address_pool: 10.62.0.0/24
          hosts:
            - name: lb-prod-1
              data_plane_url: https://lb-prod-1.lab.ddupan.top:5555
              agent_url: http://lb-prod-1.lab.ddupan.top:9641
            - name: lb-prod-2
              data_plane_url: https://lb-prod-2.lab.ddupan.top:5555
              agent_url: http://lb-prod-2.lab.ddupan.top:9641
          dns:
            url: http://192.168.10.127:8053
            zone: lb.lab.ddupan.top
