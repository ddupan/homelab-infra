---
# incus.ad.ddupan.top is registered here, by the stack that creates Incus, not in
# samba-ad's list. ayatori-* moved to lab.ddupan.top (incus Terraform).
- name: 仅协调 Incus 的 AD DNS 记录
  hosts: samba_dc
  become: true
  gather_facts: false
  vars_files:
    - ../../samba-ad/ansible/group_vars/all/vars.yml
  tasks:
    - name: 协调 A 记录
      ddupan.homelab.samba_dns_record:
        server: "{{ samba_ad_dc_ip }}"
        zone: ad.ddupan.top
        name: incus
        type: A
        values: [192.168.10.127]
        state: present
        exact: true
