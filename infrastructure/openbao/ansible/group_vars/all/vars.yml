---
# Non-secret variables for the OpenBao deploy. EDIT to your environment.
# Secrets (transit unseal token) live in group_vars/all/vault.yml — see vault.example.yml.

# --- Release (pinned + checksum-verified) ---
# Renovate bumps the version and .gitea/renovate/update-checksums.mjs re-pins every sha256
# under a `# checksum-from:` marker from the release's own checksums file.
# renovate: datasource=github-releases depName=openbao/openbao
openbao_version: "2.7.2"
# checksum-from: https://github.com/openbao/openbao/releases/download/v{version}/checksums.txt openbao_{version}_linux_amd64.tar.gz
openbao_download_checksum: "sha256:582b1f3c2fdc5afd443b2d57a225ef654de75adea609fdb66731fd582a9cbc96"

# pkcs11 KMS plugin (README "TPM seal"). The binary sha256 is what bao re-verifies before exec.
# renovate: datasource=github-releases depName=openbao/openbao-plugins
openbao_pkcs11_plugin_version: "0.3.0"
# checksum-from: https://github.com/openbao/openbao-plugins/releases/download/kms-pkcs11-v{version}/checksums-kms-pkcs11.txt openbao-plugin-kms-pkcs11_linux_amd64_v1.tar.gz
openbao_pkcs11_plugin_checksum: "sha256:c112c670e1bcca7a7b7625b13c0ecf1a43a62cd2651d29bf23befb2ad47c49bf"
# checksum-from: https://github.com/openbao/openbao-plugins/releases/download/kms-pkcs11-v{version}/checksums-kms-pkcs11.txt openbao-plugin-kms-pkcs11_linux_amd64_v1
openbao_pkcs11_plugin_sha256: "96fefa80e721551725ea01be79b0dae0f3951f15f01291fd87846d5e45475be6"
openbao_pkcs11_seal: true

# --- Identity / addresses ---
openbao_fqdn: "bao.ad.ddupan.top"       # A record on the Samba DC (ad.ddupan.top zone)
openbao_lan_ip: "192.168.10.8"          # bao's LAN IP — pods use this; also the VM's static IP

# --- Optional host firewall ---
# Restrict the API/cluster ports to tailnet + cluster once you're ready (needs ufw).
openbao_manage_firewall: false
openbao_allowed_cidrs:
  - "100.64.0.0/10"       # Tailscale CGNAT range (remote humans + laptop agent)
  - "192.168.10.0/24"     # LAN / k8s cluster

# --- Auto-unseal (transit) ---
# Leave OFF for the first init so you do a normal Shamir init (keys handed to you).
# Turn ON once a second bao/transit source exists, then supply the token from vault
# and re-run the play (a restart re-reads config; auto-unseal makes restarts hands-off).
openbao_auto_unseal: false
openbao_transit_address: "https://bao-seal.ddupan.top:8200"
openbao_transit_key_name: "autounseal"
openbao_transit_mount_path: "transit/"
openbao_transit_token: "{{ vault_openbao_transit_token | default('') }}"
