---
# Non-secret variables for the OpenBao deploy. EDIT to your environment.
# Secrets (transit unseal token) live in group_vars/all/vault.yml — see vault.example.yml.

# --- Release (pinned + checksum-verified) ---
# `# renovate-attachment:` (renovate.json): Renovate bumps the release tag on the next line and
# re-pins the sha256 below it from that release's own checksums file (github-release-attachments
# datasource). The value must be the exact git tag; the bare version is derived from it.
# renovate-attachment: depName=openbao/openbao
openbao_release: "v2.7.3"
openbao_download_checksum: "sha256:131df9a21cf3dd2dff47107110b369c9974cbdaa482bcbc723b81b3403c68ecd"
openbao_version: "{{ openbao_release | regex_replace('^v', '') }}"

# pkcs11 KMS plugin (README "TPM seal"). The binary sha256 is what bao re-verifies before exec.
# renovate-attachment: depName=openbao/openbao-plugins versioning=regex:^kms-pkcs11-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
openbao_pkcs11_plugin_release: "kms-pkcs11-v0.4.0"
openbao_pkcs11_plugin_checksum: "sha256:b528c7c65ff7a0420ab6e6ac39b7a4ab189167cfeff7e9332c0f71bc142694ba"
# The binary inside that tarball. Renovate tracks one digest per dependency, so its release tag is
# repeated here (Renovate bumps both in the same PR; the openbao role asserts they are equal).
# renovate-attachment: depName=openbao/openbao-plugins versioning=regex:^kms-pkcs11-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
openbao_pkcs11_plugin_binary_release: "kms-pkcs11-v0.4.0"
openbao_pkcs11_plugin_sha256: "c194ad7253ea909362f35e986da06d0a396c2c79aa67ac8e7599a62f195aae0c"
openbao_pkcs11_plugin_version: "{{ openbao_pkcs11_plugin_release | regex_replace('^kms-pkcs11-v', '') }}"
openbao_pkcs11_seal: true

# --- Identity / addresses ---
openbao_fqdn: "bao.ad.ddupan.top"       # A record on the Samba DC (ad.ddupan.top zone)
openbao_lan_ip: "192.168.10.8"          # bao's LAN IP — pods use this; also the VM's static IP

# --- Optional host firewall ---
# Restrict the API/cluster ports to tailnet + cluster once you're ready (needs ufw).
openbao_manage_firewall: false
openbao_allowed_cidrs:
  - "100.64.0.0/10"       # Tailscale CGNAT range (remote humans + laptop agent)
  - "192.168.10.0/24"     # LAN / k8s cluster

# --- Auto-unseal (transit) ---
# Leave OFF for the first init so you do a normal Shamir init (keys handed to you).
# Turn ON once a second bao/transit source exists, then supply the token from vault
# and re-run the play (a restart re-reads config; auto-unseal makes restarts hands-off).
openbao_auto_unseal: false
openbao_transit_address: "https://bao-seal.ddupan.top:8200"
openbao_transit_key_name: "autounseal"
openbao_transit_mount_path: "transit/"
openbao_transit_token: "{{ vault_openbao_transit_token | default('') }}"
