---
# Create the OpenBao VM on the local libvirt host. Idempotent: if the domain already
# exists it does nothing. Run on localhost with qemu:///system (become: true).

- name: Resolve the SSH public key to inject
  ansible.builtin.set_fact:
    bao_vm_ssh_pubkey: "{{ lookup('file', bao_vm_ssh_pubkey_file | expanduser) }}"

- name: Fail early if no usable public key
  ansible.builtin.assert:
    that:
      - bao_vm_ssh_pubkey is search('^ssh-')
    fail_msg: >-
      No SSH public key at {{ bao_vm_ssh_pubkey_file }}. Generate one
      (ssh-keygen -t ed25519) or set bao_vm_ssh_pubkey_file.

- name: Check whether the libvirt domain already exists
  ansible.builtin.command: "virsh dominfo {{ bao_vm_name }}"
  register: bao_vm_dominfo
  changed_when: false
  failed_when: false
  check_mode: false

# virt-aa-helper does not add a passthrough TPM to the per-domain AppArmor profile, so
# QEMU's I/O on the fd libvirt hands it is refused and the domain fails to start with
# "'/dev/fdset/0' is not a TPM device" (verified 2026-10-11: starts fine with seclabel
# none or as bare QEMU). The libvirt-qemu.d drop-in dir is the supported extension point;
# it is read when a domain's profile is generated, i.e. at its next start.
- name: Allow QEMU to use the passthrough TPM under AppArmor
  when: bao_vm_tpm_passthrough
  block:
    - name: Ensure the libvirt-qemu abstraction drop-in directory exists
      ansible.builtin.file:
        path: /etc/apparmor.d/abstractions/libvirt-qemu.d
        state: directory
        mode: "0755"

    - name: Grant the TPM device in the libvirt-qemu abstraction
      ansible.builtin.copy:
        dest: /etc/apparmor.d/abstractions/libvirt-qemu.d/tpm-passthrough
        mode: "0644"
        content: |
          # Managed by Ansible (openbao bao_vm role): TPM passthrough for {{ bao_vm_name }}.
          {{ bao_vm_tpm_device }} rw,

- name: Create the VM
  when: bao_vm_dominfo.rc != 0
  block:
    - name: Ensure image directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0711"
      loop:
        - "{{ bao_vm_images_dir }}"
        - "{{ bao_vm_images_dir }}/base"

    - name: Download the Ubuntu cloud image (once)
      ansible.builtin.get_url:
        url: "{{ bao_vm_image_url }}"
        dest: "{{ bao_vm_images_dir }}/base/{{ bao_vm_image_url | basename }}"
        mode: "0644"

    - name: Check whether the root-disk zvol already exists
      ansible.builtin.command: "zfs list -H -o name {{ bao_vm_zvol }}"
      register: bao_vm_zvol_check
      changed_when: false
      failed_when: false

    - name: Create the root-disk zvol
      ansible.builtin.command:
        cmd: >-
          zfs create {{ '-s ' if bao_vm_zvol_sparse else '' }}-V {{ bao_vm_disk_gb }}G
          -o volblocksize={{ bao_vm_zvol_volblocksize }}
          {{ bao_vm_zvol }}
      when: bao_vm_zvol_check.rc != 0

    - name: Wait for the zvol device node to appear
      ansible.builtin.wait_for:
        path: "{{ bao_vm_zvol_dev }}"
        timeout: 30
      when: bao_vm_zvol_check.rc != 0

    - name: Write the cloud image into the zvol (raw)
      ansible.builtin.command:
        cmd: >-
          qemu-img convert -O raw
          {{ bao_vm_images_dir }}/base/{{ bao_vm_image_url | basename }}
          {{ bao_vm_zvol_dev }}
      when: bao_vm_zvol_check.rc != 0
      # cloud-init growpart expands the rootfs to fill the zvol on first boot.

    - name: Render the cloud-init seed files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed-{{ item }}"
        mode: "0644"
      loop:
        - user-data
        - meta-data
        - network-config

    - name: Build the NoCloud seed ISO
      ansible.builtin.command:
        cmd: >-
          genisoimage -output {{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed.iso
          -volid cidata -joliet -rock
          -graft-points
          user-data={{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed-user-data
          meta-data={{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed-meta-data
          network-config={{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed-network-config
      args:
        creates: "{{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed.iso"

    - name: Define and start the domain (cloud-init imports the disk)
      ansible.builtin.command:
        cmd: >-
          virt-install
          --name {{ bao_vm_name }}
          --memory {{ bao_vm_memory_mb }}
          --vcpus {{ bao_vm_vcpus }}
          --osinfo require=off,name={{ bao_vm_osinfo }}
          --disk path={{ bao_vm_zvol_dev }},format=raw,bus=virtio
          --disk path={{ bao_vm_images_dir }}/{{ bao_vm_name }}-seed.iso,device=cdrom
          --network bridge={{ bao_vm_bridge }},model=virtio
          --graphics none --noautoconsole --import
          {{ '--tpm backend.type=passthrough,backend.device.path=' ~ bao_vm_tpm_device ~ ',model=tpm-crb'
             if bao_vm_tpm_passthrough else '' }}
      register: virt_install
      changed_when: true

# The create block only runs for a new domain, so an existing one is reconciled here.
# virt-xml edits the persistent definition only; a running guest keeps its current
# hardware until it is powered off and started again (a guest reboot is not enough).
- name: Read the persistent domain definition
  ansible.builtin.command: "virsh dumpxml --inactive {{ bao_vm_name }}"
  register: bao_vm_xml
  changed_when: false
  check_mode: false
  when: bao_vm_tpm_passthrough

- name: Add the passthrough TPM to the existing domain
  ansible.builtin.command:
    cmd: >-
      virt-xml {{ bao_vm_name }} --add-device
      --tpm backend.type=passthrough,backend.device.path={{ bao_vm_tpm_device }},model=tpm-crb
  when:
    - bao_vm_tpm_passthrough
    - "'<tpm ' not in bao_vm_xml.stdout"
  changed_when: true

- name: Wait for SSH on the new bao host
  ansible.builtin.wait_for:
    host: "{{ bao_vm_ip }}"
    port: 22
    delay: 10
    timeout: 300
  when: bao_vm_dominfo.rc != 0

# Without this the domain stays off after a host reboot: libvirt-guests here runs with the
# Debian defaults (ON_SHUTDOWN=shutdown, ON_BOOT=ignore), so only libvirt autostart brings
# it back. All three lab VMs were found with autostart disabled on 2026-10-11.
- name: Read the domain's autostart flag
  ansible.builtin.command: "virsh dominfo {{ bao_vm_name }}"
  register: bao_vm_autostart
  changed_when: false
  failed_when: false   # a domain only created later in this run is absent in check mode
  check_mode: false

- name: Start the domain with the host
  ansible.builtin.command: "virsh autostart {{ bao_vm_name }}"
  when: bao_vm_autostart.stdout is not search('Autostart:\\s+enable')
  changed_when: true
