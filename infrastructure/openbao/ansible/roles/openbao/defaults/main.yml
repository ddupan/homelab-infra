---
# openbao role defaults — override in group_vars/host_vars.
# Secrets (openbao_transit_token) MUST come from an Ansible Vault file, not here.

# --- Release ---
# renovate: datasource=github-releases depName=openbao/openbao
openbao_version: "2.7.3"
openbao_download_checksum: ""           # "sha256:..."  REQUIRED — set in group_vars
openbao_download_url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.tar.gz"

# --- Service account ---
openbao_user: "openbao"
openbao_group: "openbao"

# --- Paths ---
openbao_bin: "/usr/local/bin/bao"
openbao_config_dir: "/etc/openbao"
openbao_tls_dir: "/etc/openbao/tls"
openbao_data_dir: "/opt/openbao/data"   # integrated Raft storage

# --- Identity / addresses ---
openbao_fqdn: "bao.example.com"
openbao_lan_ip: "10.10.10.10"
openbao_api_port: 8200
openbao_cluster_port: 8201
openbao_ui: true
openbao_node_id: "{{ ansible_facts['hostname'] }}"

# Listener binds all interfaces; lock it down with the firewall vars below.
openbao_listen_address: "0.0.0.0:{{ openbao_api_port }}"
openbao_api_addr: "https://{{ openbao_lan_ip }}:{{ openbao_api_port }}"
openbao_cluster_addr: "https://{{ openbao_lan_ip }}:{{ openbao_cluster_port }}"

# SANs for the bootstrap self-signed listener cert (replace with PKI-issued later).
openbao_tls_sans:
  - "DNS:{{ openbao_fqdn }}"
  - "IP:{{ openbao_lan_ip }}"
  - "IP:127.0.0.1"

# --- Auto-unseal (transit) — off by default (Shamir manual unseal on first init) ---
openbao_auto_unseal: false
openbao_transit_address: ""
openbao_transit_token: ""
openbao_transit_key_name: "autounseal"
openbao_transit_mount_path: "transit/"

# --- Auto-unseal (pkcs11 on bao1's passthrough TPM) — README "TPM seal" ---
# The key is created by tpm-seal.yml (one-way: escrowed to the YubiKey, then imported
# into the TPM via tpm2-pkcs11). Turning this on with a Shamir-sealed node starts a seal
# MIGRATION on the next restart (unseal with MIGRATE=1 ../unseal.sh).
openbao_pkcs11_seal: false
# Rollback: true renders `disabled = "true"`, i.e. migrate back to Shamir.
openbao_pkcs11_seal_disabled: false
# Not writable by openbao: bao executes whatever sits here.
openbao_plugin_dir: "/opt/openbao/plugins"
# renovate: datasource=github-releases depName=openbao/openbao-plugins
openbao_pkcs11_plugin_version: "0.3.0"
openbao_pkcs11_plugin_url: "https://github.com/openbao/openbao-plugins/releases/download/kms-pkcs11-v{{ openbao_pkcs11_plugin_version }}/openbao-plugin-kms-pkcs11_linux_amd64_v1.tar.gz"
openbao_pkcs11_plugin_checksum: ""      # "sha256:..." of the tarball — set in group_vars
openbao_pkcs11_plugin_sha256: ""        # sha256 of the extracted BINARY (what bao verifies)
openbao_pkcs11_lib: "/usr/lib/x86_64-linux-gnu/pkcs11/libtpm2_pkcs11.so"   # no .so.1 in this dir
openbao_pkcs11_store: "/opt/openbao/tpm2-pkcs11"   # sqlite of TPM-wrapped blobs; useless off this TPM
openbao_pkcs11_token_label: "openbao"
openbao_pkcs11_key_label: "bao-seal"
openbao_pkcs11_pin_file: "{{ openbao_config_dir }}/pkcs11-pin"
openbao_pkcs11_escrow_recipient: "5A6A04D1B216C64E!"   # YubiKey [E] subkey, like .vault_pass.gpg
openbao_pkcs11_escrow_pubkey: "escrow-recipient.asc"   # role files/ (or an absolute path, for rehearsals)
# Recovery: path ON bao1 of the decrypted escrow PEM to import instead of minting a key.
openbao_pkcs11_import_key: ""
openbao_pkcs11_escrow_dest: "{{ playbook_dir }}/../tpm-seal-key.gpg"

# false opens /sys/generate-root, the only way to turn the recovery key into a root token
# (closed by default since 2.5.3). Anyone can cancel an attempt there, so set it only for
# the recovery itself, then set it back.
openbao_disable_unauthed_generate_root: true

# --- Optional host firewall ---
openbao_manage_firewall: false
openbao_allowed_cidrs:
  - "100.64.0.0/10"

# 30 秒采集间隔下保留五分钟，指标端点继续要求鉴权。
openbao_prometheus_retention_time: "5m"
