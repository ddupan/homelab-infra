---
- name: Ensure the snapshot output directory exists
  ansible.builtin.file:
    path: "{{ openbao_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the snapshot script
  ansible.builtin.template:
    src: bao-snapshot.sh.j2
    dest: /usr/local/bin/bao-snapshot.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the off-site upload script
  ansible.builtin.template:
    src: bao-snapshot-offsite.sh.j2
    dest: /usr/local/bin/bao-snapshot-offsite.sh
    owner: root
    group: root
    mode: "0755"

- name: Store the OCI upload credentials (root-only)
  ansible.builtin.copy:
    content: |
      user = "{{ vault_openbao_snapshot_oci_access_key }}:{{ vault_openbao_snapshot_oci_secret_key }}"
    dest: "{{ openbao_snapshot_offsite_credentials }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the snapshot systemd service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - openbao-snapshot.service
    - openbao-snapshot.timer

- name: Enable and start the snapshot timer
  ansible.builtin.systemd:
    name: openbao-snapshot.timer
    state: started
    enabled: true
    daemon_reload: true
