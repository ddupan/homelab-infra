---
# Inventory for the OpenBao root-of-trust host.
# A single dedicated VM/host on the LAN (like the Samba DC) — NOT in the k8s cluster.
all:
  children:
    openbao:
      hosts:
        bao1:
          ansible_host: 192.168.10.8     # bao's static LAN IP — match openbao_lan_ip
          ansible_user: ansible          # cloud-init / provisioning user with sudo

    # Root-managed hosts that should trust bao's SSH user CA (TrustedUserCAKeys).
    # Add any node you want agents to reach with signed certs.
    ssh_ca_trust:
      hosts:
        bao1: {}                         # bao itself (connection vars from the openbao group)
        # dc1 (Samba AD DC) moved to Cinc: homelab_base's ssh_ca_trust owns it now.
        laptop:
          ansible_connection: local      # this machine (192.168.10.127), passwordless sudo
          ansible_host: 127.0.0.1
        # PVE nodes. The sandbox_lxc role (infrastructure/sandbox-cluster) edits
        # /etc/pve/lxc/*.conf over root ssh; with only the operator's key, agents could not
        # apply even a one-line LXC change (#871). Root here is root on the hypervisor.
        pve1:
          ansible_host: 192.168.10.4
          ansible_user: root
        pve2:
          ansible_host: 192.168.10.7
          ansible_user: root
        pve3:
          ansible_host: 192.168.10.9
          ansible_user: root
        # Sandbox k3s LXCs (infrastructure/sandbox-cluster/). Agents operate them
        # with 5-minute certs instead of the operator's long-lived root key.
        sandbox1:
          ansible_host: 10.60.0.11
          ansible_user: root
        sandbox2:
          ansible_host: 10.60.0.12
          ansible_user: root
        # OCI A1 host (Gitea). Agents need it to set up spire-agent and Renovate (#642). Login
        # is as ubuntu (passwordless sudo), so agent certs use principal ubuntu.
        # Reached over the LAN↔OCI route on its private IP; known_hosts has the key under the
        # public name, hence HostKeyAlias.
        oci_arm:
          ansible_host: 10.0.0.124
          ansible_user: ubuntu
          ansible_ssh_common_args: -o HostKeyAlias=oci-arm.ddupan.top
        # OCI AMD (WireGuard/BGP to VyOS, DN42). By public name, not 10.0.0.158: the private path runs
        # through this very host's tunnel, so it must stay reachable when the tunnel is what broke.
        oci_amd:
          ansible_host: oci-amd.ddupan.top
          ansible_user: ubuntu
