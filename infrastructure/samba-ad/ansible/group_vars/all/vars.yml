---
# Non-secret variables shared by all plays. EDIT THESE to your environment.
# Secrets live in group_vars/vault.yml (encrypted) — see vault.example.yml.

# --- Domain identity (used by both the DC and the Windows join) ---
samba_ad_realm: "AD.DDUPAN.TOP"
samba_ad_domain: "DDUPAN"
samba_ad_dc_hostname: "dc1"
samba_ad_dc_ip: "192.168.10.5"
samba_ad_dns_forwarder: "192.168.10.127"   # Blocky：DN42 条件转发及公网解析
samba_ad_reverse_zone: "10.168.192.in-addr.arpa"   # reverse of 192.168.10.0/24

# Static AD DNS records: group_vars/all/dns.yml.

# Support legacy clients (Win9x/NT4/2000/XP)? INSECURE — see README "Retro clients".
samba_ad_legacy_clients: false

# --- KMS auto-activation via DNS ---
# Adds a _vlmcs._tcp SRV record so any domain-joined Windows self-activates against
# vlmcsd. Set the IP where vlmcsd listens (:1688); empty string disables.
samba_ad_kms_host_ip: "192.168.10.127"    # vlmcsd runs here (docker, 0.0.0.0:1688)
samba_ad_kms_hostname: "kms"              # A record kms.ad.ddupan.top -> that IP
samba_ad_kms_port: 1688

# --- Windows admin box ---
win_dc_ip: "{{ samba_ad_dc_ip }}"
win_domain_dns_name: "{{ samba_ad_realm | lower }}"
win_domain_admin_user: "{{ samba_ad_domain }}\\Administrator"
win_kms_host: ""                       # e.g. "kms.example.com:1688" (existing vlmcsd)
win_kms_client_key: ""                 # public GVLK for the Windows edition

# --- Secret indirection: real values come from the encrypted vault ---
samba_ad_admin_password: "{{ vault_samba_ad_admin_password }}"
win_domain_admin_password: "{{ vault_samba_ad_admin_password }}"

# --- Service accounts for apps that BIND to LDAP (passwords in vault.yml) ---
# The first (svc-authelia, for the since-retired Authelia) was made by hand; codified so
# a DC rebuild restores them.
samba_ad_service_accounts:
  - name: svc-pve
    password: "{{ vault_pve_bind_password }}"
    description: "Proxmox VE realm bind + user/group sync (read-only)"
  # Same value as PA_LDAP_BIND_PASSWORD in bao kv/k8s/poweradmin — rotate both.
  - name: svc-poweradmin
    password: "{{ vault_poweradmin_bind_password }}"
    description: "Poweradmin LDAP bind: looks up the login user, then binds as them (read-only)"
  # bao_path instead of password: the play generates the password on creation and keeps it only in Bao, where the
  # consumer's ExternalSecret reads it (username = UPN). Nothing to copy by hand, nothing to rotate in two places.
  - name: svc-iam-login
    bao_path: k8s/iam-login-ldap
    description: "iam-login: reads users and groups when they are not signing in (read-only)"

# Where bao_path accounts keep their passwords. The play needs VAULT_TOKEN with create/read on those paths.
samba_ad_bao_url: https://bao.lab.ddupan.top:8200
samba_ad_bao_kv_mount: kv

# --- Groups used for RBAC by downstream apps ---
# NOTE: PVE renames synced groups to "<name>-<realm>", so platform-admins becomes
# "platform-admins-ad" inside Proxmox. Grant ACLs to THAT name, not this one.
samba_ad_groups:
  # The one administrator group of the platform: apps grant their admin role to it (iam-login groups claim,
  # LDAP filters, PVE ACL, Incus scriptlet) instead of each keeping its own group. iam-login releases direct
  # memberships only, so administrators are direct members. It replaced the per-app groups (pve-admins,
  # gitea-admins, dns-admins, vault-admins; retired 2026-10-09). AD's own Domain/Enterprise Admins stay for
  # administering the domain itself. Poweradmin's LDAP filter matches this DN: a rename breaks its logins.
  # Keep at least one human administrator independent of each app's local break-glass account.
  - name: platform-admins
    members: [panxiao81]

  # Who may log in to AD-joined workstations (SSSD simple_allow_groups).
  # NESTING DIRECTION MATTERS: platform-admins is a MEMBER OF this group, so admins
  # get lab access. The reverse (this group inside platform-admins) would hand every
  # lab user Proxmox Administrator on / — see the ACL in proxmox/ansible.
  - name: retrolab-users
    members: [platform-admins]
