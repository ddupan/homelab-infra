---
# 每日 samba-tool domain backup offline → 本地留 N 份 + GPG 加密给 YubiKey 后 curl 传 OCI。幂等。
# 与 pg-prod 异地 dump、laptop 的 k3s 备份同一套做法：上传方解不开自己的备份，也没有密码要保管。

- name: Install backup tools
  ansible.builtin.apt:
    name: [gnupg, curl]
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  register: _backup_apt
  retries: 3
  delay: 10
  until: _backup_apt is succeeded

- name: Create the backup and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: ["{{ samba_ad_backup_dir }}", "{{ samba_ad_backup_conf_dir }}"]

- name: Install the YubiKey encryption public key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../openbao/ansible/roles/openbao/files/escrow-recipient.asc"
    dest: "{{ samba_ad_backup_conf_dir }}/escrow-recipient.asc"
    owner: root
    group: root
    mode: "0644"

- name: Read the upload key from Bao
  community.hashi_vault.vault_kv2_get:
    url: "{{ samba_ad_bao_url }}"
    engine_mount_point: "{{ samba_ad_bao_kv_mount }}"
    path: "{{ samba_ad_backup_bao_path }}"
    auth_method: token
  delegate_to: localhost
  become: false
  register: _backup_bao
  check_mode: false
  no_log: true

- name: Check that the upload key is present
  ansible.builtin.assert:
    that: _backup_bao.secret[item] | default('') | length > 0
    fail_msg: "kv/{{ samba_ad_backup_bao_path }} 缺 {{ item }}，步骤见 infrastructure/samba-ad/README.md 的 Backups。"
    quiet: true
  loop: [oci_access_key, oci_secret_key]

# curl --config 文件：凭据不进 argv。diff: false / no_log：--diff 会把它打到终端和日志里。
- name: Write the upload credentials
  ansible.builtin.copy:
    dest: "{{ samba_ad_backup_conf_dir }}/offsite.curl"
    content: |
      user = "{{ _backup_bao.secret.oci_access_key }}:{{ _backup_bao.secret.oci_secret_key }}"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true

# rclone crypt 时期（#730）留下的东西。dc1 上清掉后可以删除这两个任务。
- name: Remove the rclone-era credentials file
  ansible.builtin.file:
    path: /etc/samba-backup.env
    state: absent

- name: Remove rclone
  ansible.builtin.apt:
    name: rclone
    state: absent

- name: Install the backup script
  ansible.builtin.template:
    src: samba-backup.sh.j2
    dest: /usr/local/bin/samba-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the backup service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [samba-backup.service, samba-backup.timer]
  register: _backup_units

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: samba-backup.timer
    daemon_reload: "{{ _backup_units is changed }}"
    enabled: true
    state: started
  # 首次 --check 时 unit 文件并没有真的写下去，systemd 找不到它会让整个 check 失败。
  when: not (ansible_check_mode and _backup_units is changed)
