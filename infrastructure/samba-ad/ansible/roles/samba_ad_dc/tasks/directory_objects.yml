---
# Service accounts + RBAC groups that downstream apps depend on.
# Codified because service accounts used to be created by hand (svc-authelia, for
# the since-retired Authelia), which means a DC rebuild would silently lose every
# app's ability to bind.

# --- Passwords of bao_path accounts live only in Bao ------------------------------
# Absent in Bao + absent in AD = a new account: generate, store in Bao FIRST, then create, so a failed create is
# simply retried with the stored value. Present in AD but absent in Bao is refused: the password cannot be read
# back from AD, and generating a new one would leave Bao and AD disagreeing.
- name: Read Bao-held service-account passwords
  community.hashi_vault.vault_kv2_get:
    url: "{{ samba_ad_bao_url }}"
    engine_mount_point: "{{ samba_ad_bao_kv_mount }}"
    path: "{{ item.bao_path }}"
    auth_method: token
  loop: "{{ _svc_bao_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _svc_bao_accounts: "{{ samba_ad_service_accounts | default([]) | selectattr('bao_path', 'defined') | list }}"
  delegate_to: localhost
  become: false
  register: _svc_bao
  failed_when: false    # "not there yet" is expected; a missing token shows up as "exists but not in Bao" below
  check_mode: false
  no_log: true

- name: Check which Bao-held accounts already exist in AD
  ansible.builtin.command:
    argv: [samba-tool, user, show, "{{ item.item.name }}", --attributes=sAMAccountName]
  loop: "{{ _svc_bao.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: _svc_existing
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse an existing account whose password Bao does not hold
  ansible.builtin.fail:
    msg: >-
      {{ item.0.item.name }} exists in AD but {{ samba_ad_bao_kv_mount }}/{{ item.0.item.bao_path }} has no
      password (missing, or VAULT_TOKEN cannot read it). To rotate: set a new password with
      `samba-tool user setpassword`, write it there as username/password, then re-run.
  loop: "{{ _svc_bao.results | zip(_svc_existing.results) | list }}"
  loop_control:
    label: "{{ item.0.item.name }}"
  when: item.1.rc == 0 and item.0.secret is not defined

- name: Generate and store passwords for new Bao-held accounts
  community.hashi_vault.vault_kv2_write:
    url: "{{ samba_ad_bao_url }}"
    engine_mount_point: "{{ samba_ad_bao_kv_mount }}"
    path: "{{ item.item.bao_path }}"
    auth_method: token
    data:
      username: "{{ item.item.name }}@{{ samba_ad_realm | lower }}"
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
  loop: "{{ _svc_bao.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.secret is not defined and not ansible_check_mode
  delegate_to: localhost
  become: false
  no_log: true

- name: Read them back for account creation
  community.hashi_vault.vault_kv2_get:
    url: "{{ samba_ad_bao_url }}"
    engine_mount_point: "{{ samba_ad_bao_kv_mount }}"
    path: "{{ item.item.bao_path }}"
    auth_method: token
  loop: "{{ _svc_bao.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  delegate_to: localhost
  become: false
  register: _svc_bao_final
  failed_when: false    # in check mode a new account has nothing stored yet; creation is skipped there anyway
  check_mode: false
  no_log: true

- name: Collect Bao-held passwords
  ansible.builtin.set_fact:
    _svc_bao_passwords: >-
      {{ dict(_svc_bao_final.results | map(attribute='item.item.name')
         | zip(_svc_bao_final.results | map(attribute='secret', default={}) | map(attribute='password', default=''))) }}
  no_log: true

- name: Create service accounts
  ansible.builtin.command:
    argv:
      - samba-tool
      - user
      - create
      - "{{ item.name }}"
      - "{{ item.password if item.password is defined else _svc_bao_passwords[item.name] }}"
      - "--description={{ item.description | default('') }}"
  loop: "{{ samba_ad_service_accounts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _svc_create
  # Samba 4.x says "User '<name>' added successfully"; older releases said "created".
  changed_when: "(_svc_create.stdout | default('')) is search('(added|created) successfully')"
  failed_when:
    - _svc_create.rc != 0
    - "'already exists' not in (_svc_create.stdout | default('') + _svc_create.stderr | default(''))"
  no_log: true          # passwords are on the argv

- name: Make service-account passwords non-expiring
  # A bind account whose password silently expires takes the dependent app down
  # with it, with no obvious cause. These are long random secrets held in Bao.
  # Only when not already so (DONT_EXPIRE_PASSWORD 0x10000 set, accountExpires
  # 0/never); setexpiry itself always succeeds, which would make every run "changed".
  ansible.builtin.shell:
    cmd: |
      set -eu
      attrs=$(samba-tool user show {{ item.name | quote }} --attributes=userAccountControl,accountExpires)
      uac=$(printf '%s\n' "$attrs" | sed -n 's/^userAccountControl: //p')
      exp=$(printf '%s\n' "$attrs" | sed -n 's/^accountExpires: //p')
      if [ $((uac & 0x10000)) -ne 0 ] && { [ "$exp" = 0 ] || [ "$exp" = 9223372036854775807 ]; }; then
        exit 0
      fi
      samba-tool user setexpiry {{ item.name | quote }} --noexpiry >/dev/null
      echo set
    executable: /bin/bash
  loop: "{{ samba_ad_service_accounts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _svc_expiry
  changed_when: _svc_expiry.stdout == 'set'

- name: Create RBAC groups
  ansible.builtin.command:
    cmd: "samba-tool group add {{ item.name }}"
  loop: "{{ samba_ad_groups | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _grp_create
  changed_when: "'added successfully' in (_grp_create.stdout | default(''))"
  failed_when:
    - _grp_create.rc != 0
    - "'already exists' not in (_grp_create.stdout | default('') + _grp_create.stderr | default(''))"

# One member per call: samba-tool adds a comma list all-or-nothing, so a single member that is already there
# fails the call and, matched by the "already" check below, silently skips the members that are not.
- name: Add group members
  ansible.builtin.command:
    cmd: "samba-tool group addmembers {{ item.0.name }} {{ item.1 }}"
  loop: "{{ samba_ad_groups | default([]) | selectattr('members', 'defined') | list | subelements('members') }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"
  register: _grp_members
  changed_when: "'Added members' in (_grp_members.stdout | default(''))"
  failed_when:
    - _grp_members.rc != 0
    # samba-tool wording varies: "already a member" for users, but
    # "Attribute member already exists" when the member is a nested GROUP.
    - "'already a member' not in (_grp_members.stdout | default('') + _grp_members.stderr | default('')) | lower"
    - "'already exists' not in (_grp_members.stdout | default('') + _grp_members.stderr | default('')) | lower"
