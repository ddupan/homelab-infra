---
# dc1 的主机指标。Ubuntu 包默认开启 systemd collector，samba-ad-dc / samba-acme.timer 的
# 状态由此而来；chrony 的同步状态走 timex collector。不需要任何 AD 凭据。
- name: 安装 Ubuntu node_exporter 软件包
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    # 先写好监听地址再启动，避免包的 postinst 以默认 0.0.0.0:9100 起一次。
    policy_rc_d: 101
  register: samba_dc_node_exporter_pkg
  retries: 3
  delay: 5
  until: samba_dc_node_exporter_pkg is succeeded

- name: 将 exporter 绑定到 LAN 地址
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ansible managed: infrastructure/samba-ad/ansible/roles/samba_dc_monitoring
      ARGS="--web.listen-address={{ samba_dc_metrics_listen_address }}"
  notify: restart samba dc node exporter

- name: 启用主机指标服务
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  # 首次 --check 时包并没有真的装上，unit 不存在。
  when: not (ansible_check_mode and samba_dc_node_exporter_pkg is changed)
