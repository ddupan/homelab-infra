---
# Admin passwords from Bao kv/infra/samba-ad, read once at play start (pre_tasks) into the vault_* names the
# roles and inventory already use. Not a lookup in group_vars: that re-runs on every use, and a local SPIFFE
# token lives 5 minutes, so a long play would start failing halfway. Needs VAULT_TOKEN, like bao_path accounts.
#
# Replaced the ansible-vault group_vars/all/vault.yml (2026-11-18): its password also opened openbao's vault,
# so whoever could run these plays could decrypt Bao's own bootstrap secrets. Bao is rebuilt before the DC
# (CLAUDE.md rebuild order), so the DC may depend on it; openbao itself stays on ansible-vault.
- name: Read admin passwords from Bao
  community.hashi_vault.vault_kv2_get:
    url: "{{ samba_ad_bao_url }}"
    engine_mount_point: "{{ samba_ad_bao_kv_mount }}"
    path: "{{ samba_ad_bao_secrets_path }}"
    auth_method: token
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  register: samba_ad_bao_secrets
  no_log: true

# Delegated because every task templates the host's connection vars first, and on windows_admin
# ansible_password is the very variable being set here. delegate_facts: false keeps the facts on the host.
- name: Set admin password variables
  ansible.builtin.set_fact:
    vault_samba_ad_admin_password: "{{ samba_ad_bao_secrets.secret.administrator_password }}"
    vault_win_local_admin_password: "{{ samba_ad_bao_secrets.secret.win_local_admin_password }}"
  delegate_to: localhost
  delegate_facts: false
  no_log: true
