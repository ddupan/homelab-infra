---
# Homelab DNS desired state. This file is the canonical inventory; individual
# backends consume only the views they own.
homelab_dns:
  samba:
    # Samba remains authoritative for the AD zone. Only these explicitly listed
    # RRsets are reconciled; Samba-generated AD/Kerberos records are untouched.
    records:
      - { zone: ad.ddupan.top, name: incus, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: bao, type: A, values: [192.168.10.8] }
      - { zone: ad.ddupan.top, name: pve1, type: A, values: [192.168.10.4] }
      - { zone: ad.ddupan.top, name: pve2, type: A, values: [192.168.10.7] }
      - { zone: ad.ddupan.top, name: pve3, type: A, values: [192.168.10.9] }
      - { zone: ad.ddupan.top, name: retrolab, type: A, values: [10.60.0.10] }
      - { zone: ad.ddupan.top, name: grafana, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: metrics-write, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: nats, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: nexus, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: s3, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: spire-oidc, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: spire-server, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: zot, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: zot-push, type: A, values: [192.168.10.127] }

      - { zone: ad.ddupan.top, name: backstage, type: A, values: [192.168.10.127] }
      # Poweradmin UI for PowerDNS; moves to dns.lab.ddupan.top with the other services.
      - { zone: ad.ddupan.top, name: dns, type: A, values: [192.168.10.127] }
      - { zone: ad.ddupan.top, name: pg-prod, type: A, values: [192.168.10.2] }
      - { zone: ad.ddupan.top, name: pg-dev, type: A, values: [192.168.10.127] }

    # Deleted from AD (state: absent) by the samba_ad_dc role. Kept as tombstones so a
    # rerun stays a no-op and the names cannot creep back. These hosts live in
    # lab.ddupan.top (powerdns below); nothing connects to them by their ad name —
    # kube-apiserver and Bao auth use IPs (checked 2026-10-05).
    retired:
      - { zone: ad.ddupan.top, name: ayatori-dev, type: A }
      - { zone: ad.ddupan.top, name: ayatori-prod, type: A }
      - { zone: ad.ddupan.top, name: sandbox1, type: A }
      - { zone: ad.ddupan.top, name: sandbox2, type: A }
      - { zone: ad.ddupan.top, name: sandbox-k8s, type: A }

  powerdns:
    # lab.ddupan.top on PowerDNS, applied by CI via infrastructure/dns/terraform.
    # Only FIXED hosts live here: HTTPRoute names come from external-dns, ad-hoc
    # ones from Poweradmin. Names are relative to lab.ddupan.top.
    # While services migrate off ad.ddupan.top, a host may appear in both zones.
    records:
      - { name: laptop, type: A, values: [192.168.10.127] }
      - { name: incus, type: A, values: [192.168.10.127] }
      - { name: pg-prod, type: A, values: [192.168.10.2] }
      - { name: pve1, type: A, values: [192.168.10.4] }
      - { name: pve2, type: A, values: [192.168.10.7] }
      - { name: pve3, type: A, values: [192.168.10.9] }
      - { name: bao, type: A, values: [192.168.10.8] }
      # Static, outside the NEC IX pool (.128-.250); infrastructure/incus/terraform reads
      # the ayatori-* values into each container's cloud-init network-config.
      - { name: ayatori-dev, type: A, values: [192.168.10.11] }
      - { name: ayatori-prod, type: A, values: [192.168.10.12] }
      - { name: retrolab, type: A, values: [10.60.0.10] }
      - { name: sandbox1, type: A, values: [10.60.0.11] }
      - { name: sandbox2, type: A, values: [10.60.0.12] }
      - { name: sandbox-k8s, type: A, values: [10.60.0.13] }
      # LoadBalancer on the laptop, so external-dns (HTTPRoutes only) cannot publish it.
      - { name: spire-server, type: A, values: [192.168.10.127] }

  split_horizon:
    # backends records the current adoption boundary. obj is deliberately not
    # emitted to CoreDNS yet, preserving the current pod resolver behaviour.
    records:
      - { name: git.ddupan.top, type: A, values: [192.168.10.127], backends: [blocky, coredns] }
      - { name: auth.ddupan.top, type: A, values: [192.168.10.127], backends: [blocky, coredns] }
      - { name: sso.ddupan.top, type: A, values: [192.168.10.127], backends: [blocky, coredns] }
      - { name: obj.ddupan.top, type: A, values: [192.168.10.127], backends: [blocky] }

  public:
    # Names expected at Cloudflare. Terraform adoption is a separate change;
    # complete RRsets here make the current ownership gap explicit.
    records:
      - name: auth.ddupan.top
        type: CNAME
        values: [ff392451-b0b1-45bb-964e-6d9372c3a9e3.cfargotunnel.com]
        proxied: true
        terraform:
          managed: true
          resource_name: auth
      # iam-login issuer: public for browsers, split-horizon for in-cluster RPs.
      - name: sso.ddupan.top
        type: CNAME
        values: [ff392451-b0b1-45bb-964e-6d9372c3a9e3.cfargotunnel.com]
        proxied: true
        terraform:
          managed: true
          resource_name: sso
      - name: git.ddupan.top
        type: CNAME
        values: [ff392451-b0b1-45bb-964e-6d9372c3a9e3.cfargotunnel.com]
        proxied: true
        terraform: { managed: false }
      - name: obj.ddupan.top
        type: CNAME
        values: [ff392451-b0b1-45bb-964e-6d9372c3a9e3.cfargotunnel.com]
        proxied: true
        terraform: { managed: false }
      - name: e5renew.ddupan.top
        type: CNAME
        values: [ff392451-b0b1-45bb-964e-6d9372c3a9e3.cfargotunnel.com]
        proxied: true
        terraform: { managed: false }
      # OCI 主机直接解析公网 IP，SSH 不经过 Cloudflare 代理。
      - name: oci-arm.ddupan.top
        type: A
        values:
          - 129.225.138.179
        proxied: false
        ttl: 300
        terraform: { managed: false }
      - name: oci-amd.ddupan.top
        type: A
        values:
          - 129.225.176.134
        proxied: false
        ttl: 300
        terraform: { managed: false }

# 地址分配（IPAM）。A 记录本身就是地址分配，这里只补 A 记录表达不了的部分：
# 网段、不可静态分配的地址段，以及没有静态 A 记录的地址（路由器、网关、
# 自行向 AD 注册 DNS 的域成员、AP、laptop）。generate.py 校验并查找空闲地址。
homelab_ipam:
  prefixes:
    - { prefix: 192.168.10.0/24, description: "LAN，一台傻瓜交换机下的扁平二层；OSPF area 0" }
    - { prefix: 10.60.0.0/24, vlan: 100, description: "PVE SDN VNet labnet，网关在 vyos eth1" }
    - { prefix: 10.61.0.0/24, vlan: 110, description: "PVE SDN VNet retronet，网关在 vyos eth2" }
  ranges:
    - { start: 192.168.10.128, end: 192.168.10.250, description: "NEC IX DHCP 地址池（2026-09-14 起）" }
    - { start: 192.168.10.251, end: 192.168.10.254, description: "用户确认预留；扫描无响应不代表空闲" }
  addresses:
    - { address: 192.168.10.1, name: ix2215, description: "NEC IX：网关、DHCP、DNS proxy" }
    - { address: 192.168.10.2, name: vyos-rtr, description: "VyOS LAN 侧（pg-prod 也解析到这里）" }
    - { address: 192.168.10.5, name: dc1, description: "Samba AD DC，自行注册 DNS" }
    - { address: 192.168.10.6, name: winadmin, description: "Windows 管理机，域成员" }
    - { address: 192.168.10.10, name: ap-buffalo, description: "无线 AP" }
    - { address: 192.168.10.127, name: laptop, description: "k3s/NFS/libvirt；Envoy ingress 也在这里" }
    - { address: 10.60.0.1, name: vyos-rtr-labnet, description: "labnet 网关" }
    - { address: 10.61.0.1, name: vyos-rtr-retronet, description: "retronet 网关" }
