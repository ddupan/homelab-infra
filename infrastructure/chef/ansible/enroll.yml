---
# First SPIRE enrollment of Cinc nodes — the one step ../converge.py cannot do.
#
# The cookbook installs lego, the spire-node-cert script and the agent, but the
# agent cannot start without a node certificate, and the first certificate needs a
# one-time EAB from Bao (pki-spire-nodes). That credential is key material, so it
# is Ansible's job: minted here with the operator's Bao token, passed to the script
# only through its environment, never written down. Renewals need no secret.
#
# Run after the node's first ../converge.py apply (it needs what the cookbook
# installs); converge.py reports nodes that still need this.
#
#   BAO_TOKEN=... ansible-playbook enroll.yml -l <host>
#
# One-way and needs an operator token, so it never runs from CI.

- name: Enroll SPIRE agents
  hosts: cinc
  gather_facts: true
  tasks:
    - name: SPIRE node certificate present?
      ansible.builtin.stat:
        path: /etc/spire-agent/node.crt
      register: cinc_node_cert

    - name: Enroll the SPIRE agent
      when: not cinc_node_cert.stat.exists and not ansible_check_mode
      block:
        # The certificate CN is <hostname>.lab.ddupan.top (cookbook convention) and the
        # node alias matches on it; a name that resolves elsewhere would enroll the
        # wrong host, or fail http-01 against someone else's port 80.
        # Resolved on the controller, through DNS as Bao's http-01 check sees it: on the node,
        # /etc/hosts may map its own name to 127.0.1.1 (cloud-init's manage_etc_hosts).
        - name: Lab name resolves to this node
          ansible.builtin.command: getent ahostsv4 {{ ansible_hostname }}.lab.ddupan.top
          register: cinc_lab_name
          delegate_to: localhost
          changed_when: false
          failed_when: >-
            cinc_lab_name.rc != 0 or
            ansible_default_ipv4.address not in (cinc_lab_name.stdout_lines | map('split') | map('first') | list)

        - name: Bootstrap trust bundle (public; the agent keeps it current afterwards)
          ansible.builtin.command:
            argv: [kubectl, -n, spire-server, exec, spire-server-0, -c, spire-server, --,
                   /opt/spire/bin/spire-server, bundle, show]
          register: cinc_spire_bundle
          delegate_to: localhost
          run_once: true
          changed_when: false

        - name: Install bootstrap bundle
          ansible.builtin.copy:
            content: "{{ cinc_spire_bundle.stdout }}\n"
            dest: /etc/spire-agent/bootstrap-bundle.pem
            mode: '0644'
            force: false

        # The EAB call is no_log, which would hide a missing-token 403 behind a censored error.
        - name: Operator Bao token available
          ansible.builtin.assert:
            that: lookup('env', 'BAO_TOKEN') | length > 0
            fail_msg: >-
              Enrolling {{ inventory_hostname }} needs BAO_TOKEN (SPIFFE local-development
              login on the laptop, or `bao login -method=oidc`).
            quiet: true
          delegate_to: localhost

        - name: Mint a one-time EAB
          ansible.builtin.uri:
            url: "{{ cinc_bao_addr }}/v1/pki-spire-nodes/roles/node/acme/new-eab"
            method: POST
            headers:
              X-Vault-Token: "{{ lookup('env', 'BAO_TOKEN') }}"
          register: cinc_eab
          delegate_to: localhost
          no_log: true

        - name: First certificate (ACME http-01, EAB only in the environment)
          ansible.builtin.command: /usr/local/sbin/spire-node-cert
          environment:
            LEGO_EAB_KID: "{{ cinc_eab.json.data.id }}"
            LEGO_EAB_HMAC: "{{ cinc_eab.json.data.key }}"
          args:
            creates: /etc/spire-agent/node.crt
          no_log: true

        - name: Start the agent
          ansible.builtin.systemd_service:
            name: spire-agent
            state: started

        - name: Agent attested and serving the Workload API
          ansible.builtin.command: >-
            /usr/local/bin/spire-agent healthcheck
            -socketPath /run/spire/agent-sockets/spire-agent.sock
          register: cinc_agent_health
          changed_when: false
          retries: 12
          delay: 5
          until: cinc_agent_health.rc == 0
