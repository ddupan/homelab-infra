---
# Nodes converged by Cinc. Hosts are DNS names (lab.ddupan.top is the query root);
# each picks the policy (../policies/<name>.rb + lock) it runs.
all:
  vars:
    ansible_user: root
  children:
    cinc:
      hosts:
        etcd-pve1.lab.ddupan.top: {cinc_policy: etcd-pve1}
        etcd-pve2.lab.ddupan.top: {cinc_policy: etcd-pve2}
        etcd-pve3.lab.ddupan.top: {cinc_policy: etcd-pve3}
        lb-prod-1.lab.ddupan.top: {cinc_policy: loadbalancer-prod}
        lb-prod-2.lab.ddupan.top: {cinc_policy: loadbalancer-prod}
        lb-dev-1.lab.ddupan.top: {cinc_policy: loadbalancer-dev}
        lb-dev-2.lab.ddupan.top: {cinc_policy: loadbalancer-dev}
        # Ayatori 控制面：cloud-init 用户 panxiao81（免密 sudo），不开放 root 登录。
        ayatori-dev.lab.ddupan.top: {cinc_policy: ayatori-dev, ansible_user: panxiao81, ansible_become: true}
        ayatori-prod.lab.ddupan.top: {cinc_policy: ayatori-prod, ansible_user: panxiao81, ansible_become: true}
        # Ayatori 计算节点（../../compute/ansible/vm.yml 创建）：cloud-init 用户 panxiao81（免密 sudo）。
        compute-dev-1.lab.ddupan.top: {cinc_policy: compute-dev, ansible_user: panxiao81, ansible_become: true}
        compute-dev-2.lab.ddupan.top: {cinc_policy: compute-dev, ansible_user: panxiao81, ansible_become: true}
        compute-dev-3.lab.ddupan.top: {cinc_policy: compute-dev, ansible_user: panxiao81, ansible_become: true}
        # Samba AD DC：create-dc-vm.yml 的 cloud-init 用户 ansible（免密 sudo）。
        dc1.lab.ddupan.top: {cinc_policy: samba-dc, ansible_user: ansible, ansible_become: true}
