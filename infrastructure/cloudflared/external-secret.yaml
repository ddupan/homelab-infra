# Tunnel token from Bao kv/k8s/cloudflared. ESO owns the Secret; the gitignored
# secret.yaml (see secret.example.yaml) is only the break-glass copy for when Bao is down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s/cloudflared
