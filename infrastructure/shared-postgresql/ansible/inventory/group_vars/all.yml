---
pg_major: 18
pg_patroni_version: 4.1.5
# pgBackRest 要求数据库主机与仓库主机版本完全一致（协议握手比对 version），否则 archive-push
# 报 [103] "expected value 'X' for greeting key 'version'"、WAL 归档中断。未固定时，2026-10-11
# laptop 的一次 apt upgrade 单独升到 2.59.3，主库回切 laptop 后归档立即失败。升级改这里并在
# 三台（pg_hosts + pg_repository）一起跑；包被 hold，平时的 apt upgrade 不会再动它。
pg_pgbackrest_version: 2.59.3-1.pgdg24.04+1
pg_bao_url: https://bao.lab.ddupan.top:8200
pg_bao_token: "{{ lookup('env', 'BAO_TOKEN') }}"
pg_config_root: /etc/homelab-postgresql
pg_data_root: /var/lib/homelab-postgresql
pg_bin_dir: /usr/lib/postgresql/18/bin
pg_patroni_bin: /opt/homelab-patroni/bin/patroni
pg_allow_initialize: false
# 仅存放 Bao 路径，值必须在控制端 no_log 读取；不从失效读请求推断秘密不存在。
pg_secret_paths:
  prod: infra/postgresql/prod
  dev: infra/postgresql/dev
pg_etcd_secret_path: infra/etcd/consumers/patroni-pg-prod
pg_etcd_endpoints: ['192.168.10.127:2379', '10.60.0.20:2379', '10.60.0.21:2379']
# dns is the CN and what bootstrap connects to; dns_aliases are extra SANs on the
# server cert (the lab.ddupan.top name, while clients still verify the ad one).
# Each must also be allowed by the role in ../../terraform/main.tf.
pg_profiles:
  prod:
    user: pgprod
    port: 5432
    api_port: 8008
    exporter_port: 9187
    dns: pg-prod.ad.ddupan.top
    dns_aliases: [pg-prod.lab.ddupan.top]
    memory_high: 768M
    memory_max: 1G
    shared_buffers: 128MB
    max_connections: 80
  dev:
    user: pgdev
    port: 5433
    dns: pg-dev.ad.ddupan.top
    dns_aliases: [pg-dev.lab.ddupan.top]
    exporter_port: 9188
    memory_high: 256M
    memory_max: 384M
    shared_buffers: 32MB
    max_connections: 30
# 客户端网络范围；HBA 仍需独立的 TLS + SCRAM 身份认证。
pg_client_cidrs: ['192.168.10.0/24', '10.60.0.0/24', '10.42.0.0/16']
pg_replication_addresses: ['192.168.10.127/32', '10.60.0.20/32']
pg_repo_host: 10.60.0.21
pg_repo_user: pgbackup
pg_repo_path: /var/lib/homelab-pgbackrest
# SQL 指标：exporter 以实例 OS 用户经本地 socket 连接，peer + ident 映射到只读监控角色，
# 因此无需密码或 Bao；角色仅有 pg_monitor，不复用实例管理账号。
pg_monitor_user: homelab_monitor
# 升级只改版本；安装包与同版本官方 sha256sums.txt 一起下载校验，不写死摘要。
pg_exporter_version: 0.20.1
