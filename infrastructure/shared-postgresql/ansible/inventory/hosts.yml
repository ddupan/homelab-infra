          pg_lxc_disk_gb: 32
    pg_proxy:
      hosts:
        pg-proxy-vyos:
          ansible_host: 192.168.10.2
          ansible_user: vyos
          ansible_connection: ssh
          ansible_python_interpreter: /usr/bin/python3
