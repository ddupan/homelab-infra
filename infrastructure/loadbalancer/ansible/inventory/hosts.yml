---
# Ayatori LoadBalancer 主机：每个环境两台，分在不同 PVE 节点。地址取自 labnet（IPAM 见
# infrastructure/network/），环境由 BGP AS 区分，与地址无关。lb_pve 是承载它的 PVE 节点。
all:
  vars:
    ansible_user: root
  children:
    loadbalancer:
      hosts:
        lb-prod-1: {lb_pve: 192.168.10.9, lb_vmid: 160, lb_address: 10.60.0.30/24}
        lb-prod-2: {lb_pve: 192.168.10.4, lb_vmid: 161, lb_address: 10.60.0.31/24}
        lb-dev-1: {lb_pve: 192.168.10.4, lb_vmid: 162, lb_address: 10.60.0.32/24}
        lb-dev-2: {lb_pve: 192.168.10.7, lb_vmid: 163, lb_address: 10.60.0.33/24}
