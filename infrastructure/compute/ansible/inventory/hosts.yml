---
# Ayatori 计算节点（ADR-0015）的 VM：每台在不同 PVE 节点。compute_pve 是承载它的 PVE 节点。
# Dev：两台跑实例，第三台只做 DRBD 仲裁（ADR-0020），不跑实例。PVE 内存紧，只有 pve1 上的一台给得多。
all:
  vars:
    ansible_user: root
  children:
    compute:
      hosts:
        compute-dev-1: {compute_pve: 192.168.10.4, compute_vmid: 170, compute_address: 10.60.0.50/24,
                        compute_cores: 4, compute_memory: 6144, compute_disk_gb: 40}
        compute-dev-2: {compute_pve: 192.168.10.7, compute_vmid: 171, compute_address: 10.60.0.51/24,
                        compute_cores: 2, compute_memory: 2048, compute_disk_gb: 20}
        compute-dev-3: {compute_pve: 192.168.10.9, compute_vmid: 172, compute_address: 10.60.0.52/24,
                        compute_cores: 1, compute_memory: 1024, compute_disk_gb: 10}
