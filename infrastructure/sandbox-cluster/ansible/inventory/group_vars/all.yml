---
sandbox_pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
sandbox_pve_api_user: "{{ lookup('env', 'PROXMOX_USER') }}"
sandbox_pve_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
sandbox_pve_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
sandbox_pve_validate_certs: true
sandbox_pve_api_python_interpreter: "{{ lookup('env', 'PVE_API_PYTHON') | default(ansible_playbook_python, true) }}"

sandbox_bridge: labnet
sandbox_gateway: 10.60.0.1
# Blocky, not dc1: CoreDNS forwards external names to this, and Samba's internal DNS timed out
# under CI bursts (A for *.googleapis.com / checkpoint-api.hashicorp.com, 2026-11-23). Go then got
# only the AAAA answer and failed with "dial tcp [2001:…]: network is unreachable" on these
# v4-only nodes. Blocky prefetches hot names and forwards ad.ddupan.top to dc1 itself.
sandbox_nameserver: 192.168.10.127
sandbox_search_domain: ad.ddupan.top
sandbox_lxc_template: laptop:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
# One local SSD replica (pve-rg-local): nothing here needs DRBD. PostgreSQL
# streams sandbox1 -> sandbox2 and caches live on the lab registries. On
# replicated HDD, CI writes stalled PostgreSQL fsync until k3s lost its leases
# and restarted. Each LXC is pinned to its node.
sandbox_rootfs_storage: pve-rg-local
# Defaults; a host's sandbox_lxc.cores / rootfs_gb override them.
sandbox_rootfs_gb: 32
sandbox_lxc_cores: 4
sandbox_lxc_swap_mb: 2048
sandbox_lxc_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
sandbox_internal_ca_url: https://bao.lab.ddupan.top:8200/v1/pki/ca/pem
sandbox_base_packages:
  - ca-certificates
  - curl
  - jq
  - openssh-server

sandbox_postgresql_version: 16
sandbox_postgresql_data_dir: /var/lib/postgresql/{{ sandbox_postgresql_version }}/main
sandbox_postgresql_lb_address: pg-sandbox.lab.ddupan.top
sandbox_postgresql_database: k3s
sandbox_postgresql_user: k3s
sandbox_postgresql_replication_user: k3s_replication
sandbox_postgresql_rotate_passwords: false
sandbox_postgresql_k3s_password: "{{ lookup('env', 'SANDBOX_K3S_DB_PASSWORD') }}"
sandbox_postgresql_replication_password: "{{ lookup('env', 'SANDBOX_REPLICATION_PASSWORD') }}"

# Patroni leader election runs on the shared etcd (infrastructure/etcd), with
# its own account and prefix /homelab/patroni/pg-sandbox/.
# renovate: datasource=pypi depName=patroni
sandbox_patroni_version: 4.1.5
sandbox_patroni_etcd_user: patroni-pg-sandbox
sandbox_patroni_etcd_hosts:
  - 10.60.0.20:2379
  - 10.60.0.21:2379
  - 10.60.0.22:2379
# Controller-side only: signs the etcd client certificate and reads the etcd
# account. Never sent to the nodes.
sandbox_bao_url: https://bao.lab.ddupan.top:8200
sandbox_bao_token: "{{ lookup('env', 'BAO_TOKEN') }}"

# This is rendered only at playbook runtime from the Bao-provided password. K3s
# necessarily persists its datastore credential, but config.yaml is root-only.
sandbox_k3s_datastore_password_encoded: >-
  {{ sandbox_postgresql_k3s_password | urlencode | replace('/', '%2F') }}
sandbox_k3s_datastore_endpoint: >-
  {{
    [
      'postgres://', sandbox_postgresql_user, ':', sandbox_k3s_datastore_password_encoded,
      '@', sandbox_postgresql_lb_address, ':5432/', sandbox_postgresql_database, '?sslmode=disable'
    ] | join
  }}
server_config_yaml: |
  datastore-endpoint: {{ sandbox_k3s_datastore_endpoint }}
  # 写成单行：k3s-ansible 只在同一行找到 api_endpoint 时才不覆盖 tls-san。
  tls-san: [sandbox-k8s.lab.ddupan.top]
  disable:
    - servicelb
    - traefik
  # Caps kubepods below the LXC so executors hit their own cgroup limit before
  # k3s and PostgreSQL, which run outside it on the same node, run short.
  kubelet-arg:
    - system-reserved=memory=1Gi
user_kubectl: false

# renovate: datasource=github-releases depName=fluxcd/flux2
sandbox_flux_version: v2.10.1
sandbox_flux_install_url: >-
  https://github.com/fluxcd/flux2/releases/download/{{ sandbox_flux_version }}/install.yaml
sandbox_flux_repository_url: https://github.com/ddupan/homelab-infra.git
sandbox_flux_repository_branch: main
sandbox_flux_path: ./clusters/sandbox
