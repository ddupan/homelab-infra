---
all:
  children:
    sandbox_pve:
      hosts:
        pve1:
          ansible_host: 192.168.10.4
          sandbox_lxc:
            vmid: 148
            hostname: sandbox1
            address: 10.60.0.11/24
            memory_mb: 8192
        pve2:
          ansible_host: 192.168.10.7
          sandbox_lxc:
            vmid: 149
            hostname: sandbox2
            address: 10.60.0.12/24
            # pve2 has 8 threads and little else; CI uses all of them. 6G of
            # its 7.6G leaves ~1G for PVE, DRBD and etcd-pve2.
            memory_mb: 6144
            cores: 8
            rootfs_gb: 64

    k3s_cluster:
      children:
        server:
          hosts:
            sandbox1:
              ansible_host: 10.60.0.11
            sandbox2:
              ansible_host: 10.60.0.12
        agent:
          hosts: {}
      vars:
        ansible_user: root
        # renovate: datasource=github-releases depName=k3s-io/k3s
        k3s_version: v1.36.4+k3s1
        # 客户端只认名字：VIP 迁到 Ayatori LoadBalancer 时只改 DNS，证书和客户端都不动。
        api_endpoint: sandbox-k8s.lab.ddupan.top
        k3s_server_config_mode: "0600"
        use_external_database: true

    # Patroni members. Order matters only for the first start or takeover:
    # the current primary goes first so it takes the leader key.
    postgres:
      hosts:
        sandbox1:
        sandbox2:

  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
