---
all:
  children:
    sandbox_pve:
      hosts:
        pve1:
          ansible_host: 192.168.10.4
          sandbox_lxc:
            vmid: 148
            hostname: sandbox1
            address: 10.60.0.11/24
            memory_mb: 8192
        pve2:
          ansible_host: 192.168.10.7
          # Most CI lands here. One local SSD replica: nothing on the node needs
          # DRBD (PostgreSQL streams from sandbox1, caches live on the lab
          # registries), and replicating over the 1G LAN capped CI writes.
          # sandbox1 stays on pve-rg-hdd: pve1's SSD has no room for it.
          sandbox_rootfs_storage: pve-rg-local
          sandbox_lxc:
            vmid: 149
            hostname: sandbox2
            address: 10.60.0.12/24
            # pve2 has 8 threads and little else; CI uses all of them. 6G of
            # its 7.6G leaves ~1G for PVE, DRBD and etcd-pve2.
            memory_mb: 6144
            cores: 8
            rootfs_gb: 64

    k3s_cluster:
      children:
        server:
          hosts:
            sandbox1:
              ansible_host: 10.60.0.11
            sandbox2:
              ansible_host: 10.60.0.12
        agent:
          hosts: {}
      vars:
        ansible_user: root
        k3s_version: v1.36.4+k3s1
        api_endpoint: 10.60.0.13
        k3s_server_config_mode: "0600"
        use_external_database: true

    postgres_primary:
      hosts:
        sandbox1:

    postgres_standby:
      hosts:
        sandbox2:

  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
