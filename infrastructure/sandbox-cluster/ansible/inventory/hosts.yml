---
all:
  children:
    sandbox_pve:
      hosts:
        pve1:
          ansible_host: 192.168.10.4
          sandbox_lxc:
            vmid: 148
            hostname: sandbox1
            address: 10.60.0.11/24
            memory_mb: 6144
        pve2:
          ansible_host: 192.168.10.7
          sandbox_lxc:
            vmid: 149
            hostname: sandbox2
            address: 10.60.0.12/24
            memory_mb: 4096

    k3s_cluster:
      children:
        server:
          hosts:
            sandbox1:
              ansible_host: 10.60.0.11
            sandbox2:
              ansible_host: 10.60.0.12
        agent:
          hosts: {}
      vars:
        ansible_user: root
        k3s_version: v1.36.4+k3s1
        api_endpoint: 10.60.0.13
        k3s_server_config_mode: "0600"
        use_external_database: true

    postgres_primary:
      hosts:
        sandbox1:

    postgres_standby:
      hosts:
        sandbox2:

  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
