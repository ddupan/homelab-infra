---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
  register: _h_apt
  retries: 3
  delay: 15
  until: _h_apt is succeeded

- name: Restart pveproxy
  # Serves the web UI; picks up the patched proxmoxlib.js. Does NOT interrupt
  # running guests.
  ansible.builtin.systemd_service:
    name: pveproxy
    state: restarted
