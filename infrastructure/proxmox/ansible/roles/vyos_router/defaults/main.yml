---
# VyOS router VM (VM 100) — gateway for the PVE SDN VNets, BGP peer to the NEC IX.
#
# HOW THIS IS MANAGED — and why not the obvious way:
# We drive `vyos.vyos.vyos_config` with explicit `set` lines from a template,
# NOT the collection's resource modules (vyos_interfaces / vyos_ospfv2 /
# vyos_firewall_rules). Reason, verified 2026-07-25 on this box:
#   * VyOS 2025.11 REJECTS the old syntax: `set firewall name X ...` ->
#     "Configuration path: firewall [name] is not valid"
#   * vyos.vyos 6.0.0 still EMITS `firewall name` (grepped the module_utils)
# So the resource modules would generate config this release cannot parse. On a
# Stream/tech-preview build the safe move is to own the syntax ourselves;
#
# HOW CHANGES LAND: vyos_config `match: enforce` against the running config cut down to
# vyos_owned_paths (bottom of this file). Under an owned path the template IS the desired state:
# anything it no longer renders is deleted, so changing a multi-value node (name-server,
# wins-server) replaces the old value instead of appending next to it. Outside owned paths
# nothing is touched. Since 2026-11-18 this role is vyos-rtr's ONLY CLI-config writer -- the
# OCI/DN42 part used to live in infrastructure/oci -- so do not add a second one.

vyos_router_hostname: vyos-rtr

# LAN leg — eBGP to the NEC IX; the laptop learns our summaries through the IX.
vyos_lan_interface: eth0
vyos_lan_address: "192.168.10.2/24"
vyos_lan_gateway: "192.168.10.1"
vyos_lan_network: "192.168.10.0/24"

vyos_nameserver: "192.168.10.5"
vyos_dhcp_nameserver: "192.168.10.5"     # the Samba DC — see the flaky-WAN notes

# SDN legs. `vnet` is the PVE VNet the NIC is attached to.
# `dhcp.subnet_id` MUST be unique across the whole dhcp-server config (VyOS 1.4+
# requires it explicitly). Ranges deliberately start at .100 so .2-.99 stay free
# for anything that wants a static address inside a VNet.
vyos_sdn_interfaces:
  - iface: eth1
    vnet: labnet
    address: "10.60.0.1/24"
    network: "10.60.0.0/24"
    description: "labnet VLAN100 gateway"
    dhcp:
      subnet_id: 1
      start: "10.60.0.100"
      stop: "10.60.0.200"
      domain: "ad.ddupan.top"
      # Reservations sit BELOW the .100 pool start so they never collide with it.
      # Keyed on the VM's pinned MAC (see proxmox/ansible/roles/pve_vm).
      reservations:
        - { name: retrolab, mac: "bc:24:11:68:a0:51", address: "10.60.0.10" }
  - iface: eth2
    vnet: retronet
    address: "10.61.0.1/24"
    network: "10.61.0.0/24"
    description: "retronet VLAN110 gateway"
    dhcp:
      subnet_id: 2
      start: "10.61.0.100"
      stop: "10.61.0.200"
      domain: "ad.ddupan.top"
      # Retro Windows (9x/NT/2000) resolves names via NetBIOS, not DNS, so the
      # segment needs a WINS server -- this is the whole reason retronet exists.
      # Was 192.168.10.5 (the Samba DC); now retro-pdc, which is the PDC of the
      # RETRONET domain, so browser elections and domain logons resolve on-segment
      # and retronet keeps no dependency on the production DC.
      # PRECONDITION: the WINS service must actually be installed and running on
      # retro-pdc -- an unanswering wins-server option is worse than the old one.
      wins: "10.61.0.5"

# 内置 Prometheus exporter（COVERAGE P6）。只听 LAN 地址：VyOS 没有配置 firewall，
# 绑 0.0.0.0 会把指标也暴露到 SDN 网段和 wg42。集群 vmagent 经 LAN 抓取
# （platform/observability/metrics/scrapes/vyos.yaml）。端口显式写出，不依赖发行版默认值。
vyos_monitoring_listen_address: "192.168.10.2"
vyos_node_exporter_port: 9100
vyos_frr_exporter_port: 9342

# Ayatori LoadBalancer 主机的 BGP 邻居（infrastructure/network/README.md「AS」）。
# 环境由 AS 区分：每个环境一个 peer-group，入方向只收该环境 VIP 段内的 /32。
# 邻居是静态的，每台 LB 一行：listen range 会让任何 labnet 主机报上 LB 的 AS 就能
# 劫持 VIP。LB agent（内嵌 GoBGP）只主动连（port -1），所以 VyOS 侧 passive，不去连一个不监听的端口。
# BGP 实例本身是 DN42 的 AS（vyos_dn42_asn）；内部邻居以 local-as 65002 出现，因为 IX 只支持 2 字节 AS。
vyos_bgp_internal_local_as: 65002
vyos_lb_maximum_paths: 4      # >= LB hosts per environment
vyos_lb_peer_groups:
  - name: LB-PROD
    remote_as: 65100
    vip_pool: "10.62.0.0/24"
    neighbors: ["10.60.0.30", "10.60.0.31"]   # lb-prod-1, lb-prod-2
  - name: LB-DEV
    remote_as: 65101
    vip_pool: "10.62.1.0/24"
    neighbors: ["10.60.0.32", "10.60.0.33"]   # lb-dev-1, lb-dev-2

# BGP to the NEC IX (replaces OSPF; infrastructure/network/README.md 迁移清单第 1 条).
# The IX only gets summaries: its route budget is single digits. 10.60.0.0/14 is an
# aggregate (labnet, retronet, the VIP pools); the other two come from OCI over iBGP.
# Nothing is imported: VyOS keeps its static default to the IX, which is all it needs.
# No BFD on the IX, so short timers instead; the hold time negotiates to the lower side.
vyos_ix_neighbor: "192.168.10.1"
vyos_ix_remote_as: 65000
vyos_ix_aggregates: ["10.60.0.0/14"]
vyos_ix_export: ["10.60.0.0/14", "10.0.0.0/24", "172.20.0.0/14"]

# ── OCI / DN42 ────────────────────────────────────────────────────────────
# wg42 to OCI AMD, iBGP over it, DN42 SNAT, ULA RA and DNS forwarding. Lived in infrastructure/oci
# until 2026-11-18; moved so this box has ONE writer. The AMD end of the tunnel stays there and
# reads our public key back (infrastructure/oci/ansible/vyos-wg-pubkey.yml).
# Same allocation as infrastructure/oci/ansible/group_vars/all.yml (dn42_*), which the AMD side uses.
vyos_dn42_asn: 4242421811
vyos_dn42_ipv4: "172.21.111.160/27"
vyos_dn42_ipv6: "fdd0:98df:15b0::/48"
# LANs behind this router: exported to AMD, SNATed towards DN42, allowed to use the DNS forwarder.
vyos_dn42_lan_prefixes: "{{ [vyos_lan_network] + vyos_sdn_interfaces | map(attribute='network') | list }}"
# AMD's WireGuard public key is a var, not read live, so this play needs no access to OCI. It is
# public. Rotating AMD's key means updating it here (`sudo wg show wg-oci public-key` on AMD).
vyos_oci_amd_endpoint: "129.225.176.134"
vyos_oci_amd_public_key: "YN3J1JePC5JvleVRH/VamHYLBv7QglpoYmyaVo6oKAI="
vyos_dn42_ra_lans:
  - { interface: eth0, prefix: "fdd0:98df:15b0:10::/64", address: "fdd0:98df:15b0:10::1/64" }
  - { interface: eth1, prefix: "fdd0:98df:15b0:60::/64", address: "fdd0:98df:15b0:60::1/64" }
  - { interface: eth2, prefix: "fdd0:98df:15b0:61::/64", address: "fdd0:98df:15b0:61::1/64" }
vyos_dn42_dns_zones: [dn42, 20.172.in-addr.arpa, 21.172.in-addr.arpa, 22.172.in-addr.arpa,
                      23.172.in-addr.arpa, d.f.ip6.arpa]
vyos_dn42_dns_servers: [172.20.0.53, 172.23.0.53, "fd42:d42:d42:54::1", "fd42:d42:d42:53::1"]

# Config paths this role owns (regexes after `set `, matched at a token boundary). Anything under
# them that the template does not render is DELETED (tasks: match=enforce); anything outside them
# is never touched. This role is the box's only CLI-config writer, so whole subtrees are owned.
# What stays out is what the box makes for itself or nobody templates: system login, console,
# syslog, interface hw-id, and wg42's private-key (generated on the box; the template never renders
# it, so owning it would delete it and drop the tunnel). shared-postgresql's proxy.yml and
# vyos-monitoring.yml write files on the box, not CLI config.
vyos_owned_paths:
  - system host-name
  - system name-server
  - "interfaces ethernet (?:{{ ([vyos_lan_interface] + vyos_sdn_interfaces | map(attribute='iface')) | join('|') }}) (?:address|description)"
  - interfaces wireguard wg42 (?!private-key\s)\S+
  - interfaces loopback lo address
  - protocols static
  - protocols bgp
  - policy
  - nat
  - service ssh (?:port|trusted-user-ca)
  - pki openssh bao-ssh-user-ca
  - service monitoring prometheus
  - service dhcp-server
  - service router-advert
  - service dns forwarding

# Bao's SSH user CA ("ssh-rsa AAAA..."), fetched on the control node at render time like the Linux
# role openbao_ssh_ca_trust does, so a CA rotation needs no edit here. Agents then reach the
# router with 5-minute certs (principal vyos) instead of the operator's key.
vyos_ssh_user_ca_url: https://bao.lab.ddupan.top:8200/v1/ssh-client-signer/public_key
vyos_ssh_user_ca: "{{ lookup('ansible.builtin.url', vyos_ssh_user_ca_url) | trim }}"
