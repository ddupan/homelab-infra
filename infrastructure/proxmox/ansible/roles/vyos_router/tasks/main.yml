---
# Apply the desired VyOS configuration. `vyos_config` compares the rendered
# `set` lines against the running config and issues only the differences, so
# re-runs are no-ops. Supports --check and --diff.

# `| no-more` is load-bearing: without a pipe the CLI session runs at terminal width 512 and a longer
# line comes back with the character at that column replaced by a space. The SSH CA key line is
# ~760 chars, so vyos_config, reading the config the same unpiped way, never found it and re-sent it
# on every run (changed=1 forever). This read is also handed to vyos_config as its baseline below.
- name: Read current VyOS configuration commands
  vyos.vyos.vyos_command:
    commands:
      - show configuration commands | no-more
  register: _vyos_running_commands
  changed_when: false

# OSPF was replaced by BGP to the IX (infrastructure/network/README.md). The set-lines
# template cannot delete a node, so retire it here, once, together with the route-maps
# that only fed it (their `set` lines lived in infrastructure/oci's vyos-site template).
- name: Retire OSPF
  vyos.vyos.vyos_config:
    lines:
      - delete protocols ospf
      - delete policy route-map OCI-TO-OSPF
      - delete policy route-map DN42-TO-OSPF
      - delete policy prefix-list OCI-TO-OSPF
      - delete policy prefix-list DN42-TO-OSPF
    save: true
    comment: Retire OSPF (replaced by BGP to the IX)
  when: "'set protocols ospf ' in _vyos_running_commands.stdout[0]"

# VyOS 不再承载 HAProxy 入口：sandbox-k8s 与 sandbox-postgresql 都已迁到 Ayatori LoadBalancer
# （clusters/ayatori-prod/sandbox-*.yaml），pg-prod 是独立的 homelab-pg-proxy，不在 CLI 配置里。
# set-lines 模板删不掉节点，在这里一次性撤掉整个 load-balancing haproxy。
- name: Retire the VyOS HAProxy frontends
  vyos.vyos.vyos_config:
    lines:
      - delete load-balancing haproxy
    save: true
    comment: HAProxy frontends moved to Ayatori LoadBalancer
  when: "'set load-balancing haproxy ' in _vyos_running_commands.stdout[0]"

- name: Render the desired configuration
  ansible.builtin.set_fact:
    _vyos_lines: >-
      {{ lookup('template', 'vyos.conf.j2').splitlines()
         | map('trim') | reject('equalto', '') | list }}

# The baseline is the running config cut down to vyos_owned_paths. `match: enforce` then emits
# `delete` for anything in that baseline the template no longer renders -- the stale value of a
# multi-value node (name-server, wins-server) that plain `set` lines could only ever append to.
# enforce on its own scopes by TOP-LEVEL section; infrastructure/oci's vyos.yml writes to the same
# `protocols`/`policy`/`interfaces` sections on this box, so an unfiltered baseline would delete
# OCI's BGP neighbor and prefix-lists. Lines outside the scope never reach the module at all.
- name: Select the owned part of the running configuration
  ansible.builtin.set_fact:
    # Double-quoted on purpose: YAML turns `\\s`/`\n` into the regex class and a real newline.
    # In a `>-` block they reach Jinja raw and the baseline collapses into one unmatchable line.
    _vyos_owned_running: "{{ _vyos_running_commands.stdout[0].splitlines()
      | select('match', '^set (?:' ~ (vyos_owned_paths | join('|')) ~ ')(?:\\s|$)')
      | join('\n') }}"

- name: Apply configuration
  vyos.vyos.vyos_config:
    lines: "{{ _vyos_lines }}"
    # Compare against the un-mangled `| no-more` read above, not the module's own unpiped one. It
    # predates the retire tasks, but those only delete nodes outside vyos_owned_paths.
    config: "{{ _vyos_owned_running }}"
    # Needs vyos.vyos >= 6.2.0 (requirements.yml). Defaults to commit-confirm with auto-confirm, so
    # a delete that cuts off the session reverts itself after 10 minutes. It also refuses to emit
    # `delete service ssh ...`: drift there fails the run and must be removed by hand.
    match: enforce
    # Persist to config.boot; without this the config is lost on reboot.
    save: true
    # Pull the PRE-change running config back to the control host. VyOS also
    # keeps its own commit revisions (`show system commit`, `rollback N`), but
    # those are only reachable if the box is still reachable -- which is exactly
    # what a bad change takes away.
    backup: true
    backup_options:
      dir_path: "{{ playbook_dir }}/../vyos/backups"
      filename: "config.boot"
    comment: "ansible {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  register: _vyos_cfg
  # `backup: true` fetches the running config every run, which the module counts
  # as a change. Report changed ONLY when commands were actually issued,
  # otherwise real drift is indistinguishable from a routine backup.
  changed_when: (_vyos_cfg.commands | default([]) | length) > 0

- name: Show what changed
  ansible.builtin.debug:
    msg: "{{ _vyos_cfg.commands | default(['(no changes)']) }}"

# ── post-deploy verification ──────────────────────────────────────────────
# Proving the config was WRITTEN is not the same as proving the network still
# WORKS. These assert operational state, which is the part a bad change breaks.
- name: Collect operational state
  vyos.vyos.vyos_command:
    commands:
      - show bgp ipv4 neighbors {{ vyos_ix_neighbor }}
      - show interfaces
  register: _vyos_state
  changed_when: false

- name: Assert the BGP session with the IX is Established
  ansible.builtin.assert:
    that: "'BGP state = Established' in _vyos_state.stdout[0]"
    fail_msg: >-
      BGP to {{ vyos_ix_neighbor }} is not Established. The IX and the LAN have
      no route to labnet, retronet, the VIPs or OCI.
    success_msg: "BGP to {{ vyos_ix_neighbor }} is Established"

- name: Assert each SDN gateway address is actually live
  ansible.builtin.assert:
    that: "item.address in _vyos_state.stdout[1]"
    fail_msg: >-
      {{ item.iface }} ({{ item.description }}) is missing {{ item.address }} --
      guests on that VNet have no gateway.
    quiet: true
  loop: "{{ vyos_sdn_interfaces }}"
  loop_control:
    label: "{{ item.iface }} {{ item.address }}"

- name: Report
  ansible.builtin.debug:
    msg: "{{ _vyos_state.stdout[0].splitlines() | select('search', 'BGP state') | list }}"
