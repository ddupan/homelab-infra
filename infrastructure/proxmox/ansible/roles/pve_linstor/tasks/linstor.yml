---
# LINSTOR cluster: controller on one node, satellites everywhere, storage pools,
# resource group, and the PVE storage entry.
#
# All linstor CLI calls run ONCE against the controller — LINSTOR is itself a
# cluster-wide database, so repeating them per-host would just race.

- name: Enable and start the satellite on every node
  ansible.builtin.systemd_service:
    name: linstor-satellite
    enabled: true
    state: started

- name: Enable and start the controller
  ansible.builtin.systemd_service:
    name: linstor-controller
    enabled: true
    state: started
  when:
    - not (pve_linstor_controller_ha | bool)
    - inventory_hostname == pve_linstor_controller

# The Debian package enables linstor-controller on install, so without this every
# node runs one. The extra ones are EMPTY clusters (found 2026-10-09: 0 nodes, 0
# resources on pve2/pve3) — harmless only while nothing points at them.
- name: Stop and disable the controller everywhere else
  ansible.builtin.systemd_service:
    name: linstor-controller
    enabled: false
    state: stopped
  when:
    - not (pve_linstor_controller_ha | bool)
    - inventory_hostname != pve_linstor_controller

- name: Point the client at the controller(s)
  # Without this, `linstor` talks to localhost and fails on the satellites. With
  # HA the client tries the list in order; only the active node listens on 3370.
  ansible.builtin.copy:
    dest: /etc/linstor/linstor-client.conf
    mode: "0644"
    content: |
      # Managed by Ansible (role pve_linstor).
      [global]
      controllers={{ _pve_linstor_controllers | map('regex_replace', '^', 'linstor://') | join(',') }}

# LINSTOR objects go through linbit.linstor (python-linstor against the REST API),
# idempotent by state instead of parsing CLI output. Calls run once from the
# controller host, whose linstor-client.conf lists every controller (HA-safe).
- name: Wait for the controller API
  linbit.linstor.node_info:
  register: _lin_ready
  until: _lin_ready is succeeded
  retries: 24
  delay: 5
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

# ── nodes ─────────────────────────────────────────────────────────────────
- name: Register each node with LINSTOR
  linbit.linstor.node:
    name: "{{ item }}"
    ip: "{{ hostvars[item].ansible_host }}"
    node_type: "{{ 'Combined' if item == pve_linstor_controller else 'Satellite' }}"
  loop: "{{ groups['pve'] }}"
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

- name: Wait for all nodes to come ONLINE
  linbit.linstor.node_info:
  register: _nodes
  until: _nodes.nodes | rejectattr('connection_status', 'eq', 'ONLINE') | list | length == 0
  retries: 24
  delay: 5
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

# ── storage pools ─────────────────────────────────────────────────────────
- name: Create the storage pools
  linbit.linstor.storage_pool:
    name: "{{ item.1.pool }}"
    node: "{{ item.0 }}"
    driver: lvm
    driver_pool: "{{ item.1.vg }}"
  loop: "{{ groups['pve'] | product([
              {'pool': pve_linstor_ssd_pool, 'vg': pve_linstor_ssd_vg},
              {'pool': pve_linstor_hdd_pool, 'vg': pve_linstor_hdd_vg}]) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1.pool }}"
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

# ── resource groups ───────────────────────────────────────────────────────
# One per storage pool — a resource group binds to exactly one pool, so the hdd
# pool needs its own or that capacity is unusable from Proxmox.
- name: Create the resource groups
  linbit.linstor.resource_group:
    name: "{{ item.name }}"
    storage_pool: "{{ item.pool }}"
    place_count: "{{ item.place_count | default(pve_linstor_place_count) }}"
  loop: "{{ pve_linstor_resource_groups }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.pool }}"
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

# Exactly volume 0: PVE fails every disk create on a group with more than one
# ("has 3 Volume groups, but only 1 sizes were provided").
- name: Create the volume groups
  linbit.linstor.volume_group:
    resource_group: "{{ item.name }}"
    volume_nr: 0
  loop: "{{ pve_linstor_resource_groups }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

# ── PVE storage entries ───────────────────────────────────────────────────
- name: Register each resource group as PVE storage
  ansible.builtin.command:
    cmd: >-
      pvesm add drbd {{ item.name }}
      --content {{ item.content | default('images,rootdir') }}
      --controller {{ _pve_linstor_controllers | join(',') }}
      --resourcegroup {{ item.name }}
      {{ '--preferlocal yes' if item.preferlocal | default(false) else '' }}
  loop: "{{ pve_linstor_resource_groups }}"
  loop_control:
    label: "{{ item.name }}"
  register: _pvesm
  changed_when: _pvesm.rc == 0
  failed_when:
    - _pvesm.rc != 0
    - "'already defined' not in (_pvesm.stderr | default('') + _pvesm.stdout | default(''))"
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

- name: Report LINSTOR state
  ansible.builtin.shell:
    cmd: "linstor storage-pool list; echo; linstor resource-group list; echo; pvesm status"
  register: _lin_state
  changed_when: false
  run_once: true
  delegate_to: "{{ pve_linstor_controller }}"

- name: Show it
  ansible.builtin.debug:
    msg: "{{ _lin_state.stdout_lines }}"
  run_once: true
