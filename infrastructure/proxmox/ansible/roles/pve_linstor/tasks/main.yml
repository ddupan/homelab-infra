---
# LINSTOR/DRBD hyperconverged storage. Split into stages so the destructive part
# (disk wiping) is separately gated and cannot run by accident.

- name: Install packages
  ansible.builtin.import_tasks: packages.yml
  tags: [linstor_pkgs]

- name: Prepare backing storage (LVM)
  ansible.builtin.import_tasks: storage.yml
  tags: [linstor_storage]

- name: Work out the controller address list
  # One address without HA; every node with HA, since any of them may hold the
  # promoter-elected controller. Used by the client config and storage.cfg.
  ansible.builtin.set_fact:
    _pve_linstor_controllers: >-
      {{ (groups['pve'] | map('extract', hostvars, 'ansible_host') | list)
         if (pve_linstor_controller_ha | bool)
         else [hostvars[pve_linstor_controller].ansible_host] }}
  tags: [linstor_config]

- name: Configure the LINSTOR cluster
  ansible.builtin.import_tasks: linstor.yml
  tags: [linstor_config]

- name: Controller HA (promoter-managed controller on linstor_db)
  ansible.builtin.import_tasks: controller_ha.yml
  when: pve_linstor_controller_ha | bool
  tags: [linstor_config]
