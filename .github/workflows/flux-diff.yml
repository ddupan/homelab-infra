---
# 把 Flux 清单在 PR 的 merge-base 与 head 各渲染一遍（含 Helm chart 展开），diff 贴到 PR 上。
# 合并 main 即由 Flux 上线，而 lint.yml 只校验 YAML 语法：一行 chart 版本升级实际改了
# 哪些对象，只有渲染后才看得到。Renovate PR 的人工 review 与后续自动判断都以这份 diff 为输入。
# 报告模式：diff 本身不阻塞合并；渲染失败（清单坏了或 chart 拉不到）才让 job 失败。
name: flux-diff

on:
  pull_request:
    paths:
      - 'clusters/**'
      - 'platform/**'
      - 'apps/**'
      # clusters/homelab 唯一引用到 infrastructure/ 下的 Flux 路径。
      - 'infrastructure/cloudflared/**'
      - '.github/workflows/flux-diff.yml'
      - '.github/scripts/*crd_summary.py'

env:
  # flate 是 flux-local 的继任者（后者已 sunset）。暂钉上游 main 的提交：0.7.3 会把 GitRepository
  # 来源的 chart 渲染结果以 "not in store at reconcile time" 跳过（e5renew 等的 diff 整个丢失），
  # 上游 #1547 已修但未发版。0.7.4 发布后换回 release 资产 + 校验和。
  # 另一个已知盲区未修：umbrella chart 用 file://../<dir> 引用同级子 chart 时什么都不渲染
  # （opensandbox），见 home-operations/flate#1615。
  FLATE_VERSION: 9b9b3901308e
  # sandbox 的 root sync 由 Ansible 创建、不在仓库里，自动探测认不出它，所以逐个指定入口。
  # ayatori-dev/prod 下是 Ayatori 资源，不经 Flux。
  CLUSTERS: clusters/homelab clusters/sandbox
  # WAN 随机断（见 CLAUDE.md）。flate 的源缓存与二进制经 actions/cache 跨运行保留，
  # 未变的 chart 不再走 WAN，只有新版本需要下载。
  FLATE_CACHE_DIR: /tmp/flate-cache
  FLATE_BIN: /tmp/flate-bin

permissions:
  contents: read

jobs:
  # GitHub-hosted: every chart source is public (the SPIRE fork is a public Gitea package).
  diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # the diff comment
    steps:
      - uses: actions/checkout@v7
        with:
          # flate 要在本地找到 base 分支算 merge-base。
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            /tmp/flate-cache
            /tmp/flate-bin
          # 清单一变就存一份新的；restore-keys 取最近一份作起点。与 terraform.yml 不同，
          # 这里允许从旧缓存恢复：保存前 flate cache gc 会清掉 7 天未用的条目，旧 chart
          # 不会随着恢复再保存而一直留着。
          key: flate-${{ env.FLATE_VERSION }}-${{ hashFiles('clusters/**', 'platform/**', 'apps/**', 'infrastructure/cloudflared/**') }}
          restore-keys: flate-${{ env.FLATE_VERSION }}-

      # 只为从源码编译 flate；go 版本取自 .github/flate/go.mod（跟随 flate main 的 go 指令）。
      - uses: actions/setup-go@v7
        with:
          go-version-file: .github/flate/go.mod
          cache: false

      - name: Install flate
        run: |
          echo "$FLATE_BIN" >> "$GITHUB_PATH"
          [ -x "$FLATE_BIN/flate" ] && exit 0
          mkdir -p "$FLATE_BIN"
          GOBIN="$FLATE_BIN" go install "github.com/home-operations/flate/cmd/flate@$FLATE_VERSION"

      - name: crd_summary 自检
        run: python3 .github/scripts/test_crd_summary.py

      - name: diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          md=$RUNNER_TEMP/diff.md; rc=0
          # 显式取 merge-base：--base <分支> 比的是分支最新提交，PR 开出后 main 上的
          # 合并会以反向变更混进 diff。
          base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF")
          echo '## Flux 渲染 diff' >"$md"
          err=$RUNNER_TEMP/err.log
          # chart 直连上游仓库拉取，WAN 断时渲染失败；重试后仍失败才算清单或上游 chart
          # 的问题（例：上游替换已发布的 tarball，flate 校验 index digest 不符而拒绝）。
          # 退避重试（30s…120s，共约 5 分钟）以跨过短时断网；代价是真正的渲染错误也要等满
          # 这 5 分钟才报。
          render() {
            local out=$1; shift
            for i in 1 2 3 4 5; do
              flate diff -p "$c" --base "$base" "$@" >"$out" 2>"$err" && return 0
              [ $i = 5 ] || sleep $((i * 30))
            done
            return 1
          }
          for c in $CLUSTERS; do
            echo "::group::$c"
            out=$RUNNER_TEMP/out.md; crd=$RUNNER_TEMP/crd.json; code=0
            render "$out" -o github || code=1
            cat "$out" "$err"
            printf '\n### `%s`\n\n' "$c" >>"$md"
            if [ $code != 0 ]; then
              rc=1
              printf '❌ 渲染失败（重试 5 次后仍失败；若下方是网络错误，re-run 即可）\n\n```\n%s\n```\n\n' \
                "$(tail -n 50 "$err")" >>"$md"
            # flate 默认跳过 CRD（--skip-kinds 默认含 CustomResourceDefinition）；全文太长，
            # 另渲染一次 JSON 只出摘要。源已在上一轮进缓存，不再走 WAN。
            elif render "$crd" --skip-kinds Secret -o json; then
              # 解析失败不能让 step 在发评论前退出（run 默认 bash -e）。
              python3 .github/scripts/crd_summary.py <"$crd" >>"$md" ||
                printf '⚠️ CRD 摘要解析失败，见 job 日志。\n\n' >>"$md"
            else
              printf '⚠️ CRD 摘要渲染失败，见 job 日志。\n\n' >>"$md"
              cat "$err"
            fi
            # flate 的 github 输出是裸文本，`# <对象>` 与 `- 旧值` 会被 Markdown 当成标题和列表。
            if [ -s "$out" ]; then
              printf '```diff\n%s\n```\n' "$(cat "$out")" >>"$md"
            else
              echo '无渲染变更' >>"$md"
            fi
            echo "::endgroup::"
          done
          # actions/cache 在 job 结束时保存；先清掉 7 天未用的条目，缓存不随 restore-keys 无限增长。
          flate cache gc --cache-dir "$FLATE_CACHE_DIR" --max-age 168h || true
          python3 .github/scripts/tf.py comment "$md" '<!-- flux-diff -->'
          exit $rc
