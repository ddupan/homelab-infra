---
name: chef

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/chef/**'
      - '.github/workflows/chef.yml'
  pull_request:
    paths:
      - 'infrastructure/chef/**'
      - '.github/workflows/chef.yml'
# 不提供手动触发：converge 的身份（SPIRE entry，platform/spire/github-ci.yaml）只认 PR 与 main 上的
# push。临时对部分节点 converge 在本机跑 infrastructure/chef/converge.py。

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: test_converge.py
        run: |
          python3 -m pip install --user --break-system-packages --quiet uv==0.11.7
          ~/.local/bin/uv run --with pyyaml --with pytest python -m pytest -q infrastructure/chef/test_converge.py

  # homelab ARC runner：要 SSH 到 LAN 上的节点。身份经 spire-identity-exchange：PR 上是
  # …/homelab-infra/converge-whyrun，main 的 push 是 …/converge-apply（bao role ci-converge 接受 converge-*）。
  # PR 上 why-run 并贴评论；合并即 apply（与 terraform 一样，main 是期望状态），
  # 范围按改动算：policy 只影响自己的节点，执行器/inventory/本文件影响全部节点。
  converge-run:
    needs: unit
    runs-on: homelab
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, one half of the exchange's proof
      pull-requests: write # why-run comment
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # --since 要算 diff
      - uses: ddupan/ci-actions/setup-artifact-keeper@v1
        with:
          # 不开 docker：dind 的 dockerd 在 sidecar 里，Docker Hub 镜像源由 platform/sandbox-arc 配置。
          pypi: 'true'
      - uses: ddupan/ci-actions/spiffe-openbao-login@v1
        with:
          role: ci-converge

      - name: SSH certificate
        # 每次 job 一把临时 key，Bao 签 30 分钟证书；principal 与 inventory 的登录用户一致。
        # token 经 header 文件传给 curl，不出现在进程参数里。
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C "ci-converge-${GITHUB_RUN_ID}" -f "$RUNNER_TEMP/ci_key"
          printf 'X-Vault-Token: %s\n' "$BAO_TOKEN" > "$RUNNER_TEMP/bao.hdr"
          jq -n --arg k "$(cat "$RUNNER_TEMP/ci_key.pub")" '{public_key: $k, valid_principals: "root,panxiao81,ansible"}' |
            curl -fsS --retry 3 -H @"$RUNNER_TEMP/bao.hdr" --data @- \
              "${BAO_ADDR%/}/v1/ssh-client-signer/sign/ci-converge" |
            jq -er .data.signed_key > "$RUNNER_TEMP/ci_key-cert.pub"
          rm -f "$RUNNER_TEMP/bao.hdr"
          # 主机密钥来自仓库（加入时已与操作者信任的 known_hosts 核对），不做 TOFU。
          cp infrastructure/chef/known_hosts ~/.ssh/known_hosts

      - name: converge
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 -m pip install --user --break-system-packages --quiet uv==0.11.7
          args=(-i "$RUNNER_TEMP/ci_key" --summary-md "$RUNNER_TEMP/summary.md")
          case "$EVENT" in
            pull_request) args+=(--why-run --since "$PR_BASE") ;;
            push) args+=(--since "$PUSH_BEFORE") ;;
          esac
          infrastructure/chef/converge.py "${args[@]}"

      - name: PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/summary.md" ] || exit 0
          { echo '### Cinc why-run'; echo; cat "$RUNNER_TEMP/summary.md"; } > "$RUNNER_TEMP/comment.md"
          python3 .github/scripts/tf.py comment "$RUNNER_TEMP/comment.md" '<!-- chef-why-run -->'
