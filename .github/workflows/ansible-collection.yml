---
# ddupan.homelab collection 的 sanity/unit 测试。单独成 workflow 是为了只在 collection
# 改动时才跑：它每次都要重建 ansible-test 的 venv（约 2 分钟），而 collection 很少改动。
name: ansible-collection

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/samba-ad/ansible/collections/**'
      - '.github/workflows/ansible-collection.yml'
  pull_request:
    paths:
      - 'infrastructure/samba-ad/ansible/collections/**'
      - '.github/workflows/ansible-collection.yml'

jobs:
  collection-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.10

      - name: Install ansible-core and Python 3.12
        # ansible-test --python 3.12 looks for python3.12 on PATH, and the runner image only ships its own
        # system Python (26.04 has no 3.12). uv python install puts python3.12 into ~/.local/bin.
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          uv tool install ansible-core --quiet

      - name: Run ansible-test
        working-directory: infrastructure/samba-ad/ansible/collections/ansible_collections/ddupan/homelab
        run: |
          ansible-test sanity --venv --requirements --python 3.12 --color no
          ansible-test units --venv --requirements --python 3.12 --color no
