---
name: ansible

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**/ansible/**'
      - 'infrastructure/dns/**'
      - '.ansible-lint'
      - '.github/workflows/ansible.yml'
  pull_request:
    paths:
      - 'infrastructure/**/ansible/**'
      - 'infrastructure/dns/**'
      - '.ansible-lint'
      - '.github/workflows/ansible.yml'

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pick projects
        # ansible-lint 锁住整个仓库根，同一 job 内无法并行，而全量串行要几分钟；PR 只 lint
        # 改到的项目，main 和 lint 配置变更时全量。与 base 分支最新提交比较而不是 merge-base
        # （浅克隆，全量历史近 10 GiB）：main 在分叉后又改过的项目会被多选，只是多跑。
        run: |
          all=$(ls -d infrastructure/*/ansible | xargs -n1 dirname)
          projects=$all
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git fetch -q --depth=1 origin "$GITHUB_BASE_REF"; then
            changed=$(git diff --name-only FETCH_HEAD HEAD)
            if ! grep -qxE '\.ansible-lint|\.github/workflows/ansible\.yml' <<<"$changed"; then
              projects=$(for p in $all; do grep -q "^$p/" <<<"$changed" && echo "$p"; done || true)
            fi
          fi
          echo "PROJECTS=$(echo $projects)" >> "$GITHUB_ENV"
          echo "lint: ${projects:-（无）}"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.9

      # restore-keys: a Renovate bump changes the key; restoring the previous cache lets the install
      # step below reinstall only the projects whose requirements.yml changed.
      - uses: actions/cache@v6
        with:
          path: ~/.ansible/projects
          key: ansible-collections-${{ hashFiles('infrastructure/*/ansible/requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Install ansible-lint and collections
        if: env.PROJECTS != ''
        # 每个项目的 collections 装到各自目录：各项目钉的版本不同，装进同一目录会互相覆盖。
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install ansible-core --with paramiko --with pywinrm --quiet
          uv tool install ansible-lint --quiet
          # Per project: skip when the restored collections were installed from this exact
          # requirements.yml (hash stamp), otherwise reinstall that project from scratch. Not
          # re-running ansible-galaxy over an existing install also avoids its crash on git
          # collections pinned to a commit ("Non integer values in LooseVersion").
          for r in infrastructure/*/ansible/requirements.yml; do
            p=$(basename "$(dirname "$(dirname "$r")")")
            dir="$HOME/.ansible/projects/$p" stamp="$HOME/.ansible/projects/$p/.requirements.sha256"
            sum=$(sha256sum "$r" | cut -d' ' -f1)
            [ -d "$dir" ] && [ "$(cat "$stamp" 2>/dev/null)" = "$sum" ] && continue
            rm -rf "$dir"
            for i in 1 2 3; do
              ansible-galaxy collection install -r "$r" -p "$dir" && break
              [ $i = 3 ] && exit 1; sleep 10
            done
            echo "$sum" > "$stamp"
          done

      - name: ansible-lint
        if: env.PROJECTS != ''
        run: |
          # 静态检查不应依赖生产 vault 凭据。一次性 checkout 可以去掉加密变量文件；
          # syntax-check 只验证结构，不需要解析变量的运行时值。
          git grep -lz '^\$ANSIBLE_VAULT' | xargs -0r rm -f
          # ansible.cfg still declares vault_password_file. Even with encrypted
          # vars removed, ansible-lint validates that the configured file exists
          # before syntax-check starts. This throwaway value decrypts nothing.
          export ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/ansible-lint-vault-pass"
          printf '%s\n' 'ci-placeholder-not-a-production-secret' > "$ANSIBLE_VAULT_PASSWORD_FILE"
          # 自己的 collections 优先；没有 requirements.yml 的项目（docker 等）和没声明的 collection 回落到
          # 其余项目装好的那些。
          others=$(ls -d "$HOME"/.ansible/projects/* 2>/dev/null | tr '\n' ':')
          rc=0
          for p in $PROJECTS; do
            echo "::group::$p"
            export ANSIBLE_COLLECTIONS_PATH="$PWD/infrastructure/samba-ad/ansible/collections:$HOME/.ansible/projects/$(basename "$p"):$others"
            (cd "$p/ansible" && ansible-lint -c ../../../.ansible-lint --nocolor -f pep8 .) || rc=1
            echo "::endgroup::"
          done
          exit $rc
