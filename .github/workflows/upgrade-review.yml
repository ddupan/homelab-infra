name: upgrade-review

# Claude (claude-code-action, the Claude GitHub App) reviews Renovate's dependency PRs against how this
# repository uses the dependency: .github/upgrade-review.md. Its verdict goes into one sticky comment.
#
# No shell: the review reads the repository, upstream release notes (WebFetch) and this PR's own CI
# results, which already build, test and render the change. The OAuth token lives on this runner, and
# upstream text is untrusted, so the agent gets no tool that could read the environment or run code.
#
# Runs when Renovate opens the PR or retitles it (a new version), not on its frequent rebases. For a
# fresh review comment `@claude 按 .github/upgrade-review.md 重新评审` (claude.yml, same sticky comment).
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

concurrency:
  group: upgrade-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.title != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read   # CI results of this PR
      id-token: write # the action exchanges it for a Claude GitHub App token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            按仓库里 .github/upgrade-review.md 的说明评审这个依赖升级 PR，结论写进你的评论。
          claude_args: |
            --allowedTools "WebFetch,WebSearch"
            --disallowedTools "Bash"
