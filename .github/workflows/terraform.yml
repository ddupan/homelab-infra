---
name: terraform

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.hcl'
      - 'infrastructure/openbao/terraform/certs/**'
      - '.github/workflows/terraform.yml'
      - '.github/scripts/tf.py'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.hcl'
      - 'infrastructure/openbao/terraform/certs/**'
      - '.github/workflows/terraform.yml'
      - '.github/scripts/tf.py'

env:
  # 接入 plan/apply 的 root，按依赖顺序：openbao 先于依赖其 PKI/auth 的 etcd、
  # shared-postgresql 与 incus（凭 pki-incus 签发的短期客户端证书访问）。未接入的
  # 缺前置条件：动 Entra 租户的 root（ddupan-entra、e5renew）没有 Azure 身份。
  # tailscale 放最后：policy 改动即时生效，改坏 tag:ci 的规则会切断本 job 后续 root 的 LAN 访问。
  TF_ROOTS: >-
    infrastructure/openbao/terraform
    infrastructure/etcd/terraform
    infrastructure/shared-postgresql/terraform
    infrastructure/cloudflared/terraform
    infrastructure/dns/terraform
    infrastructure/incus/terraform
    apps/nexus/terraform
    apps/seaweedfs/terraform
    apps/iam-login/terraform
    infrastructure/oci/terraform
    infrastructure/gcp-ci/terraform
    infrastructure/tailscale/terraform

  # 耗时几乎全在解压 provider（aws 解压后 789MB），不在 root 数量。同一 job 内各 root 共用一份。
  # 托管 runner 直接从 registry 拉 provider，不经 tailnet 绕回 LAN 的 Artifact Keeper。
  TF_PLUGIN_CACHE_DIR: /tmp/tf-plugin-cache

# fmt 检查全部目录；validate 只给未接入 TF_ROOTS 的目录（-backend=false，不碰 state、不需要
# 凭据），接入的由 plan 校验。只在 PR 上跑：合并后配置若无效，apply 自己的 plan 同样会失败。
permissions:
  contents: read

jobs:
  # GitHub 托管 runner（2026-11-27 起试运行，原先在 homelab ARC runner）：云 API 不再绕 homelab 的 WAN，
  # state、Bao、Incus、PowerDNS 这些 LAN 服务经 tailnet（laptop 的 subnet route）访问。身份经
  # spire-identity-exchange 的 hosted stack：PR 上是 …/homelab-infra/terraform-plan，main 的 push 是
  # …/terraform-apply（bao role ci-terraform、GCP/OCI 联邦、iam-login admin-ids 都按这两个 ID 授权）。
  # 回到 ARC：runs-on 改回 homelab，tailscale/等待 LAN 两步换回 setup-artifact-keeper。
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC token: tailnet login and the exchange's proof
      pull-requests: write # plan comment
    env:
      # tailscale provider 用 job 的 GitHub OIDC token 换 API token（infrastructure/tailscale/terraform）：
      # PR 上是只读身份。
      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_TF_PLAN_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TS_TF_PLAN_AUDIENCE }}
    steps:
      - uses: actions/checkout@v7
      # Workload identity federation（GitHub OIDC），不存 secret；client ID 与 audience 不是机密，放仓库变量。
      # ephemeral 节点带 tag:ci，tailnet ACL 只放行 terraform 需要的 LAN 地址与端口。
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          # action 自己带 --accept-routes（LAN 与 10.60.0.0/14 在 laptop 的 subnet route 上），不要在 args 里重复。
          tags: tag:ci
      # 新节点的 netmap 传播是最终一致的；Bao 有任意 HTTP 应答就说明路由和 split DNS 都通了。
      - name: wait for LAN
        timeout-minutes: 3
        run: until curl -s -o /dev/null --max-time 5 https://bao.lab.ddupan.top:8200/v1/sys/health; do sleep 5; done
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.10
      - uses: hashicorp/setup-terraform@v4
        with:
          # 与本地一致；更新的 CLI 会升级 state 格式，本地旧版本随后无法读取。
          terraform_version: v1.17.2
          terraform_wrapper: false
      - name: fmt and validate
        # 重试同 init：provider 走 WAN 镜像，会随机失败。
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"; rc=0
          for d in $(git ls-files '*.tf' | xargs -n1 dirname | sort -u); do
            echo "::group::$d"
            terraform -chdir="$d" fmt -check -diff || rc=1
            # TF_ROOTS 里的 root 随后由 plan 校验，这里再 validate 一遍只是多启动一次
            # provider（aws 单个就要 40s）。
            case " $(echo $TF_ROOTS) " in *" $d "*) echo "::endgroup::"; continue ;; esac
            for i in 1 2 3; do
              terraform -chdir="$d" init -backend=false -input=false && break
              [ $i = 3 ] && rc=1; sleep 10
            done
            terraform -chdir="$d" validate || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - uses: ddupan/ci-actions/spiffe-openbao-login@v1
        with:
          role: ci-terraform

      # 全量 plan：合并后 apply 是全量的，评论必须展示它将执行的全部变更，
      # 包括与本 PR 无关的漂移——合并即批准把这些漂移收敛回 main。
      - name: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          md=$RUNNER_TEMP/plan.md; rc=0
          for r in $TF_ROOTS; do
            echo "::group::$r"
            log=$RUNNER_TEMP/plan.log; code=0
            # init 拉 provider 走 WAN，会随机失败。
            for i in 1 2 3; do
              uv run .github/scripts/tf.py run "$r" init -input=false -no-color >"$log" 2>&1 && break
              [ $i = 3 ] && code=1; sleep 10
            done
            [ $code = 0 ] && { uv run .github/scripts/tf.py run "$r" plan -input=false -no-color \
              -lock-timeout=10m -detailed-exitcode >"$log" 2>&1 || code=$?; }
            cat "$log"
            case $code in
              0) status='无变更' ;;
              2) status=$(grep -m1 '^Plan:' "$log" || echo '有变更') ;;
              *) status='❌ 失败'; rc=1 ;;
            esac
            printf '### `%s` — %s\n\n<details><summary>输出</summary>\n\n```\n%s\n```\n</details>\n\n' \
              "$r" "$status" "$(cat "$log")" >>"$md"
            echo "::endgroup::"
          done
          [ -s "$md" ] && uv run .github/scripts/tf.py comment "$md"
          exit $rc

  # main 即期望状态：每次合并对全部 root apply，手工改动会被回滚。apply 前重新 plan，
  # 而不是执行 PR 上那份 plan，两者之间若有其它合并或新漂移，结果会与评论不同。
  # 按 TF_ROOTS 顺序执行，失败即停，不继续依赖它的 root。
  terraform-apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    # One apply at a time (tf-cd-apply-race: an older run finishing last destroyed newer resources). A newer
    # pending run replaces an older pending one, which is fine: every apply converges to main as it is.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC token: tailnet login and the exchange's proof
    env:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_TF_APPLY_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TS_TF_APPLY_AUDIENCE }}
    steps:
      - uses: actions/checkout@v7
      # Workload identity federation（GitHub OIDC），不存 secret；client ID 与 audience 不是机密，放仓库变量。
      # ephemeral 节点带 tag:ci，tailnet ACL 只放行 terraform 需要的 LAN 地址与端口。
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          # action 自己带 --accept-routes（LAN 与 10.60.0.0/14 在 laptop 的 subnet route 上），不要在 args 里重复。
          tags: tag:ci
      # 新节点的 netmap 传播是最终一致的；Bao 有任意 HTTP 应答就说明路由和 split DNS 都通了。
      - name: wait for LAN
        timeout-minutes: 3
        run: until curl -s -o /dev/null --max-time 5 https://bao.lab.ddupan.top:8200/v1/sys/health; do sleep 5; done
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.10
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.17.2
          terraform_wrapper: false
      - uses: ddupan/ci-actions/spiffe-openbao-login@v1
        with:
          role: ci-terraform

      - name: apply
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for r in $TF_ROOTS; do
            echo "::group::$r"
            for i in 1 2 3; do
              uv run .github/scripts/tf.py run "$r" init -input=false -no-color && break
              [ $i = 3 ] && exit 1; sleep 10
            done
            # 状态锁由 S3 lockfile 提供；并发的 apply 等待而不是直接失败。
            uv run .github/scripts/tf.py run "$r" apply -input=false -no-color \
              -lock-timeout=10m -auto-approve
            echo "::endgroup::"
          done
