apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zot
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: external-secrets
    - name: spire
  interval: 10m
  path: ./apps/zot
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
