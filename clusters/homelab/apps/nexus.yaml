apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nexus
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: openebs
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nexus
      namespace: nexus
  interval: 10m
  path: ./apps/nexus
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
