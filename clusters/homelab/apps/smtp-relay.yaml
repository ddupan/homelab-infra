apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smtp-relay
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: smtp-relay
      namespace: smtp-relay
  interval: 10m
  path: ./apps/smtp-relay
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
