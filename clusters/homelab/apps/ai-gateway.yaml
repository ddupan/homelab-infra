apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: external-secrets
  interval: 10m
  path: ./apps/ai-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
