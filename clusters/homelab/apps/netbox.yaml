apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: openebs
  interval: 10m
  path: ./apps/netbox
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  # 与 HelmRelease 的 10m 超时对齐：wait 时 Kustomization 要等 Helm 升级完成。
  timeout: 10m
  wait: true
