apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: openebs
  interval: 10m
  path: ./apps/netbox
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  # HelmRelease 暂停期间不等待其 Ready。
  wait: false
