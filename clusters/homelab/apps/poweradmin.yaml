apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: poweradmin
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: external-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: poweradmin
      namespace: poweradmin
  interval: 10m
  path: ./apps/poweradmin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
