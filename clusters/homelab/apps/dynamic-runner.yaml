apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynamic-runner
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: nats
    - name: spire
  interval: 10m
  path: ./platform/dynamic-runner
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
