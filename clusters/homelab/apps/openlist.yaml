apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openlist
  namespace: flux-system
spec:
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: openlist
      namespace: openlist
  interval: 10m
  path: ./apps/openlist
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  wait: true
