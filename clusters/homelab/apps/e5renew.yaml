# e5renew：凭据（ESO）与 HelmRelease（chart 来自应用仓库）。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: e5renew
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 10m
  path: ./apps/e5renew
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
