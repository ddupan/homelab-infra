apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: artifact-keeper
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: external-secrets
    - name: trust-manager
  interval: 10m
  path: ./apps/artifact-keeper
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
