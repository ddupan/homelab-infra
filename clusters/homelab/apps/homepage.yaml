apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage
      namespace: homepage
  interval: 10m
  path: ./apps/homepage
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
