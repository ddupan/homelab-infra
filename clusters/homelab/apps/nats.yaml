apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: external-secrets
    - name: openebs
  interval: 10m
  path: ./platform/nats
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
