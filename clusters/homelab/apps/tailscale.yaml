apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 10m
  path: ./apps/tailscale
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  wait: false
