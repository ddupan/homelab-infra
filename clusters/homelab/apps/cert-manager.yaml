apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  # ExternalSecret 需要 ESO 的 CRD；重建时先等 external-secrets 就绪。
  dependsOn:
    - name: external-secrets
  interval: 10m
  path: ./platform/cert-manager
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  wait: false
