---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  # 仓库 2026-11 迁到 GitHub（公开，匿名只读）。这个改动先在 Gitea 上合并：Flux 从 Gitea 读到它后
  # 改为从 GitHub 拉取，之后 Gitea 上的仓库才归档。
  url: https://github.com/ddupan/homelab-infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  wait: true
