---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  timeout: 60s
  # 公网名而非集群内 Service：Gitea 将迁出 k3s（docs/gitea-oci-migration-plan.md），切换时只改
  # DNS/tunnel，Flux 自动跟随，无需拉取「修改自身 URL」的 commit。集群内经 split-horizon 到 Envoy。
  url: https://git.ddupan.top/panxiao81/homelab-infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/homelab
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m
  wait: true
