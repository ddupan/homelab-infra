# Backstage 的数据库；各插件按 schema 分开（pluginDivisionMode: schema），自 CNPG shared-db 迁入。
# 凭据由 homelab k3s 中该 namespace 自己的身份从 OpenBao 读取（参照 apps/iam-login/database.yaml）。
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
---
apiVersion: database.ayatori.ddupan.top/v1alpha1
kind: PostgreSQLTenant
metadata: {name: backstage, namespace: backstage}
spec:
  provision: {instanceRef: {name: homelab-prod}, database: backstage, loginRole: backstage}
