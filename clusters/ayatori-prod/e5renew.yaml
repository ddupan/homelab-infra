# e5renew 的数据库，自 CNPG shared-db 迁入（原先以 postgres superuser 连接）。
# 凭据由 homelab k3s 中该 namespace 自己的身份从 OpenBao 读取（参照 apps/iam-login/database.yaml）。
apiVersion: v1
kind: Namespace
metadata:
  name: e5renew
---
apiVersion: database.ayatori.ddupan.top/v1alpha1
kind: PostgreSQLTenant
metadata: {name: e5renew, namespace: e5renew}
spec:
  provision: {instanceRef: {name: homelab-prod}, database: e5renew, loginRole: e5renew}
