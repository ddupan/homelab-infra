# pg-prod 的入口，自 VyOS homelab-pg-proxy（192.168.10.2）迁入。VIP 由 Ayatori 分配，不写死；
# 切换时 pg-prod.lab.ddupan.top 改为指向本 LB Hostname 的 CNAME。TLS 由 PostgreSQL 终结，证书按名字校验。
# 只把流量给答 /primary 200 的成员；成员被判失败时断开它的已有连接，旧主上的会话不会继续写。
apiVersion: v1
kind: Namespace
metadata:
  name: shared-postgresql
---
apiVersion: network.ayatori.ddupan.top/v1alpha1
kind: Backend
metadata: {name: pg-prod-direct, namespace: shared-postgresql}
spec:
  endpoints:
    - {address: 192.168.10.127, port: 5432}
    - {address: 10.60.0.20, port: 5432}
  healthCheck:
    type: HTTP
    port: 8008
    path: /primary
    # VyOS 上 inter 2s、timeout check 3s；Backend 要求 timeout 不超过 interval，取 2s。
    interval: 2s
    timeout: 2s
    healthyThreshold: 2
    unhealthyThreshold: 3
---
# PgBouncer。健康检查仍看 Patroni：主库上的 PgBouncer 挂了不会被摘除，由 SharedPostgresPool* 告警兜。
apiVersion: network.ayatori.ddupan.top/v1alpha1
kind: Backend
metadata: {name: pg-prod-pool, namespace: shared-postgresql}
spec:
  endpoints:
    - {address: 192.168.10.127, port: 6432}
    - {address: 10.60.0.20, port: 6432}
  healthCheck:
    type: HTTP
    port: 8008
    path: /primary
    interval: 2s
    timeout: 2s
    healthyThreshold: 2
    unhealthyThreshold: 3
---
apiVersion: network.ayatori.ddupan.top/v1alpha1
kind: LoadBalancer
metadata: {name: pg-prod, namespace: shared-postgresql}
spec:
  ports:
    - {name: postgresql, port: 5432, backendRef: {name: pg-prod-direct}}
    - {name: pgbouncer, port: 6432, backendRef: {name: pg-prod-pool}}
