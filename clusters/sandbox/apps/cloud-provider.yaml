---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloud-provider
  namespace: flux-system
spec:
  dependsOn:
    - name: spire-agents
  interval: 10m
  path: ./platform/sandbox-cloud-provider
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
