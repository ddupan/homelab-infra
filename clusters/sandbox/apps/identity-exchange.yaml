---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-exchange
  namespace: flux-system
spec:
  dependsOn:
    - name: spire-agents
  interval: 10m
  path: ./platform/sandbox-identity-exchange
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
