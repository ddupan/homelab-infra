---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kata
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-operator
    - name: spire-agents
  interval: 10m
  path: ./platform/sandbox-kata
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 35m
  wait: true
