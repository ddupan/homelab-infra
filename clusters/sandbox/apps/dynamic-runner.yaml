---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynamic-runner
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: spire-agents
  interval: 10m
  path: ./platform/sandbox-dynamic-runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
