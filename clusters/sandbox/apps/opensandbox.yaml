---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opensandbox
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: kata
    - name: monitoring-operator
  interval: 10m
  path: ./platform/sandbox-opensandbox
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m
  wait: true
