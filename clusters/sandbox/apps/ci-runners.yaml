---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ci-runners
  namespace: flux-system
spec:
  dependsOn:
    - name: opensandbox
    - name: spire-agents
  interval: 10m
  path: ./platform/sandbox-ci-runners
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
  wait: true
