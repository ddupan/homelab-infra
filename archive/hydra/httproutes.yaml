apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hydra-public
  namespace: hydra
spec:
  parentRefs:
  - name: eg
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - hydra.ad.ddupan.top
  rules:
  - backendRefs:
    - name: hydra-public
      port: 4444
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hydra-login
  namespace: hydra
spec:
  parentRefs:
  - name: eg
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - hydra-login.ad.ddupan.top
  rules:
  - backendRefs:
    - name: hydra-login
      port: 8080
