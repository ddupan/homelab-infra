apiVersion: v1
kind: Service
metadata:
  name: shared-postgresql
  namespace: shared-db
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: shared-postgresql
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: shared-postgresql-tailscale
  namespace: shared-db
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    cnpg.io/cluster: shared-postgresql
    cnpg.io/instanceRole: primary
  ports:
    - name: tcp-postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
