---
# 安全扫描（ci-actions/security-scan），报告模式：发现只在 PR 上评论，不阻塞合并。
# 排除目录等仓库级设置在 .semgrepignore 与 trivy.yaml。
name: security-scan

on:
  pull_request:
  schedule:
    # 依赖漏洞随时间出现，与 PR 无关；每周全量扫一次，结果写 job 日志。
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    # 云端池（GKE Autopilot）：扫描器直接装在 runner 上，不需要 Docker 和内网。
    runs-on: [cloud]
    steps:
      - uses: actions/checkout@v7
      - uses: https://git.ddupan.top/panxiao81/ci-actions/security-scan@v1
        with:
          cloud: 'true'
