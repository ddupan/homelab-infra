# Renovate PR 的升级评审（ci-actions/upgrade-review），用于不改 Flux 路径的 PR（Ansible、Terraform、
# CI 工具等）。改 Flux 路径的 PR 由 flux-diff.yml 里的同名 job 评审，带上渲染 diff；paths-ignore 与
# flux-diff.yml 的 paths 保持一致。
# ponytail: 同时改了两类路径的 PR 会评审两次，后完成的覆盖同一条评论；Renovate 很少这样分组。
name: upgrade-review

on:
  pull_request:
    paths-ignore:
      - 'clusters/**'
      - 'platform/**'
      - 'apps/**'
      # clusters/homelab 唯一引用到 infrastructure/ 下的 Flux 路径。
      - 'infrastructure/cloudflared/**'

jobs:
  # job id 是 SPIFFE ID 的一部分（bao role ci-upgrade-review），改名会登录失败。
  upgrade-review:
    if: github.event.pull_request.user.login == 'renovate-bot'
    runs-on: [self-hosted]
    steps:
      - uses: https://git.ddupan.top/panxiao81/ci-actions/upgrade-review@v1
