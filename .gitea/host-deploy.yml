# Which version variables deploy on merge (.gitea/workflows/host-deploy.yml). When a push to main changes
# `<var>:` under infrastructure/<project>/ansible/, CI runs that playbook, then runs it a second time and
# fails if that run changes anything. Anything not listed stays a manual deploy (the Renovate PR says so).
#
# The WHOLE playbook runs from main, so other pending changes in it go out too — main is the desired state,
# as for terraform.yml and chef.yml. That is why a playbook only belongs here if:
#   - it needs no secret on the controller (no ansible-vault, no Bao KV: the CI role can only sign SSH certs),
#   - its hosts' login user is in the ci-host-deploy SSH role (infrastructure/openbao/terraform/ssh.tf) and
#     their host key is in .gitea/host-deploy-known_hosts,
#   - a bad version costs little and is fixed by the next merge.
# Deliberately not here: gitea.yml (would restart Gitea under its own Actions job), openbao (ansible-vault, root
# of trust), shared-postgresql (pg-laptop is ansible_connection: local; pgbouncer/pgbackrest want a window),
# retrolab (usually powered off).
- var: renovate_version
  project: oci
  playbook: renovate.yml
- var: data_monitor_exporter_version
  project: shared-data-monitoring
  playbook: site.yml
- var: samba_ad_acme_release
  project: samba-ad
  playbook: acme-dc.yml
